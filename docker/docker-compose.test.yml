# =============================================================================
# Docker Compose Configuration for Testing (STANDALONE)
# Usage: docker compose -f docker/docker-compose.test.yml up -d
#        docker compose -f docker/docker-compose.test.yml exec test-app uv run pytest tests/ -v
#
# SECURITY NOTE (INF-011): These ports are intentionally exposed to the host for
# development workflow convenience. They enable:
#   - Running pytest directly from host terminal (native execution)
#   - Database GUI tools for debugging test database state
#   - Parallel dev+test environment execution (shifted ports avoid conflicts)
#
# Risk Assessment:
#   - LOW severity: Test database contains NO production data
#   - Uses default passwords: test_password (postgres), test_app_password (mkobi_app)
#   - Bind address: 0.0.0.0 (Docker default, localhost-only on most systems)
#   - No CI/CD pipelines found that depend on these ports
#
# Alternatives considered but NOT recommended for removal:
#   - Bind to 127.0.0.1: Adds complexity without significant security gain
#   - Network-only access: Would break documented host-side pytest workflow
#   - Override file: Adds developer friction for common use case
#
# See TASK_055_assess_test_ports_removal_impact for full assessment.
# =============================================================================

name: mkobi-test

services:
  test-db:
    # Pinned by digest (resolved from the registry on 2026-10-05 with
    # ``docker buildx imagetools inspect postgres:18-bookworm --format '{{.Manifest.Digest}}'``).
    image: postgres:18-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_DB: bidb_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test_password
      MKOBI_APP_PASSWORD: test_app_password
      # Initialize with builtin locale provider for immutable collation (no OS-dependent version changes).
      # C.UTF-8 supports both Latin and Cyrillic properly, unlike C/POSIX which is ASCII-only.
      POSTGRES_INITDB_ARGS: "--locale-provider=builtin --locale=C.UTF-8"
    volumes:
      - test_postgres_data:/var/lib/postgresql
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      # Host port configurable to allow parallel checkouts on one machine.
      # Default 5434 (5433 is commonly taken by other projects' test databases).
      - "${TEST_DB_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bidb_test"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
    networks:
      - test_network

  test-redis:
    # Pinned by digest (resolved from the registry on 2026-10-05 with
    # ``docker buildx imagetools inspect redis:7.4-alpine --format '{{.Manifest.Digest}}'``).
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    volumes:
      - test_redis_data:/data
    ports:
      # Host port configurable for parallel checkouts (default 6381).
      - "${TEST_REDIS_HOST_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
    networks:
      - test_network

  test-migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: test
    command: ["alembic", "upgrade", "head"]
    environment:
      ENV: test
      HOME: /tmp
      UV_CACHE_DIR: /tmp/.cache/uv
      DATABASE__HOST: test-db
      DATABASE__PORT: 5432
      DATABASE__USER: postgres
      DATABASE__PASSWORD: test_password
      DATABASE__DBNAME: bidb_test
      DATABASE__TEST_DBNAME: bidb_test
      DATABASE__ADMIN_USER: postgres
      DATABASE__ADMIN_PASSWORD: test_password
      REDIS__HOST: test-redis
      REDIS__PORT: 6379
      JWT__SECRET_KEY: test_jwt_secret_key_for_integration_tests_32_chars
      JWT__ALGORITHM: HS256
      ADMIN_USERNAME: test-admin@example.com
      ADMIN_PASSWORD: test-password-for-integration-tests
    volumes:
      # alembic.ini resolves script_location as %(here)s/alembic, i.e. /app/alembic.
      # Without this mount a new migration would stay invisible to the image's
      # baked copy, exactly like the test-app defect. Mirrors the dev override.
      - ../alembic:/app/alembic
    depends_on:
      test-db:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - test_network

  test-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: test
    environment:
      ENV: test
      HOME: /tmp
      UV_CACHE_DIR: /tmp/.cache/uv
      DATABASE__HOST: test-db
      DATABASE__PORT: 5432
      DATABASE__USER: mkobi_app
      DATABASE__PASSWORD: test_app_password
      DATABASE__DBNAME: bidb_test
      DATABASE__TEST_DBNAME: bidb_test
      DATABASE__ADMIN_USER: postgres
      DATABASE__ADMIN_PASSWORD: test_password
      REDIS__HOST: test-redis
      REDIS__PORT: 6379
      JWT__SECRET_KEY: test_jwt_secret_key_for_integration_tests_32_chars
      JWT__ALGORITHM: HS256
      ADMIN_USERNAME: test-admin@example.com
      ADMIN_PASSWORD: test-password-for-integration-tests
      LOGGING__LEVEL: WARNING
      RECREATE_TEST_DB: "true"
    volumes:
      - ../src:/app/src
      - ../tests:/app/tests
      # tests/test_config.py resolves docker/ via Path(__file__).parent.parent;
      # without this the suite asserts against the image's baked copy.
      - ../docker:/app/docker
      # pytest reads [tool.pytest.ini_options] from this file at the rootdir.
      # Without this mount the gate grades the image's baked pytest config, so
      # a host-side change to markers, addopts or coverage gates is invisible.
      - ../pyproject.toml:/app/pyproject.toml
      # tests/test_migration_lock.py reads alembic/env.py via
      # Path(__file__).parent.parent; without this the source-contract test
      # asserts against the baked copy, exactly like the docker/ mount above.
      - ../alembic:/app/alembic
      # tests/test_config.py asserts the quality-gate wiring by reading
      # Makefile.ps1 (which invariant runs against which compose service);
      # without this mount the suite cannot see the file at all.
      - ../Makefile.ps1:/app/Makefile.ps1
    ports:
      # Host port configurable for parallel checkouts (default 8001).
      - "${TEST_APP_HOST_PORT:-8001}:8000"
    depends_on:
      test-migrate:
        condition: service_completed_successfully
      test-db:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - test_network
    command: ["tail", "-f", "/dev/null"]

volumes:
  test_postgres_data:
  test_redis_data:

networks:
  test_network:
    driver: bridge

