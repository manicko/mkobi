# =============================================================================
# Docker Compose for mkobi BI Dashboard System
# Production configuration with multi-stage Dockerfile support
# Usage:
#   Production:  docker compose --env-file docker/.env.production -f docker/docker-compose.yml up -d
#   Development: docker compose -f docker/docker-compose.yml -f docker/docker-compose.override.yml up -d
#   Test:        docker compose -f docker/docker-compose.test.yml up -d
# =============================================================================

name: mkobi

services:
  # Shared configuration can be referenced with <<: *app-common
  # Note: Using explicit config instead of YAML anchors for clarity

  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: bidb
      POSTGRES_USER: postgres
      # NOTE: ${VAR:?} enforces presence only, not strength. The production tier is
      # pinned in this file, so the application checks credential strength at startup
      # and refuses weak, placeholder and empty values.
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD:?DATABASE__PASSWORD is required}
      MKOBI_APP_PASSWORD: ${MKOBI_APP_PASSWORD:?MKOBI_APP_PASSWORD is required}
      # Initialize with builtin locale provider for immutable collation (no OS-dependent version changes).
      # C.UTF-8 supports both Latin and Cyrillic properly, unlike C/POSIX which is ASCII-only.
      # Using -bookworm tag for stability (will upgrade to -trixie when needed).
      POSTGRES_INITDB_ARGS: "--locale-provider=builtin --locale=C.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql
      # Mount initialization scripts to create app role on first run
      - ../docker/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bidb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M

  # Migration service - runs alembic migrations before app starts
  # This ensures database schema is up-to-date before the application starts
  # NOTE: Using postgres superuser for migrations is a common pattern.
  # For improved security, consider creating a dedicated migration role
  # with DDL privileges only (not superuser) in production environments.
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: prod
    command: ["alembic", "upgrade", "head"]
    environment:
      # The production tier is pinned: this file is the production deployment
      # definition and must not resolve to another tier through an env file.
      ENV: production
      DATABASE__HOST: db
      DATABASE__PORT: 5432
      DATABASE__USER: postgres
      # NOTE: ${VAR:?} enforces presence only, not strength. The production tier is
      # pinned in this file, so the application checks credential strength at startup
      # and refuses weak, placeholder and empty values.
      DATABASE__PASSWORD: ${DATABASE__PASSWORD:?DATABASE__PASSWORD is required}
      DATABASE__DBNAME: bidb
      DATABASE__TEST_DBNAME: bidb_test
      JWT__SECRET_KEY: ${JWT__SECRET_KEY:?JWT__SECRET_KEY is required}
      JWT__ALGORITHM: HS256
      # Admin credentials for initial setup
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      # Settings() is constructed at the pinned production tier, so the same
      # placeholder-origin guard the app satisfies applies here too. Same shape
      # as the app service: a missing value falls back to the shipped
      # placeholder and fails closed at settings construction.
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      # get_config() builds Settings and creates the upload temp directory, so
      # alembic needs a writable absolute path. HOME is /nonexistent in the prod
      # image, which makes the platformdirs default uncreatable for the app user.
      UPLOAD__TEMP_DIR: /app/data/tmp_uploads
    depends_on:
      db:
        condition: service_healthy
    # Run migrations once and exit - no restart needed
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ${DOCKER_TARGET:-prod}
      args:
        - UV_VERSION=0.11.16
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      # The production tier is pinned: this file is the production deployment
      # definition and must not resolve to another tier through an env file.
      ENV: production
      DATABASE__HOST: db
      DATABASE__PORT: 5432
      # Application role with limited privileges for runtime operations
      DATABASE__USER: mkobi_app
      DATABASE__PASSWORD: ${MKOBI_APP_PASSWORD:?MKOBI_APP_PASSWORD is required}
      DATABASE__DBNAME: bidb
      DATABASE__TEST_DBNAME: bidb_test
      # SECURITY: JWT__SECRET_KEY must be set in production.
      JWT__SECRET_KEY: ${JWT__SECRET_KEY:?JWT__SECRET_KEY is required}
      JWT__ALGORITHM: HS256
      # Admin credentials
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      UPLOAD__TEMP_DIR: /app/data/tmp_uploads
      LOGGING__LOG_FILE: /app/data/logs/app.log
      # Redis connection for rate limiting and token revocation (fail-closed).
      # Default host is "localhost" (config.py), which is the container itself,
      # so it must be overridden to the compose service name.
      REDIS__HOST: redis
      REDIS__PORT: "6379"
      # Default is a known placeholder origin: src/mkobi/config.py rejects it when
      # ENV=production, so a missing value fails closed at app startup instead of
      # silently serving a permissive policy.
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      LOGGING__LEVEL: ${LOGGING__LEVEL:-INFO}
      # Security controls the production tier relies on; supplied with the
      # production defaults docker/.env.production declares.
      RATE_LIMITER_FAIL_CLOSED: ${RATE_LIMITER_FAIL_CLOSED:-true}
      UPLOAD__MAX_FILE_SIZE_MB: ${UPLOAD__MAX_FILE_SIZE_MB:-100}
      LOGGING__JSON_LOGGING: ${LOGGING__JSON_LOGGING:-true}
      # AUTO_MIGRATE removed - migrations handled by dedicated migrate service
    volumes:
      - app_data:/app/data
    restart: unless-stopped
    # Security: read-only root filesystem with explicit writable paths via app_data volume
    read_only: true
    # Security: prevent privilege escalation via setuid/setgid binaries
    security_opt:
      - no-new-privileges:true
    # Security: drop all Linux capabilities (app binds to port 8000, no privileged ports)
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M

  # Redis for task queue (RQ workers)
  redis:
    image: redis:7.4-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M

  # RQ worker for background task processing (file uploads, data aggregation)
  rq-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: prod
    command: ["/app/.venv/bin/python", "-m", "mkobi.rq_worker_wrapper"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # The production tier is pinned: this file is the production deployment
      # definition and must not resolve to another tier through an env file.
      ENV: production
      DATABASE__HOST: db
      DATABASE__PORT: 5432
      DATABASE__USER: mkobi_app
      DATABASE__PASSWORD: ${MKOBI_APP_PASSWORD:?MKOBI_APP_PASSWORD is required}
      DATABASE__DBNAME: bidb
      DATABASE__TEST_DBNAME: bidb_test
      # SECURITY: JWT__SECRET_KEY must be set in production.
      JWT__SECRET_KEY: ${JWT__SECRET_KEY:?JWT__SECRET_KEY is required}
      JWT__ALGORITHM: HS256
      # Admin credentials
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      # Settings() is constructed at the pinned production tier, so the same
      # placeholder-origin guard the app satisfies applies here too. Same shape
      # as the app service: a missing value falls back to the shipped
      # placeholder and fails closed at settings construction.
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      UPLOAD__TEMP_DIR: /app/data/tmp_uploads
      LOGGING__LOG_FILE: /app/data/logs/app.log
      LOGGING__LEVEL: ${LOGGING__LEVEL:-INFO}
      # Redis connection for consuming jobs from the queue the app produces to.
      # Default host is "localhost" (config.py), which is the container itself,
      # so it must be overridden to the compose service name. Without these the
      # producer and consumer can silently diverge onto different Redis
      # databases and every submission fails silently at execution time.
      REDIS__HOST: redis
      REDIS__PORT: "6379"
      REDIS__DB: "0"
      # Security controls the production tier relies on; supplied with the
      # production defaults docker/.env.production declares.
      RATE_LIMITER_FAIL_CLOSED: ${RATE_LIMITER_FAIL_CLOSED:-true}
      UPLOAD__MAX_FILE_SIZE_MB: ${UPLOAD__MAX_FILE_SIZE_MB:-100}
      LOGGING__JSON_LOGGING: ${LOGGING__JSON_LOGGING:-true}
      AUTO_MIGRATE: "false"
    volumes:
      - app_data:/app/data
      - ../alembic:/app/alembic:ro
      - ../alembic.ini:/app/alembic.ini:ro
    restart: unless-stopped
    healthcheck:
      # Observe the worker registry, not the broker: a Redis ping is green even
      # when the worker is dead, wedged, mis-subscribed or in a startup retry.
      test:
        - "CMD"
        - "/app/.venv/bin/python"
        - "-c"
        - "from mkobi.rq_worker_wrapper import main; main()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M

  # NOTE: nginx requires a prior frontend build (npm run build in /frontend)
  # Frontend dist files are mounted from ../frontend/dist
  # This service is production-only (profiles: [production])
  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ../docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    restart: unless-stopped
    # Security: read-only root filesystem with explicit writable tmpfs paths
    # nginx writes to these directories at runtime: cache, PID files, logs
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      - /var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - production
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

volumes:
  postgres_data:
  app_data:
  redis_data:

networks:
  default:
    driver: bridge