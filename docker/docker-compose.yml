# =============================================================================
# Docker Compose for mkobi BI Dashboard System
# Production configuration with multi-stage Dockerfile support
# Usage:
#   Production:  docker compose --env-file docker/.env.production -f docker/docker-compose.yml up -d
#   Development: docker compose -f docker/docker-compose.yml -f docker/docker-compose.override.yml up -d
#   Test:        docker compose -f docker/docker-compose.test.yml up -d
# =============================================================================

name: mkobi

services:
  # Shared configuration can be referenced with <<: *app-common
  # Note: Using explicit config instead of YAML anchors for clarity

  db:
    # Pinned by digest (resolved from the registry on 2026-10-05 with
    # ``docker buildx imagetools inspect postgres:18-bookworm --format '{{.Manifest.Digest}}'``).
    # The tag is retained for human readability; the digest is the build input.
    image: postgres:18-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_DB: bidb
      POSTGRES_USER: postgres
      # NOTE: ${VAR:?} enforces presence only, not strength. The production tier is
      # pinned in this file, so the application checks credential strength at startup
      # and refuses weak, placeholder and empty values.
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD:?DATABASE__PASSWORD is required}
      MKOBI_APP_PASSWORD: ${MKOBI_APP_PASSWORD:?MKOBI_APP_PASSWORD is required}
      # Initialize with builtin locale provider for immutable collation (no OS-dependent version changes).
      # C.UTF-8 supports both Latin and Cyrillic properly, unlike C/POSIX which is ASCII-only.
      # Using -bookworm tag for stability (will upgrade to -trixie when needed).
      POSTGRES_INITDB_ARGS: "--locale-provider=builtin --locale=C.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql
      # Mount initialization scripts to create app role on first run
      - ../docker/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bidb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M

  # Migration service - runs alembic migrations before app starts
  # This ensures database schema is up-to-date before the application starts
  # NOTE: Using postgres superuser for migrations is a common pattern.
  # For improved security, consider creating a dedicated migration role
  # with DDL privileges only (not superuser) in production environments.
  migrate:
    # Locally-built artefact. The repository is the local image store, not a
    # registry: nothing is pushed anywhere, so a rollback selects a previously
    # built tag from the local daemon. ``:latest`` is deliberately not used —
    # latest is not a selectable rollback target. The tag is overridable from
    # .env via IMAGE_TAG without touching this file.
    image: mkobi/migrate:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: prod
      # DP-10-8/B5: all three built services receive the same uv version from one
      # place. If this is set on ``app`` only, the other two fall back to the
      # Dockerfile default and the three services silently build from different
      # inputs. The value is repeated here so a single edit to UV_VERSION (or an
      # override from .env) governs migrate, app and rq-worker identically.
      args:
        - UV_VERSION=${UV_VERSION:-0.11.16}
    command: ["alembic", "upgrade", "head"]
    environment:
      # The production tier is pinned: this file is the production deployment
      # definition and must not resolve to another tier through an env file.
      ENV: production
      DATABASE__HOST: db
      DATABASE__PORT: 5432
      DATABASE__USER: postgres
      # NOTE: ${VAR:?} enforces presence only, not strength. The production tier is
      # pinned in this file, so the application checks credential strength at startup
      # and refuses weak, placeholder and empty values.
      DATABASE__PASSWORD: ${DATABASE__PASSWORD:?DATABASE__PASSWORD is required}
      DATABASE__DBNAME: bidb
      DATABASE__TEST_DBNAME: bidb_test
      JWT__SECRET_KEY: ${JWT__SECRET_KEY:?JWT__SECRET_KEY is required}
      JWT__ALGORITHM: HS256
      # Admin credentials for initial setup
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      # Settings() is constructed at the pinned production tier, so the same
      # placeholder-origin guard the app satisfies applies here too. Same shape
      # as the app service: a missing value falls back to the shipped
      # placeholder and fails closed at settings construction.
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      # get_config() builds Settings and creates the upload temp directory, so
      # alembic needs a writable absolute path. HOME is /nonexistent in the prod
      # image, which makes the platformdirs default uncreatable for the app user.
      UPLOAD__TEMP_DIR: /app/data/tmp_uploads
    depends_on:
      db:
        condition: service_healthy
    # Run migrations once and exit - no restart needed
    restart: "no"
    # Security: prevent privilege escalation via setuid/setgid binaries. The
    # migrator runs ``alembic upgrade``, whose write surface is the database, so
    # it carries the same boundary as app and rq-worker but not ``read_only``:
    # a read-only filesystem here buys nothing for a job that writes only SQL.
    security_opt:
      - no-new-privileges:true
    # Security: drop all Linux capabilities. ``alembic upgrade`` needs none; a
    # migrator that needs a capability wants more privilege than its job requires.
    cap_drop:
      - ALL

  app:
    # Locally-built artefact consumed locally, never pushed to a registry. See
    # the migrate service for the rollback rationale on a real tag.
    image: mkobi/app:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ${DOCKER_TARGET:-prod}
      # DP-10-8/B5: same uv version as migrate and rq-worker, from one place.
      args:
        - UV_VERSION=${UV_VERSION:-0.11.16}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      # Startup ordering only, NOT a correctness dependency. The reconciler lease
      # fails open, so the app boots and sweeps even with Redis down; waiting for
      # redis here merely avoids starting in the fail-open state for the first
      # seconds of a slow Redis boot.
      redis:
        condition: service_healthy
    environment:
      # The production tier is pinned: this file is the production deployment
      # definition and must not resolve to another tier through an env file.
      ENV: production
      DATABASE__HOST: db
      DATABASE__PORT: 5432
      # Application role with limited privileges for runtime operations
      DATABASE__USER: mkobi_app
      DATABASE__PASSWORD: ${MKOBI_APP_PASSWORD:?MKOBI_APP_PASSWORD is required}
      DATABASE__DBNAME: bidb
      DATABASE__TEST_DBNAME: bidb_test
      # SECURITY: JWT__SECRET_KEY must be set in production.
      JWT__SECRET_KEY: ${JWT__SECRET_KEY:?JWT__SECRET_KEY is required}
      JWT__ALGORITHM: HS256
      # Admin credentials
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      UPLOAD__TEMP_DIR: /app/data/tmp_uploads
      # LOGGING__LOG_FILE is intentionally not set here. Setting it on every
      # process made four rotating handlers (app, rq-worker, migrate and the
      # dev worker) write the same file, so the rotation ceiling was
      # 4 x 6 files x 10 MB ~= 240 MB. The setting still works when an operator
      # supplies it explicitly in .env; it is simply no longer set for everyone.
      # Redis connection for rate limiting and token revocation (fail-closed).
      # Default host is "localhost" (config.py), which is the container itself,
      # so it must be overridden to the compose service name.
      REDIS__HOST: redis
      REDIS__PORT: "6379"
      # Default is a known placeholder origin: src/mkobi/config.py rejects it when
      # ENV=production, so a missing value fails closed at app startup instead of
      # silently serving a permissive policy.
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      LOGGING__LEVEL: ${LOGGING__LEVEL:-INFO}
      # uvicorn's ProxyHeadersMiddleware consults X-Forwarded-For only when the
      # peer is in this trusted set. The value must be the compose network's
      # subnet; the default is the subnet mkobi_default uses on the reference
      # host and is operator-overridable without an image rebuild. A mismatched
      # value fails safe (no peer trusted, no forwarding header read) and
      # produces no log output, because the proxy-headers module does not log.
      # Never set this to "*": wildcard trust returns the left-most,
      # client-controlled forwarded entry with no untrusted-hop walk.
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-172.21.0.0/16}"
      # Security controls the production tier relies on; supplied with the
      # production defaults docker/.env.production declares.
      RATE_LIMITER_FAIL_CLOSED: ${RATE_LIMITER_FAIL_CLOSED:-true}
      UPLOAD__MAX_FILE_SIZE_MB: ${UPLOAD__MAX_FILE_SIZE_MB:-100}
      LOGGING__JSON_LOGGING: ${LOGGING__JSON_LOGGING:-true}
      # AUTO_MIGRATE removed - migrations handled by dedicated migrate service
    volumes:
      - app_data:/app/data
    restart: unless-stopped
    # Security: read-only root filesystem with explicit writable paths via app_data volume
    read_only: true
    # Security: prevent privilege escalation via setuid/setgid binaries
    security_opt:
      - no-new-privileges:true
    # Security: drop all Linux capabilities (app binds to port 8000, no privileged ports)
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M

  # Redis for task queue (RQ workers)
  redis:
    # Pinned by digest (resolved from the registry on 2026-10-05 with
    # ``docker buildx imagetools inspect redis:7.4-alpine --format '{{.Manifest.Digest}}'``).
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M

  # RQ worker for background task processing (file uploads, data aggregation)
  rq-worker:
    # Locally-built artefact consumed locally, never pushed to a registry. See
    # the migrate service for the rollback rationale on a real tag.
    image: mkobi/rq-worker:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: prod
      # DP-10-8/B5: same uv version as migrate and app, from one place.
      args:
        - UV_VERSION=${UV_VERSION:-0.11.16}
    command: ["/app/.venv/bin/python", "-m", "mkobi.rq_worker_wrapper"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # The production tier is pinned: this file is the production deployment
      # definition and must not resolve to another tier through an env file.
      ENV: production
      DATABASE__HOST: db
      DATABASE__PORT: 5432
      DATABASE__USER: mkobi_app
      DATABASE__PASSWORD: ${MKOBI_APP_PASSWORD:?MKOBI_APP_PASSWORD is required}
      DATABASE__DBNAME: bidb
      DATABASE__TEST_DBNAME: bidb_test
      # SECURITY: JWT__SECRET_KEY must be set in production.
      JWT__SECRET_KEY: ${JWT__SECRET_KEY:?JWT__SECRET_KEY is required}
      JWT__ALGORITHM: HS256
      # Admin credentials
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      # Settings() is constructed at the pinned production tier, so the same
      # placeholder-origin guard the app satisfies applies here too. Same shape
      # as the app service: a missing value falls back to the shipped
      # placeholder and fails closed at settings construction.
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      UPLOAD__TEMP_DIR: /app/data/tmp_uploads
      LOGGING__LEVEL: ${LOGGING__LEVEL:-INFO}
      # Redis connection for consuming jobs from the queue the app produces to.
      # Default host is "localhost" (config.py), which is the container itself,
      # so it must be overridden to the compose service name. Without these the
      # producer and consumer can silently diverge onto different Redis
      # databases and every submission fails silently at execution time.
      REDIS__HOST: redis
      REDIS__PORT: "6379"
      REDIS__DB: "0"
      # Security controls the production tier relies on; supplied with the
      # production defaults docker/.env.production declares.
      RATE_LIMITER_FAIL_CLOSED: ${RATE_LIMITER_FAIL_CLOSED:-true}
      UPLOAD__MAX_FILE_SIZE_MB: ${UPLOAD__MAX_FILE_SIZE_MB:-100}
      LOGGING__JSON_LOGGING: ${LOGGING__JSON_LOGGING:-true}
      AUTO_MIGRATE: "false"
    volumes:
      - app_data:/app/data
      - ../alembic:/app/alembic:ro
      - ../alembic.ini:/app/alembic.ini:ro
    restart: unless-stopped
    # Security: read-only root filesystem. Every path the worker writes is either
    # the app_data volume (/app/data, shared with app so the uploaded file the
    # app admits is the file the worker consumes) or /tmp, which is covered by
    # the tmpfs below. /tmp is required under read_only because Python's
    # tempfile.gettempdir() probes /tmp and /var/tmp and finds no usable
    # directory in a read-only rootfs; the size exceeds UPLOAD__MAX_FILE_SIZE_MB
    # (100 MiB default), the code's own ceiling on a temp copy of the largest
    # accepted upload.
    read_only: true
    tmpfs:
      - /tmp:rw,size=128m
    # Security: prevent privilege escalation via setuid/setgid binaries.
    security_opt:
      - no-new-privileges:true
    # Security: drop all Linux capabilities. The worker binds no privileged port
    # and needs no capability to fork a work-horse and read Redis/db sockets.
    cap_drop:
      - ALL
    healthcheck:
      # Observe the worker registry, not the broker: a Redis ping is green even
      # when the worker is dead, wedged or in a startup retry. This checks that a
      # live worker with a fresh heartbeat is registered; it does not verify which
      # queue the worker consumes - that agreement is pinned by the shared
      # DEFAULT_QUEUE_NAME constant in core/task_queue.py.
      test:
        - "CMD"
        - "/app/.venv/bin/python"
        - "-c"
        - "from mkobi.rq_worker_wrapper import main; main()"
      # DP-10-12: worst-case detection = interval * retries + timeout +
      # start_period. Old (30s/10s/3/40s) = 30*3 + 10 + 40 = 130s. New
      # (10s/5s/3/60s) = 10*3 + 5 + 60 = 95s wall, i.e. 35s after the 60s grace
      # period the migrate dependency chain can consume. The period is kept at
      # 60s so it still covers the slowest real startup; the probe stays
      # registry-based (proof of a live worker), only the window is retuned.
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M

  # The production edge. Ruling B6 (OPS-003 / VAL-10-006): the client bundle
  # ships INSIDE this image, built from the ``frontend-nginx`` stage in
  # docker/Dockerfile, which copies the SPA out of the same ``frontend-builder``
  # stage the app image uses. The host ``../frontend/dist`` bind mount is gone:
  # that directory is git-ignored twice and unversioned, so a host directory was
  # the production carrier and the edge served whatever happened to be on disk.
  # This service is production-only (profiles: [production]).
  #
  # The base image is still pinned by digest (resolved from the registry on
  # 2026-10-05 with ``docker buildx imagetools inspect nginx:1.27-alpine
  # --format '{{.Manifest.Digest}}'``) and is the ``FROM`` of the
  # ``frontend-nginx`` stage; ``image:`` names the locally-built tag so a
  # rollback selects a real artefact (mkobi/nginx:<tag>) that packages both the
  # server and the bundle.
  nginx:
    image: mkobi/nginx:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: frontend-nginx
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    # Edge configuration is templated: the entrypoint renders
    # ${NGINX_CLIENT_MAX_BODY_SIZE} from the environment into the MAIN config
    # (/etc/nginx/nginx.conf) at container start, then defers to the stock
    # image entrypoint. The application remains authoritative for the upload
    # ceiling; the edge value only stops a grossly oversized body and defaults
    # deliberately above the application's UPLOAD__MAX_FILE_SIZE_MB.
    environment:
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-512m}
    entrypoint: ["/etc/nginx/entrypoint-render.sh"]
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - ../docker/nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ../docker/nginx/entrypoint-render.sh:/etc/nginx/entrypoint-render.sh:ro
    restart: unless-stopped
    # Security: read-only root filesystem with explicit writable tmpfs paths
    # nginx writes to these directories at runtime: cache and PID files.
    # /var/log/nginx is intentionally absent: both logs stream to stdout/stderr,
    # not to files, so the directory is not written and needs no tmpfs entry.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - production
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

volumes:
  postgres_data:
  app_data:
  redis_data:

networks:
  default:
    driver: bridge