# =============================================================================
# Docker Compose Override for Development
# Usage: docker compose -f docker/docker-compose.yml -f docker/docker-compose.override.yml up -d
#
# WARNING: Do NOT use this override in production.
# This file exposes the database port (5432) to the host machine.
# Running production compose with this override exposes the database to the network.
# =============================================================================

services:
  # Migration service - runs alembic migrations before app starts (same as production)
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    command: ["alembic", "upgrade", "head"]
    environment:
      ENV: development
      DATABASE__HOST: db
      DATABASE__PORT: 5432
      DATABASE__DBNAME: bidb
      DATABASE__PASSWORD: ${DATABASE__PASSWORD:?DATABASE__PASSWORD must be set}
      JWT__ALGORITHM: HS256
      JWT__SECRET_KEY: ${JWT__SECRET_KEY:?JWT__SECRET_KEY must be set}
      # get_config() builds Settings and creates the upload temp directory, so
      # alembic needs a writable absolute path. HOME is unset in the dev image,
      # which makes the platformdirs default diverge from what the app uses.
      UPLOAD__TEMP_DIR: /app/data/tmp_uploads
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Frontend development server with Vite hot reload
  # Uses dedicated build to avoid SIGBUS errors from Windows volume mounts
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend.dev
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    # Mount source code for hot reload (node_modules built into image)
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      - ../frontend/index.html:/app/index.html
      - ../frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ../frontend/tsconfig.json:/app/tsconfig.json
      - ../frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ../frontend/vite.config.ts:/app/vite.config.ts
      - ../frontend/eslint.config.js:/app/eslint.config.js
      - frontend_vite_cache:/app/node_modules/.vite
    # No depends_on - frontend can start independently

  # Development app service
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Startup ordering only, NOT a correctness dependency. The reconciler lease
      # fails open, so the app boots and sweeps even with Redis down; waiting for
      # redis here merely avoids starting in the fail-open state for the first
      # seconds of a slow Redis boot.
      redis:
        condition: service_healthy
    environment:
      ENV: development
      APP__COOKIE_SECURE: "false"
      DATABASE__HOST: db
      DATABASE__PORT: 5432
      DATABASE__USER: mkobi_app
      DATABASE__PASSWORD: ${MKOBI_APP_PASSWORD:?MKOBI_APP_PASSWORD must be set}
      DATABASE__ADMIN_USER: postgres
      DATABASE__ADMIN_PASSWORD: ${DATABASE__ADMIN_PASSWORD:?DATABASE__ADMIN_PASSWORD must be set}
      DATABASE__DBNAME: bidb
      DATABASE__TEST_DBNAME: bidb_test
      REDIS__HOST: redis
      JWT__ALGORITHM: HS256
      JWT__SECRET_KEY: ${JWT__SECRET_KEY:?JWT__SECRET_KEY must be set}
      # Admin credentials (valid email format required)
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME must be set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      LOGGING__LEVEL: DEBUG
      LOGGING__LOG_FILE: ""
      AUTO_MIGRATE: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      # Docker Desktop's gRPC-FUSE bind mounts deliver no inotify events, so
      # uvicorn --reload never fires on Windows. watchfiles polling is required.
      WATCHFILES_FORCE_POLLING: "true"
      WATCHFILES_POLL_DELAY_MS: "400"
      # The dev image drops to `USER app` (uid 100) but /app stays root-owned, so
      # ruff and mypy cannot create their default caches. Both resolve
      # ".ruff_cache" / ".mypy_cache" against the working directory (/app), never
      # against $HOME, so a writable HOME alone does not help. Without this, the
      # `lint`, `format`, `typecheck` and `check` targets abort with
      # "Failed to initialize cache ... Permission denied (os error 13)" and exit 2.
      RUFF_CACHE_DIR: /tmp/ruff_cache
      MYPY_CACHE_DIR: /tmp/mypy_cache
    volumes:
      # Mount source code for hot reload (writable for egg-info generation)
      - ../src:/app/src
      - ../alembic:/app/alembic
      - ../tests:/app/tests
      - ../pyproject.toml:/app/pyproject.toml
      - ../uv.lock:/app/uv.lock
    ports:
      # Host port configurable for parallel checkouts (default 8010; 8000 is
      # commonly taken by other projects). Container-internal port stays 8000,
      # and the Vite dev server reaches the app over the internal network.
      - "${APP_HOST_PORT:-8010}:8000"
    command: ["uvicorn", "src.mkobi.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-exclude", "/app/tests/"]
    # Inherit the base healthcheck so the dev tier has a real /health readiness
    # signal; `up --wait` then waits for the app's boot instead of returning on start.
    # Override production security settings for development
    read_only: false

  # Override rq-worker for development (RQ worker runs in the default profile)
  # RQ worker needs write access to tmp_uploads for file processing
  rq-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: prod
    command: ["/app/.venv/bin/python", "-m", "mkobi.rq_worker_wrapper"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ENV: development
      DATABASE__HOST: db
      DATABASE__PORT: 5432
      DATABASE__USER: mkobi_app
      DATABASE__PASSWORD: ${MKOBI_APP_PASSWORD:?MKOBI_APP_PASSWORD must be set}
      DATABASE__ADMIN_USER: postgres
      DATABASE__ADMIN_PASSWORD: ${DATABASE__ADMIN_PASSWORD:?DATABASE__ADMIN_PASSWORD must be set}
      DATABASE__DBNAME: bidb
      DATABASE__TEST_DBNAME: bidb_test
      # Redis connection for consuming jobs from the queue the app produces to.
      # Mirrors the app service; a mismatch makes the worker silent.
      REDIS__HOST: redis
      REDIS__PORT: "6379"
      REDIS__DB: "0"
      JWT__ALGORITHM: HS256
      JWT__SECRET_KEY: ${JWT__SECRET_KEY:?JWT__SECRET_KEY must be set}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME must be set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      UPLOAD__TEMP_DIR: /app/data/tmp_uploads
      LOGGING__LOG_FILE: /app/data/logs/app.log
      LOGGING__LEVEL: DEBUG
      AUTO_MIGRATE: "false"
    volumes:
      - app_data:/app/data
    # Override production read_only for development (needs write access for processing)
    read_only: false
    # Real worker signal in the dev tier: the registry check, not a Redis ping.
    # It confirms a live, freshly-heartbeating worker is registered; it does not
    # inspect the consumed queue name (pinned by the shared DEFAULT_QUEUE_NAME).
    healthcheck:
      test:
        - "CMD"
        - "/app/.venv/bin/python"
        - "-c"
        - "from mkobi.rq_worker_wrapper import main; main()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    ports:
      # Bound to 127.0.0.1 to limit exposure to local machine only.
      # Do not change to 0.0.0.0 — that would expose the database to the network.
      - "127.0.0.1:5432:5432"
    environment:
      # Override production postgres password with development default
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD:?DATABASE__PASSWORD must be set}

volumes:
  frontend_vite_cache: