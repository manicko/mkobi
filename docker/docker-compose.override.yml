# =============================================================================
# Docker Compose Override for Development
# Usage: docker compose -f docker/docker-compose.yml -f docker/docker-compose.override.yml up -d
#
# WARNING: Do NOT use this override in production.
# This file exposes the database port (5432) to the host machine.
# Running production compose with this override exposes the database to the network.
# =============================================================================

services:
  # Static-analysis runner: the credential-free home of the lint / format /
  # typecheck gates. It carries the source tree, the Python environment and the
  # tooling, and an explicitly empty application credential set: none of
  # DATABASE__PASSWORD, MKOBI_APP_PASSWORD, JWT__SECRET_KEY, ADMIN_USERNAME,
  # ADMIN_PASSWORD or REDIS__PASSWORD is declared here, so a gate that executes
  # against untrusted input cannot read them from its own environment. Declaring
  # the posture explicitly (rather than leaving the credential set absent by
  # accident) is what tests/test_config.py asserts against the key names. The
  # container is started only via `docker compose run`, never as a long-running
  # service: it has no depends_on and no port.
  tools:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    # Static analysis needs no network, no database and no broker; keeping the
    # tool container off the default network makes an accidental credential
    # fetch from a peer service impossible rather than merely unlikely.
    network_mode: none
    environment:
      # Only tooling configuration lives here -- no application credentials.
      ENV: development
      # The dev image drops to `USER app` (uid 100) but /app stays root-owned, so
      # ruff and mypy cannot create their default caches. Both resolve
      # ".ruff_cache" / ".mypy_cache" against the working directory (/app), never
      # against $HOME, so a writable HOME alone does not help. Pointing them at
      # /tmp keeps the caches off the bind-mounted working tree (the tree stays
      # clean) and inside the container's ephemeral filesystem. Without this, the
      # `lint`, `format`, `typecheck` and `check` targets abort with
      # "Failed to initialize cache ... Permission denied (os error 13)" and exit 2.
      RUFF_CACHE_DIR: /tmp/ruff_cache
      MYPY_CACHE_DIR: /tmp/mypy_cache
    volumes:
      # The source tree and the configuration ruff and mypy read are mounted
      # read-write because `format` fixes in place; the caches are redirected to
      # /tmp above so the mounted tree stays free of tool artefacts.
      - ../src:/app/src
      - ../alembic:/app/alembic
      - ../tests:/app/tests
      - ../pyproject.toml:/app/pyproject.toml
      - ../uv.lock:/app/uv.lock
    # `docker compose run` uses this when no command is supplied; the Makefile
    # always passes one explicitly.
    command: ["ruff", "check", "src/", "tests/", "alembic/env.py"]

  # Migration service - runs alembic migrations before app starts (same as production)
  migrate:
    # Must agree byte-for-byte with the base file's image coordinate: an override
    # that declared a different value would silently change the artefact identity
    # between tiers and break the rollback tag contract.
    image: mkobi/migrate:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    command: ["alembic", "upgrade", "head"]
    environment:
      ENV: development
      DATABASE__HOST: db
      DATABASE__PORT: 5432
      DATABASE__DBNAME: bidb
      DATABASE__PASSWORD: ${DATABASE__PASSWORD:?DATABASE__PASSWORD must be set}
      JWT__ALGORITHM: HS256
      JWT__SECRET_KEY: ${JWT__SECRET_KEY:?JWT__SECRET_KEY must be set}
      # get_config() builds Settings and creates the upload temp directory, so
      # alembic needs a writable absolute path. HOME is unset in the dev image,
      # which makes the platformdirs default diverge from what the app uses.
      UPLOAD__TEMP_DIR: /app/data/tmp_uploads
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Frontend development server with Vite hot reload
  # Uses dedicated build to avoid SIGBUS errors from Windows volume mounts
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend.dev
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    # Mount source code for hot reload (node_modules built into image)
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      - ../frontend/index.html:/app/index.html
      - ../frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ../frontend/tsconfig.json:/app/tsconfig.json
      - ../frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ../frontend/vite.config.ts:/app/vite.config.ts
      - ../frontend/eslint.config.js:/app/eslint.config.js
      - frontend_vite_cache:/app/node_modules/.vite
    # No depends_on - frontend can start independently

  # Development app service
  app:
    # Agrees with the base file's image coordinate (see the override migrate block).
    image: mkobi/app:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Startup ordering only, NOT a correctness dependency. The reconciler lease
      # fails open, so the app boots and sweeps even with Redis down; waiting for
      # redis here merely avoids starting in the fail-open state for the first
      # seconds of a slow Redis boot.
      redis:
        condition: service_healthy
    environment:
      ENV: development
      APP__COOKIE_SECURE: "false"
      # Trust nothing: no path in the dev tier sets a forwarding header. The
      # Vite proxy has no xfwd option and there is no nginx in dev, so both dev
      # ingress paths (browser -> Vite container, browser -> host 8010) deliver
      # no X-Forwarded-For. Stating 127.0.0.1 explicitly makes the tier
      # difference visible, so it cannot drift silently if a subnet or xfwd is
      # ever added. See the base app service for the production value.
      FORWARDED_ALLOW_IPS: "127.0.0.1"
      DATABASE__HOST: db
      DATABASE__PORT: 5432
      DATABASE__USER: mkobi_app
      DATABASE__PASSWORD: ${MKOBI_APP_PASSWORD:?MKOBI_APP_PASSWORD must be set}
      DATABASE__ADMIN_USER: postgres
      DATABASE__ADMIN_PASSWORD: ${DATABASE__ADMIN_PASSWORD:?DATABASE__ADMIN_PASSWORD must be set}
      DATABASE__DBNAME: bidb
      DATABASE__TEST_DBNAME: bidb_test
      REDIS__HOST: redis
      # Declared in the override with the same default as the base service, so a
      # developer can set RATE_LIMITER_FAIL_CLOSED in .env and have it reach the
      # dev tier instead of the base value silently winning.
      RATE_LIMITER_FAIL_CLOSED: ${RATE_LIMITER_FAIL_CLOSED:-true}
      JWT__ALGORITHM: HS256
      JWT__SECRET_KEY: ${JWT__SECRET_KEY:?JWT__SECRET_KEY must be set}
      # Admin credentials (valid email format required)
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME must be set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      LOGGING__LEVEL: DEBUG
      LOGGING__LOG_FILE: ""
      AUTO_MIGRATE: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      # Docker Desktop's gRPC-FUSE bind mounts deliver no inotify events, so
      # uvicorn --reload never fires on Windows. watchfiles polling is required.
      WATCHFILES_FORCE_POLLING: "true"
      WATCHFILES_POLL_DELAY_MS: "400"
      # The dev image drops to `USER app` (uid 100) but /app stays root-owned, so
      # ruff and mypy cannot create their default caches. Both resolve
      # ".ruff_cache" / ".mypy_cache" against the working directory (/app), never
      # against $HOME, so a writable HOME alone does not help. Without this, the
      # `lint`, `format`, `typecheck` and `check` targets abort with
      # "Failed to initialize cache ... Permission denied (os error 13)" and exit 2.
      RUFF_CACHE_DIR: /tmp/ruff_cache
      MYPY_CACHE_DIR: /tmp/mypy_cache
    volumes:
      # Mount source code for hot reload (writable for egg-info generation)
      - ../src:/app/src
      - ../alembic:/app/alembic
      - ../tests:/app/tests
      - ../pyproject.toml:/app/pyproject.toml
      - ../uv.lock:/app/uv.lock
    ports:
      # Host port configurable for parallel checkouts (default 8010; 8000 is
      # commonly taken by other projects). Container-internal port stays 8000,
      # and the Vite dev server reaches the app over the internal network.
      - "${APP_HOST_PORT:-8010}:8000"
    command: ["uvicorn", "src.mkobi.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-exclude", "/app/tests/"]
    # Inherit the base healthcheck so the dev tier has a real /health readiness
    # signal; `up --wait` then waits for the app's boot instead of returning on start.
    # Override production security settings for development
    read_only: false

  # Override rq-worker for development (RQ worker runs in the default profile).
  # The worker keeps the hardened boundary (read_only + tmpfs /tmp, cap_drop,
  # no-new-privileges): its tmp_uploads writes land on the app_data volume, not
  # on the root filesystem, so development needs no relaxation.
  rq-worker:
    # Agrees with the base file's image coordinate (see the override migrate block).
    image: mkobi/rq-worker:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: prod
    command: ["/app/.venv/bin/python", "-m", "mkobi.rq_worker_wrapper"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ENV: development
      DATABASE__HOST: db
      DATABASE__PORT: 5432
      DATABASE__USER: mkobi_app
      DATABASE__PASSWORD: ${MKOBI_APP_PASSWORD:?MKOBI_APP_PASSWORD must be set}
      DATABASE__ADMIN_USER: postgres
      DATABASE__ADMIN_PASSWORD: ${DATABASE__ADMIN_PASSWORD:?DATABASE__ADMIN_PASSWORD must be set}
      DATABASE__DBNAME: bidb
      DATABASE__TEST_DBNAME: bidb_test
      # Redis connection for consuming jobs from the queue the app produces to.
      # Mirrors the app service; a mismatch makes the worker silent.
      REDIS__HOST: redis
      REDIS__PORT: "6379"
      REDIS__DB: "0"
      # Declared with the same default as the base worker service so the posture
      # is overridable per-developer through .env (SECB-9).
      RATE_LIMITER_FAIL_CLOSED: ${RATE_LIMITER_FAIL_CLOSED:-true}
      JWT__ALGORITHM: HS256
      JWT__SECRET_KEY: ${JWT__SECRET_KEY:?JWT__SECRET_KEY must be set}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME must be set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      UPLOAD__TEMP_DIR: /app/data/tmp_uploads
      # LOGGING__LOG_FILE is intentionally not set here. The dev override used
      # to give the worker a real path, so this process still opened a rotating
      # handler and wrote the same file as app. The setting still works when an
      # operator supplies it explicitly in .env.
      LOGGING__LEVEL: DEBUG
      AUTO_MIGRATE: "false"
    volumes:
      - app_data:/app/data
    # The boundary is the same in both tiers: the worker keeps the base file's
    # read-only root filesystem and tmpfs /tmp. Its only writes are the app_data
    # volume (/app/data/tmp_uploads, shared with app) and /tmp, so no dev-tier
    # relaxation is needed -- the dev worker processes the same job shape.
    read_only: true
    tmpfs:
      - /tmp:rw,size=128m
    # Real worker signal in the dev tier: the registry check, not a Redis ping.
    # It confirms a live, freshly-heartbeating worker is registered; it does not
    # inspect the consumed queue name (pinned by the shared DEFAULT_QUEUE_NAME).
    # Window matches the base file (DP-10-12): interval 10s / timeout 5s /
    # retries 3 / start_period 60s, worst-case detection 95s wall.
    healthcheck:
      test:
        - "CMD"
        - "/app/.venv/bin/python"
        - "-c"
        - "from mkobi.rq_worker_wrapper import main; main()"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  db:
    ports:
      # Bound to 127.0.0.1 to limit exposure to local machine only.
      # Do not change to 0.0.0.0 — that would expose the database to the network.
      - "127.0.0.1:5432:5432"
    environment:
      # Override production postgres password with development default
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD:?DATABASE__PASSWORD must be set}

volumes:
  frontend_vite_cache: