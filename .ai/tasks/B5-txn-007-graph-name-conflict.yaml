constraints:
  architecture:
    - >-
      `AppException` + `ErrorCode` is the only error-raising mechanism. **Never raise
      `HTTPException`**, never return a hand-built error body, never hardcode an error-code string —
      `ErrorCode.DUPLICATE_RESOURCE` is referenced as the enum member.
    - >-
      **No new `ErrorCode` member and no change to the `ErrorCode` → HTTP status map.** The code
      this block needs already exists and already maps to 409. A new member would also require the
      enum/database consistency the project enforces.
    - >-
      **The layering divergence is deliberate and must be recorded, not hidden.** A driver exception
      type appears in an HTTP handler here, against the API → Service → Repository rule, because
      **there is no service in this path**: both routes call `GraphRepository.create` directly and
      `GraphService.create` has zero route callers. The layer that would own the classifier is
      unwired. Say this in the commit body so the next reader does not read this block as
      contradicting the user-write ruling, and say why the 422-versus-409 divergence is a rule
      (preserve a published contract; prefer an existing sibling's published contract otherwise)
      rather than an inconsistency.
    - >-
      **The repository never raises `AppException`** and never classifies an error's meaning. Its
      job on this path is: log it, re-raise it unchanged. Do not add a wrapper, a custom exception,
      or a `raise … from e` chain.
    - >-
      `StrEnum` for constants; no new literal status codes, no magic strings in log messages, no
      raw SQL of any kind (this block writes no SQL at all — the only statements are ORM/Core calls
      the repository already makes).
  correctness:
    - >-
      **No name pre-check.** Correctness comes from the unique index, detected by
      `IntegrityError`. Adding a read-then-write pre-check would reintroduce the TOCTOU window this
      finding class exists to close **and would make the new tests vacuous** — they would pass with
      the clause deleted.
    - >-
      **`await db.rollback()` in the new clause is mandatory.** Without it the aborted transaction
      makes the next statement on the shared test session raise `PendingRollbackError`, and because
      the request's session *is* the test's session, that leaks into unrelated later tests. Leave a
      comment saying so, or the next reader will remove it.
    - >-
      **A genuine database failure must still answer 500.** Add no clause broader than
      `IntegrityError`, and do not reorder or weaken the terminal handler.
    - >-
      Graph names and the created dashboards are per-test and `uuid4()`-derived. The class already
      commits rows with fixed names through the routes; adding a fixed name here would collide on
      the unique index against those rows on a second run.
    - >-
      **Every test that reaches a create route deletes what it created, in a `finally`, through an
      independent session that commits.** A flushed-but-uncommitted delete is rolled back by the
      fixture teardown and leaves the original row behind, which then fails the next run.
    - >-
      **Assertions state the negative.** The conflict must be asserted as 409 **and** as
      `!= 500` **and** as `!= 422`. A test that only asserts 409 lets either pre-fix behaviour
      creep back unnoticed.
  process:
    - "English only — docstrings, comments and log messages."
    - "No `print()`; use `logger = logging.getLogger(__name__)`."
    - "No pandas. Polars only for data processing; this block touches none."
    - "Type hints on the new cleanup helper and on every new test signature, including `-> None`."
    - >-
      **No audit or plan identifiers in committed code, tests, comments, docstrings, log messages or
      the documentation row.** No block IDs, no finding IDs, no decision IDs, no phase references.
      An earlier commit in this phase had to be amended for exactly that, so write the reasoning
      without the label — "a unique-index conflict on a name is a conflict, not a validation error"
      reads correctly on its own.
    - >-
      Comments only where non-obvious: why the rollback is mandatory, and (if you add one) why the
      status is a conflict rather than a validation error. No narration of the next line.
    - >-
      Run `.\Makefile.ps1 format` before committing — it runs `ruff check --fix`, which is what
      sorts imports.
    - >-
      One commit for the whole block (production + tests + the documentation row), so the contract
      change and its evidence land together.

