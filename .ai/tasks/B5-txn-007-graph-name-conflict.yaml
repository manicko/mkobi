  - path: tests/test_graphs.py
    change: modify
    targets:
      - type: class
        name: TestGraphsAPI
    semantic_anchors:
      - "TestGraphsAPI::test_create_graph_admin_success — the one existing consumer of the global create route"
      - "TestGraphsAPI module scope — where the cleanup helper is added, beside the existing `_create_admin_user` / `_create_viewer_user` helpers"
    instructions: |
      Add **three** cases to `TestGraphsAPI` and one module-level cleanup helper. **No existing test
      in this file is modified** — the whole class must stay green unmodified, and phase 12
      (`AZ-6`/`AZ-7`/`AZ-8`), phase 15 and phase 16 all pin it.

      **Cleanup helper (mandatory, and the durability trap is real).** `create_graph_endpoint` calls
      `await db.commit()`, and on this harness a production commit reaches the root and releases the
      fixture's SAVEPOINT — the fixture's teardown rollback **cannot** undo it. Add one module-level
      async helper next to the existing user helpers, following the shipped precedent for exactly
      this problem (the `_delete_committed_email` helper in `tests/test_admin_user_management.py`):

          async def _delete_committed_graph(
              async_session_maker, dashboard_id: uuid.UUID, name: str
          ) -> None:
              """Delete rows a create request in this suite committed.

              A production commit in this harness is durable and the fixture's teardown rollback
              cannot undo it, so any test that creates a graph must delete it afterwards.
              """
              async with async_session_maker() as session:
                  await session.execute(
                      delete(graph_model.Graph).where(
                          graph_model.Graph.dashboard_id == dashboard_id,
                          graph_model.Graph.name == name,
                      )
                  )
                  await session.execute(
                      delete(dashboard_model.Dashboard).where(
                          dashboard_model.Dashboard.id == dashboard_id
                      )
                  )
                  await session.commit()

      - It runs on an **independent** session from the session-maker fixture and **commits** — a
        delete that is only flushed is undone by the teardown, which would leave the original row
        behind. This is the trap the helper exists to close.
      - The dashboard is deleted too: it is created through `DashboardRepository.create` (not
        through the API, so no owner-grant row is created) and the graph route commits it forward.
      - Every new test wraps its body in `try: … finally: await _delete_committed_graph(...)`, and
        takes the `async_session_maker` fixture in addition to the ones it already needs.

      **Shared setup for the three cases.** Create a `Dashboard` through `DashboardRepository.create`
      + `await async_db_session.flush()` (the same shape as `test_create_graph_admin_success`).
      Use `authenticated_client` — its token is an **admin**, and `check_dashboard_access` carries the
      admin bypass, so the global route's in-body permission gate admits it with **no grant row**,
      exactly as the existing test shows. Build the request body with a `uuid4()`-derived graph
      `name` (never a hard-coded one: the existing tests in this file already commit
      durable rows with fixed names, and a shared name would collide on the unique index across
      runs).
      Assert the RFC 7807 `code` field against `ErrorCode.DUPLICATE_RESOURCE.value` — `ErrorResponse.code`
      is a `StrEnum`, so `model_dump()` emits its string value.

      **Case 1 — `test_create_graph_duplicate_name_returns_409`** (the global route, the fix):
      - POST the identical body to `/graphs/` **twice**.
      - First response: `201`, and the body carries `name`, `type` and `dashboard_id` as sent, plus
        an `id`. This is the "the first create still returns 201 with the same body" assertion — the
        success path is pinned so the classifier cannot be bought by breaking creation.
      - Second response: **`409`**, `body["code"] == ErrorCode.DUPLICATE_RESOURCE.value`,
        `body["detail"] == "Conflict: graph creation failed"`.
      - Assert explicitly, on the conflict response: `status_code != 500` **and**
        `status_code != 422`. The negative assertions are the point — 500 is the pre-fix behaviour
        and 422 is the documented behaviour that never existed, and a test that only asserts 409
        would let either creep back.
      - Re-read from an **independent session** (`async_session_maker`) and assert **exactly one**
        graph row exists for that `(dashboard_id, name)` — the loser wrote nothing.

      **Case 2 — `test_create_dashboard_graph_duplicate_name_returns_409`** (the scoped route, the
      pin):
      - The same three assertions against `POST /dashboards/{dashboard_id}/graphs`.
      - Its purpose is **anti-drift**: it pins the surviving sibling's contract with the *same* status,
        `code` and `detail` as case 1, so the two surfaces cannot diverge again silently. State that
        in the test docstring — it is not a duplicate of case 1 by accident.
      - **Say in the docstring that this case does not discriminate the fix.** It passes before and
        after the change by design; it is a regression pin on untouched code. Only case 1 and case
        3 must fail pre-fix.

      **Case 3 — `test_graph_name_conflict_is_not_500_on_any_create_route`** (the block's headline
      assertion):
      - `@pytest.mark.parametrize` over the **two mounted paths** (`"/graphs/"` and
        `"/dashboards/{dashboard_id}/graphs"`), posting the same `(dashboard_id, name)` twice.
      - Assert the conflict response is **409** and explicitly **not 500**, and that its `code` is
        `DUPLICATE_RESOURCE`.
      - This is the plan's "a name conflict does not surface as 500 on any route" requirement, and it
        is the one test that fails if anyone later removes the clause from **either** handler.
      - Both parametrised cases need their own dashboard (the unique index is per
        `(dashboard_id, name)`), so build a fresh one per parameter value and clean up per case.

