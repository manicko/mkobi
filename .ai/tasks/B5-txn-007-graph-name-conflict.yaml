         Binding points on the clause:
         - **`ErrorCode.DUPLICATE_RESOURCE`** — an existing `StrEnum` member in
           `src/mkobi/models/enums.py` that already maps to **409** in
           `utils/exceptions.py`'s code→status map. **No new enum member, no mapping change, no
           hardcoded code string.**
         - **`detail="Conflict: graph creation failed"`** — byte-identical to the sibling route's
           detail and to the documentation row this block writes. The two surfaces must be
           indistinguishable to a client.
         - **`await db.rollback()` first.** Mandatory, not defensive (see the correction notes).
           Add a short comment stating *why*: a flush-time integrity error leaves the transaction
           aborted, so the next statement on this session would raise `PendingRollbackError`.
           Keep it to the two sentences that stop a future reader from deleting the rollback as
           redundant.
         - **`exc_info=True`** in the log call, matching the sibling.
         - **`from None`,** matching the sibling: the `AppException` is the whole story for the
           client, and the traceback is in the log line above. (`ruff`'s `B904` is satisfied by an
           explicit `from` either way.)
      3. **Everything else in the file is untouched.** Specifically: the `except AppException:
         raise` clause stays first; the `except ValueError` → `VALIDATION_ERROR` (422) clause stays
         exactly as it is, **including its rollback**; the terminal `except Exception` →
         `INTERNAL_ERROR` (500) clause stays exactly as it is; the `update_graph_endpoint`,
