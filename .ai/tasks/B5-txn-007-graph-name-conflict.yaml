id: task_b5_txn_007_graph_name_conflict

title: >
  B5 / TXN-007 — A duplicate graph name is a 409 on both create routes (global route gains the
  IntegrityError clause)

status: pending
priority: medium
depends_on: []

source_reference: C:\py_dev\mkobi\.ai\plans\03-db-concurrency-remediation.md
source_section: B5 — Settle the graph-create contract (TXN-007) + D-3 ruling + B5 design ruling
source_blocks:
  - "B5 — Settle the graph-create contract (TXN-007)"
  - "B5 design ruling (Planner) — settled 2026-10-02"
  - "D-3 — RULING: Alternative A — handle `IntegrityError` in the global graph route"

description: >
  One unique index on `(dashboard_id, name)` — `Graph.__table_args__`'s
  `Index("idx_graphs_dashboard_name", …, unique=True)` — is reached by **two** mounted routes.
  `api/routes/dashboards_graphs.py::create_dashboard_graph_endpoint` maps `IntegrityError` to
  `ErrorCode.DUPLICATE_RESOURCE` (409) and documents 409. `api/routes/graphs.py::
  create_graph_endpoint` declares 409 in its own OpenAPI `responses` block, has no such clause,
  falls into its terminal `except Exception` and answers **500** — while
  `docs/02-dashboards/dashboards-api.md` §13's error table for that same endpoint says **422**.


  **D-3 is ruled: Alternative A.** The global route gains the sibling's `IntegrityError` clause.
  The repository is **not** changed for correctness: its `except SQLAlchemyError` handler is a
  **bare `raise`**, so the driver's `IntegrityError` already reaches the route intact and a
  route-level clause fires today. Only a one-line logging symmetry fix
  (`exc_info=True`) is taken in the repository, and it is explicitly **not** a prerequisite.


  **There is no name pre-check anywhere on this path**, so the 500 is the **ordinary** outcome of a
  sequential duplicate, not a race: the new tests post the same `(dashboard_id, name)` twice over
  HTTP and assert 409 on the second. No repository double, no two-session race, no timing.


  Scope: one `except` clause plus one import in one route module, one optional logging line in one
  repository method, three test cases added to `tests/test_graphs.py::TestGraphsAPI`, and **one
  documentation row**.

goals:
  - >-
    Deliver **one** reportable outcome for a duplicate graph name across **both** surviving create
    surfaces: **409** with `code == DUPLICATE_RESOURCE`, making the global route's own already
    declared OpenAPI contract true.
  - >-
    Make the fix as small as the finding: a route-level classifier, no new error taxonomy, no new
    enum member, no status-mapping change, no schema change, no service-layer rewiring.
  - >-
    Pin **both** surfaces with tests so they cannot drift apart again — the surviving sibling route
    is a test target, not just the code being changed.
  - >-
    Leave every row the tests create **deleted**. On this harness a production `commit()` is durable
    and the fixture's SAVEPOINT rollback cannot undo it.
  - >-
    Leave the two routes' other differences exactly as they are. The dashboard-scoped route is
    **not** a drop-in equivalent of the global one, and this block does not make it one.

extra_context: |
  ## Correction 1 — the repository does not collapse the exception

  The plan's B5 block and its D-3 ruling both say `GraphRepository.create` "wraps every
  `SQLAlchemyError` identically, so a constraint violation is indistinguishable from a connection
  failure by the time it reaches either route". **That is false**, and the correction is what makes
  this block a one-clause change.

  The handler is a **bare `raise`**:

      except SQLAlchemyError as e:
          logger.error("Error creating graph: %s", e)
          raise

  A bare `raise` re-raises the *same* exception object (PEP 3134), so `sqlalchemy.exc.IntegrityError`
  arrives at the route intact. Confirmed three ways: statically, by an executed probe, and
  empirically by the shipped user-write fix (`2174895`), whose classifier in
  `services/user_service.py::UserService.create_user` catches `IntegrityError` raised from
  `UserRepository.create` and whose tests drive a real unique-index violation through the
  repository.

  **Consequence: a route-level `except IntegrityError` fires today with no repository change.**
  Do not invent a re-raise wrapper, a custom repository exception, or a
  "constraint violation vs connection failure" discriminator — the code does not need one, and
  adding it would widen the block.

  ## Correction 2 — the 500 is the ordinary path, not a race

  **There is no name pre-check anywhere on the graph-create path.** `GraphRepository.create` goes
  straight to `Graph(**kwargs)` → `db.add` → `db.flush`. `GraphRepository.get_by_name_and_dashboard`
  exists and **has no caller in `src/`** — neither route calls it. Nothing in the request path looks
  for an existing graph with that name before inserting.

  Therefore a **sequential** duplicate name always reaches the unique index and always produces the
  **500** today. The documentation's `422` row was never met by anything; the validation error it
  describes does not exist on this path.

  **Consequence: the test is trivially deterministic** — post the same `(dashboard_id, name)` twice
  over HTTP and assert 409 on the second. No repository double, no defeated pre-check, no
  two-session race, no timing, no flakiness. This is materially cheaper *and* stronger than what
  the plan assumed, because the pre-fix behaviour it asserts against is not a race but a
  single-threaded fact.

  ## Consumer inventory — the "delete the global route" option is closed

  The global route has **one** HTTP consumer in the repository
  (`tests/test_graphs.py::TestGraphsAPI::test_create_graph_admin_success`), **zero** frontend
  consumers (the frontend never creates, updates or deletes graphs through either route — the
  dashboard API module and the admin API module make no graph calls at all; graphs reach the SPA
  only as read-only `AggregatedDataResponse.graphs`), **zero** in-process consumers, and **four**
  documentation statements. Nothing anywhere relies on the current 500 or on the documented 422 —
  the audit corpus's probes of it are auditor-authored, not consumers.

  Had the delete option been chosen, it would have **silently removed graph creation for a non-admin
  holding an `admin` dashboard grant**, because the dashboard-scoped route refuses exactly that
  caller (its `require_admin_role` dependency admits only global admins). **The scoped route is not
  a drop-in equivalent** — not of the caller set, and not of the URL surface. The mounted paths are
  disjoint: `POST /api/v1/graphs/` (with a trailing slash; the slash-less form still answers `307`
  because the application router re-registers the path with `redirect_slashes` unset — a phase-07
  `X-07`/`EXT-006` finding) versus `POST /api/v1/dashboards/{dashboard_id}/graphs`.

  ## The two handlers differ in more than the conflict clause — do not "converge" them

  | | global `create_graph_endpoint` | scoped `create_dashboard_graph_endpoint` |
  | - | - | - |
  | Permission gate | in-body `check_dashboard_access(..., required_permission="admin")` — admits **any** authenticated user holding an admin grant, plus global admins via the bypass | `require_admin_role` decorator; consults **no** ACL, so a grant-admin non-admin is **refused** |
  | Conflict clause | **being added** (409) | already present (409) |
  | `ValueError` branch | rolls back | does **not** roll back |
  | 403 payload | `PERMISSION_DENIED` | `INSUFFICIENT_PERMISSIONS` (same status, different `code`) |
  | OpenAPI `responses` | declares 429 and an unreachable 404 | no 429; also declares an unreachable 404 |
  | Docstring `Raises:` | does not list its own 409 | does not list its own 409 |

  None of those is this block's. **Do not reorder the existing clauses, do not align the two
  handlers, do not add the missing docstring rows, do not add or remove a declared status.** The
  global route is *looser* than the scoped one for a grant-admin non-admin, so the documentation's
  "Admin only" wording is wrong **in that direction** — a pre-existing inaccuracy that belongs to the
  authorization phase, not here.

  ## The layering divergence from the user-write block, stated so it is not read as a contradiction

  The user-write block (B1) explicitly **rejected** a route-level `except IntegrityError` for users
  because it "would put a driver exception type into the HTTP layer against the API → Service →
  Repository rule". **This block does exactly that for graphs.** The two rulings are coherent
  because B1's premise does not hold here: **there is no service in the graph-create path at all.**
  Both routes call `GraphRepository.create` **directly**; `GraphService.create` exists and has
  **zero** route callers (the service is reachable only through the DI factory
  `api/deps.py::get_graph_service`, which no route depends on). The layer that would own the
  classifier is unwired, so wiring it would be a *larger* change than the route clause and would
  touch a second module for no behavioural gain.

  **Put this in the commit body**, in these terms, so the next reader does not read B5 as
  contradicting B1:

  - *Why* a driver exception type appears in an HTTP handler here and not there: the service layer
    is not in this path, and it is not in the user path either — the user path's classifier exists
    because a duplicate email had to be distinguished from every other `IntegrityError`, which
    needed a `get_by_email` re-read inside a method that already owned the transaction's outcome.
    A duplicate graph name needs no verification: the conflicting row is the caller's own first
    create, on the same dashboard, in the same request session.
  - *That* the semantic divergence is deliberate and rule-based, not accidental: duplicate **email**
    is settled at **422** because a **published** contract already asserts it (a shipped test and a
    documentation table), and preserving a published contract outranks semantic purity. Duplicate
    **graph name** has **no** published contract to preserve for the global route (the docs say
    422, which nothing implements), and the surviving sibling route **already publishes 409** with
    the same error code. Rule: *preserve an already-published contract; use 409 where none exists
    and a sibling already establishes it.*

  ## The repository change: one line, and why it is in scope

  **Decision: include `exc_info=True` in `GraphRepository.create`'s handler, and nothing else.**

      except SQLAlchemyError as e:
          logger.error("Error creating graph: %s", e, exc_info=True)
          raise

  Rationale, in order of weight:

  1. **It is the one line of this block's diff that makes the conflict diagnosable.** This block
     deliberately routes a constraint violation into an expected, documented outcome instead of a
     500. The only remaining trace of *why* the insert failed is that log line, and without
     `exc_info=True` it carries only the driver's message with no traceback and no constraint
     name — while the sibling route's equivalent clause passes `exc_info=True`. Making the
     repository's line match the route it feeds is the minimum that keeps the two consistent.
  2. **Zero behavioural risk.** No control flow, no exception identity, no signature, no return
     value changes. A logging call cannot change a status code, and the test suite's only
     observation of this handler is that the exception still propagates.
  3. **It is scoped to `create` on purpose.** The file has seven handlers with the same shape.
     Touching all seven would make this block a repository-wide logging sweep and would widen its
     review surface for no gain. Only `create` is on the path this block changes. The remaining
     six are untouched and stay untouched; if a future block wants the sweep, it is that block's
     decision.

  **What must NOT happen:** do not add a re-raise wrapper, a custom exception type, a
  `raise … from e` chain, or any classification inside the repository. The repository's
  responsibility ends at "log it and let it propagate". Deciding what a constraint violation *means*
  to a client is the HTTP layer's, and it is now a one-clause decision.

  ## Mandatory implementation details (non-negotiable)

  - The new `except IntegrityError` clause is placed **before `except Exception`**. Placing it after
    would be dead code — the terminal handler would have caught it first.
  - It **must `await db.rollback()`**. After a flush-time `IntegrityError` the transaction is
    aborted; without the rollback the next statement on that session raises `PendingRollbackError`.
    `tests/conftest.py::async_client` overrides `get_db_dependency` with the **shared** test
    session, so an un-rolled-back session poisons every later test in the run. The sibling route
    rolls back for exactly this reason, and the shipped user-write classifier carries a comment
    recording the same hazard.
  - **No name pre-check is added.** Do not "helpfully" call `get_by_name_and_dashboard` first and
    return 409 from a read: that reintroduces the TOCTOU window this finding class exists to close,
    and it would make the test pass without the `IntegrityError` clause ever firing — which would
    make the test **vacuous**.
  - The committed graph row is **durable** on this harness: a production `Session.commit()` commits
    to the root and releases the fixture's SAVEPOINT, so the fixture's teardown rollback cannot undo
    it. Every new test **must** delete what it created, in a `finally`.

  ## Documentation decisions (settled; do not widen)

  - `docs/02-dashboards/dashboards-api.md` §13 "Create Graph" — the
    `422 | Duplicate name in dashboard | Validation error` row becomes `409`, **matching the scoped
    route's existing row verbatim** (`409 | Duplicate name in dashboard |
    `Conflict: graph creation failed``). **Only that row.** The neighbouring
    `422 | Invalid graph type` row stays. The section's "Admin only" wording is a separate,
    pre-existing inaccuracy and correcting it would widen this block's contract surface.
  - `docs/08-security/error-format.md` and `docs/99-reference/error-handling-guide.md` already map
    `DUPLICATE_RESOURCE → 409`. **No edit.**
  - `docs/SPEC.md`'s "dashboard-specific graph endpoints" row presents the two surfaces as parallel.
    Under the ruled option **both routes still exist**, so that sentence remains **true**. **No
    edit, and no version row** — the other blocks in this phase declined one and the phase close
    records a single row for the whole phase.
  - `docs/11-guides/create-dashboard.md` carries **unresolved merge-conflict regions** (23 of them)
    and cannot be edited cleanly. It does **not** need editing — it already recommends the
    dashboard-scoped route. Recorded as coordination item **C-8** for the documentation phase; the
    conflict-marker cleanup is a **separate authoring task**, not a phase-03 deliverable.

  ## Why the tests live in `TestGraphsAPI`

  `tests/test_graphs.py::TestGraphsAPI` is **pinned by phases 07, 08, 12, 15 and 16** — each of
  those plans already records "phase 03's B5 may have added assertions to this class; read the
  file, do not assume its shape", and phase 15's plan additionally names
  `TestGraphCreateContract` as a class this block may have added and tells phase 15 to look for it.
  The test therefore goes **in that existing class**, and the addition is recorded as coordination
  item **C-8** so those phases read rather than assume.

