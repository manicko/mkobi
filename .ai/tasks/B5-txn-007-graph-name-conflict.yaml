      **The only production file this block changes for correctness.**

      1. Add `from sqlalchemy.exc import IntegrityError` to the module imports, next to the
         existing `from sqlalchemy.ext.asyncio import AsyncSession`. Import order is fixed by
         `ruff`'s isort rule — run the lint fixer rather than guessing.
      2. Insert one new clause into `create_graph_endpoint`'s handler chain, **between
         `except ValueError` and `except Exception`** (i.e. after the `ValueError` mapping, before
         the terminal handler). Mirror `dashboards_graphs.py::create_dashboard_graph_endpoint`'s
         clause as closely as the local style allows:

             except IntegrityError:
                 await db.rollback()
                 logger.error(
                     "Integrity error creating graph name=%s dashboard_id=%s",
                     graph.name,
                     graph.dashboard_id,
                     exc_info=True,
                 )
