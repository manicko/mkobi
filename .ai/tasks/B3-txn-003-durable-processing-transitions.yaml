risks:
  - id: R-03-1
    probability: medium
    impact: high
    description: >-
      Placing the boundary wrongly publishes a half-built state - a processing row whose aggregates
      never arrive, or aggregates committed with the status still saying processing.
    mitigation: >-
      Two commits only, with COMPLETED kept inside the main transaction next to the aggregate write;
      the independent-connection probe and the terminal-pairing test both assert the pair.
  - id: R-03-2
    probability: low
    impact: high
    description: >-
      Moving the PROCESSING write into a durable commit regresses TOPO-001 by losing the own-session
      FAILED report that 0717b65 established.
    mitigation: >-
      The compensation block is untouched; TestProcessingFailureReportedOnOwnSession must pass
      unmodified; the new DB-backed test asserts exactly one FAILED row that survived its own
      rollback.
  - id: R-03-3
    probability: medium
    impact: medium
    description: >-
      A durable PROCESSING commit in test mode would break fixture isolation, because
      Session.commit() releases the SAVEPOINT and async_db_session's teardown rollback cannot undo it.
    mitigation: >-
      The test-mode branch keeps session=db_session and stays non-committing. Pin this in the block
      report so a later block does not "fix" it.
  - id: R-03-4
    probability: low
    impact: medium
    description: >-
      Widening the orphan horizon from one minute to the configured 30 leaves a genuinely dead
      UPLOADED row looking healthy for up to 30 minutes after a crash.
    mitigation: >-
      This is the ruling's intent and it is bounded: the row is repaired at the next process boot by
      the marker, which is why the boot-time pass exists. Record it in the report rather than
      compensating with a second number.
  - id: R-03-5
    probability: low
    impact: low
    description: >-
      Editing tests/test_data_worker.py collides with another phase's concurrent work there.
    mitigation: >-
      Re-read immediately before editing, add only, never revert, and diff the three
      commit.assert_not_called() assertions before and after.

handoff_notes:
  - >-
    PB-14 (DP-016, phase 05) is unblocked by this block. It owns the success-path unlink and the two
    except Exception handlers in _process_csv_file_async. After B3 the production branch's shape is:
    one early own-session PROCESSING transaction, then the lock-headed main transaction. It must
    preserve that shape and both 0717b65 properties.
  - >-
    PB-13 (DP-015, phase 05) must not touch the horizon literal and must not re-apply the C-3 change.
    It may change placement and add its own config key; it owns neither this number's source nor the
    one-minute default, both of which B3 has retired.
  - >-
    Phase 05's C-2 status-contract confirmation is still outstanding. B3 did not wait for it.
  - >-
    Nothing in this block changes the public API contract's shape. GET /api/v1/upload/status/{task_id}
    gains a reachable branch, not a new field.

