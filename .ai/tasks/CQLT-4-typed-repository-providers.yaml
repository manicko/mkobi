# ── The edits, in order. One commit. ──
changes:
  order_of_operations:
    ruling: >
      **ONE COMMIT, and the order inside it is fixed only where it matters.** The measured blast radius
      is **zero new diagnostics** at every prefix of this sequence (verified by `--shadow-file` at two
      prefixes: providers-plus-in-file-consumers, and the full set including all route modules). So the
      block does not need to be split to keep `mypy src/` green, and splitting it would be strictly
      worse: the intermediate commit would be the defect with extra steps — providers typed, consumers
      still `Any`, which is provably indistinguishable from the starting state.
    why_the_brief_predicted_a_split_was_wrong: >
      The brief warned that "narrowing a provider's return type surfaces `arg-type` errors at every call
      site", so the provider and its callers would need to be one commit. Measurement refines this:
      the errors would arise at the **consumer parameter annotations**, and only once THOSE are
      narrowed — and when they are, no error is produced, because every route's existing repository
      usage already agrees with the concrete classes' signatures. The prediction was directionally right
      (one commit) for the wrong reason (the call sites are conformant, not broken).
    steps:
      - step: 1
        action: >
          In `deps.py`, add to the EXISTING `if TYPE_CHECKING:` block: the nine concrete repository
          classes not already imported (`DashboardRepository`, `AccessRepository`,
          `AggregatedDataRepository`, `LayoutRepository`, `FilterRepository`,
          `DashboardFilterRepository`, `ProcessingConfigRepository`, `ProcessingLogRepository`,
          `RegistrationRequestRepository`, `GraphRepository`) and `DashboardService`.
          `UserRepository` is ALREADY imported at module scope — do not duplicate it.
        gate: "uv run mypy src/ — still Success, no issues found in 119 source files"
      - step: 2
        action: >
          In `deps.py`, replace the ten `-> Any` provider return types with their concrete classes, and
          `get_dashboard_service`'s `-> Any` with `-> DashboardService`. Bodies untouched.
        gate: "uv run mypy src/ — still Success (a lazy annotation with no consumer change cannot error)"
      - step: 3
        action: >
          In `deps.py`, narrow the fourteen `Any`-annotated consumer parameters listed in
          `consumer_parameter_replacements`. This is the step that actually closes the hole.
        gate: "uv run mypy src/ — still Success; this is the step the measurement covers as prefix 1"
      - step: 4
        action: >
          In `deps.py.__all__`, add `"get_registration_request_repository"`. Place it adjacent to
          `get_user_repository` so the export surface groups the repository providers.
        gate: "uv run mypy src/ — unchanged. Also assert no duplicate entries are introduced."
      - step: 5
        action: >
          In the FOUR route modules, add the REAL runtime import FIRST, then replace the ten `Any`
          consumer annotations. Import before annotation: these modules lack
          `from __future__ import annotations`, so the annotation expression is evaluated at `def` time
          and a missing name is an import-time `NameError`.
        gate: "uv run mypy src/ — still Success; this is the step the measurement covers as prefix 2"
      - step: 6
        action: >
          Run the runtime resolution test (see `verification.new_tests`) BEFORE committing. It is the
          only check that can see a startup failure; mypy cannot, because mypy never evaluates a
          runtime annotation.
        gate: "the new test passes"
      - step: 7
        action: "Re-run the two probes (see `verification.probes_mandatory`) as the implementation-time proof."
        gate: "both probes produce their diagnostics; the scratch file is deleted; mypy is green again"

  what_does_NOT_change:
    - "No provider body. Each still constructs its repository and returns it."
    - "No route handler body in the four route modules."
    - "No service, repository, interface or model file."
    - "No runtime behaviour, no wire response, no status code, no log line."
    - "No new import at runtime in `deps.py` (TYPE_CHECKING only)."
    - "No `# type: ignore` anywhere. If mypy demands one, that is a finding to report, not to silence."

  deliberate_non_changes:
    - symbol: get_dashboard_filter_values_repository
      decision: "Left as `-> IDashboardFilterValuesRepository`."
      reason: >
        It is already typed, `QLT-006` does not name it, and its three public methods exactly match the
        ABC. It becomes the file's single interface-annotated provider. Record it as an intentional
        exception rather than normalising it — changing it would widen the block for no gate gain.
    - symbol: get_user_repository
      decision: "Left as `-> UserRepository`."
      reason: "Already correct, and now the file's reference example for the ruling."
    - symbol: "get_user_repository's redundant local re-import of UserRepository in its body"
      decision: "Left alone."
      reason: "Harmless, out of the finding's scope, and removing it is an unrelated tidy."
    - symbol: "__all__'s duplicate get_dashboard_service entry"
      decision: >
        Left alone. It is pre-existing and deduplicating it is a cosmetic edit unrelated to QLT-006.
        Recorded below as an observation for a future owner.
    - symbol: other names absent from __all__
      decision: "Left alone."
      reason: >
        `require_role_dependency`, `require_dashboard_read_access`, `require_dashboard_write_access`,
        `require_dashboard_admin_access` and `get_graph_service` are also absent from `deps.__all__`.
        The block brief names ONLY `get_registration_request_repository`; adding the rest would be an
        unrelated export-surface change. Recorded as an observation.

# ── Verification. The static checks ARE the proof; the runtime suite cannot prove this block. ──
verification:
  baseline_measured_at_head_ef7650d:
    - "uv run mypy src/            -> Success: no issues found in 119 source files"
    - "uv run ruff check src/ tests/ -> All checks passed!"
    - "Probe shadow method          -> uv run mypy src/ with 5 --shadow-file pairs: 0 new diagnostics at both prefixes"
  note_on_the_test_baseline: >
    The block brief states `1 failed / 1435 passed`, with the single failure the pre-existing stale
    `tests/test_layouts.py::TestLayoutsAPI::test_create_layout_duplicate_name_returns_400`. Board history
    records other baselines at the same suite (1401, then 1417, passed) as blocks landed. **Re-derive the
    baseline at your own HEAD and report a DELTA against it, never an absolute.** Do not repair that stale
    assertion; if it is your only failure, the block is clean.

  static_check_MANDATORY:
    before: >
      Run `uv run mypy src/` and RECORD the exact diagnostic count and the "checked N source files"
      figure BEFORE the first edit. Baseline is `Success: no issues found in 119 source files`.
    after: >
      Run `uv run mypy src/` and RECORD the same two numbers after the last edit. Requirements:
      (a) zero errors; (b) the file count must be UNCHANGED at 119 — a changed count means a stray file
      was left behind, which is exactly the probe-artefact failure mode; (c) the gate is NOT widened,
      which is why the before/after counts must both be recorded and compared, not assumed.
    report_both_numbers_in_the_commit_body: true

  probes_mandatory:
    rationale: >
      The `D-08-2` ruling was settled by probe at planning time. **The same two probes are re-run at
      implementation time** so the claim is proven against the shipped tree rather than inherited from the
      Planner's session. Both must pass. Method constraint: the probe file goes TEMPORARILY inside
      `src/mkobi/` — a probe outside the tree never joins the `mypy src/` build and would measure a
      different configuration, which is the whole subtlety this block turns on.
    probe_1_exact_shape:
      setup: >
        A temporary module in `src/mkobi/` that takes one parameter annotated with a concrete repository
        class and one annotated with its `mkobi.interfaces.*` ABC, calls `reveal_type` on each, and
        references a non-existent member on each.
      expected:
        - "Two `note: Revealed type is ...` lines, both naming a CONCRETE class (not `Any`)."
        - 'Two `error: ... has no attribute "no_such_member_zzz"  [attr-defined]` diagnostics.'
      meaning: "Proves the concrete annotation buys member checking, i.e. that the Phase-0 auditor was wrong."
    probe_2_exact_shape:
      setup: >
        Same temporary module, now calling a REAL repository method through a provider-returned variable,
        once with a misspelled keyword argument and once with a wrong argument type.
      expected:
        - '`error: Unexpected keyword argument "nmae" for "get_by_name" ...  [call-arg]`'
        - '`error: Argument "name" ... has incompatible type "int"; expected "str"  [arg-type]`'
      meaning: "Proves argument checking survives the narrowing at a real call site."
    probe_3_route_annotation_negative_control:
      setup: >
        In ONE of the four route modules, add a statement referencing a non-existent member on a
        narrowed repository parameter.
      expected: '`error: "<Class>" has no attribute "<bogus>"  [attr-defined]` — then REMOVE it.'
      meaning: >
        Proves the route-module annotations are live under mypy. Without it, a silent shadow or a
        mis-scoped annotation would make the whole gate vacuous.
    cleanup_MANDATORY:
      - "Delete the probe module."
      - "Re-run `uv run mypy src/` and confirm the file count is back to exactly 119."
      - "Confirm `git status --porcelain` shows no untracked file under `src/`."

  new_tests:
    decision: >
      **Exactly ONE new test, and it is not an annotation-existence test.** A runtime test asserting that
      an annotation exists is trivia: `tests/test_deps.py::TestRepositoryFactories` already holds three
      `isinstance` assertions and they pass under ANY annotation, including `-> Any` — which is precisely
      why they cannot prove this block. A test that asserts `get_type_hints` returns a class would be the
      same trivia wearing a hat. **Do not write one.**
    the_one_warranted_test:
      name: "tests/test_deps.py::TestRepositoryProviderAnnotations::test_narrowed_dependency_annotations_resolve_at_runtime"
      what_it_does: >
        Component-interaction verification of the one failure mode this block introduces and mypy cannot
        see. `mypy` never evaluates a runtime annotation, but FastAPI does: it resolves every `Depends`
        parameter annotation while building the dependency graph. The four route modules have no
        `from __future__ import annotations`, so a `TYPE_CHECKING`-only import there is an import-time
        `NameError` and the application fails to start — with mypy reporting nothing at all.
      three_assertions:
        - "Import each of the four changed route modules; the import itself must succeed."
        - >
          For one handler in each, resolve the handler signature's annotation for the narrowed repository
          parameter with `typing.get_type_hints` and assert it resolves to the concrete class. This is the
          exact call FastAPI makes, and it is the assertion that fails on a `TYPE_CHECKING`-only import.
        - "Build the FastAPI application so the full dependency graph is constructed; a `NameError` or unresolvable forward reference raises at startup here."
      why_this_and_not_identity: >
        The brief offered instance-identity as the alternative. Rejected on measurement: the provider
        BODIES are unchanged by this block, so instance identity is not a property this block puts at
        risk, and a test for it would be pure regression trivia for an untouched line. The runtime
        resolution risk, by contrast, is created here and only here.
    not_required_but_cheap:
      - >
        `TestRepositoryFactories` covers only 3 of the 10 providers (user, dashboard, access); the other
        eight have no construction test. Extending it would be genuine coverage — but mypy already proves
        annotation/body agreement (a mis-annotated provider is an immediate `return-value` error under
        `warn_return_any`), so the added tests would prove nothing this block claims. **Not required.**

  pins_must_stay_green_unmodified:
    - "tests/test_deps.py::TestRepositoryFactories — its three tests, unmodified (and they cannot detect this block; that is accepted)"
    - "tests/test_deps.py::TestDIFactories — unmodified"
    - "tests/test_deps.py::TestDashboardAccessDependencies — unmodified (CQLT-2's pin)"
    - "The four TestResourceAccessControl* classes in tests/test_resource_access_control.py — FORBIDDEN, assertions untouched"
    - "tests/test_repositories.py — 36 passing, and now the designated evidence for ORM attribute correctness"
    - "tests/test_openapi.py — narrows nothing that reaches a schema, but confirm the app still builds"

  mutation_proof:
    step: "Narrow `get_graph_repository()` to a deliberately wrong class (e.g. `-> LayoutRepository`)."
    expect: "`uv run mypy src/` reports a `return-value` error in `deps.py`."
    restore: "Revert the annotation; `uv run mypy src/` is green again."
    why: "Proves the gate is live rather than vacuously satisfied — the same discipline CQLT-2 used."

  full_suite:
    command: ".\\Makefile.ps1 test"
    startup: ".\\Makefile.ps1 test-up   # ONCE per session — Invoke-TestSelect does NOT start the services"
    single_tenant_warning: >
      `tests/conftest.py::setup_test_database` runs `DatabaseStarter.recreate_test_database()` (DROP /
      CREATE DATABASE) every session. **At most one suite at a time.** If another agent is running one,
      WAIT. A failure that moves between runs is contamination, not a regression — re-run it with no
      other suite active before calling it a delta.
    expectation: >
      Same failure count as the baseline you measured; passed count grows by exactly 1 (the one new test).
      The only acceptable failure is the pre-existing stale
      `test_layouts.py::TestLayoutsAPI::test_create_layout_duplicate_name_returns_400`.

  gates_precondition_not_evidence:
    note: >
      `ruff` and `mypy` being green is a PRECONDITION of this block, not evidence for it: they were
      already green at HEAD, and they stay green whether or not the annotations are correct. The evidence
      is the before/after counts, the two probes, the negative control, and the mutation proof.

  documentation:
    no_change: true
    searched: "Every `docs/**/*.md`, for `deps.py`, the ten provider names, `repository_interfaces`, `IDashboardRepository` and `-> Any`."
    finding: >
      **NOTHING in `docs/` documents these repository factory providers or `deps.py`'s typing.** Every hit
      concerns a different dependency: `get_current_user_dependency` (auth-api.md, access-control.md),
      `require_admin_role` (health-api.md), `require_dashboard_admin_access` (access-control.md),
      `get_db_dependency` (architecture.md), and one unrelated code sample in task-queue-migration.md. No
      document describes a provider's return type, so no document becomes stale.
    ruling: >
      **Default to no documentation change, and that default stands.** A document describing `-> Any`
      would be unusual, and none exists.
    spec_md_version_row: >
      **NO row is added.** One phase-level `docs/SPEC.md` version row is owed to the phase documentation
      pass, and other phases append to that table concurrently. Record the hand-off in the commit body and
      add nothing.

