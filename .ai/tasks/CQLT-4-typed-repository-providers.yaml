commit:
  message: "refactor(api): type the repository factory providers in deps.py"
  format: >
    Conventional-commit subject. One commit for the whole block — see
    `changes.order_of_operations.ruling` for why splitting is strictly worse.
  stage_only:
    - src/mkobi/api/deps.py
    - src/mkobi/api/routes/admin.py
    - src/mkobi/api/routes/dashboards_filters.py
    - src/mkobi/api/routes/dashboards_graphs.py
    - src/mkobi/api/routes/data.py
    - tests/test_deps.py
  never:
    - "pyproject.toml — a widened gate would make this block unprovable"
    - "Makefile.ps1 — `alembic/env.py` must stay named in BOTH targets"
    - "alembic/ — no migration exists in this block"
    - "src/mkobi/core/permissions.py"
    - "tests/test_resource_access_control.py — the four TestResourceAccessControl* classes"
    - "tests/test_layouts.py — the stale assertion stays stale"
    - ".ai/audit/**, .ai/plans/**"
  body_must_state:
    - "D-08-2 is ruled OPTION (b), concrete classes, on probe evidence — and that the Phase-0 auditor's contrary assertion is refuted by measurement."
    - "The two probe results, verbatim enough to be re-checked, and the negative control."
    - "mypy src/ BEFORE and AFTER, with the checked-file count in both."
    - "The blast radius measured as zero new diagnostics at every prefix of the sequence."
    - "That the finding's ten provider NAMES are wrong (six do not exist) and the ten real names were resolved by symbol."
    - "That narrowing the providers alone would have changed nothing, because all twenty-five consumer parameters were `Any`; both halves shipped together."
    - "The residual gap the probes DID find: SQLAlchemy model attribute access is unchecked (no mypy plugin), so tests/test_repositories.py remains the evidence; plugin enablement is a phase-09 config finding, NOT actioned here."
    - "get_registration_request_repository added to deps.__all__; the other __all__ omissions observed and deliberately left."
    - "get_dashboard_permissions::access_repo, get_redis_client_dependency, get_dashboard_filter_values_repository and get_user_repository deliberately untouched, with reasons."
    - "No documentation change, and the docs/SPEC.md version row hand-off to the phase documentation pass."
    - "The suite result as a DELTA against the re-derived baseline, plus the note that the test DB is single-tenant."

failure_action: >
  If `mypy src/` cannot be made green WITHOUT a `pyproject.toml` change, STOP and report it as a
  finding. Do not add an override, do not add a plugin, do not add a `# type: ignore`. The measurement
  says the configuration does not defeat the fix, so a config change being necessary would mean the tree
  moved under the task — report the drift instead of forcing it through. If a route module cannot take a
  runtime import without creating a cycle, that is also a finding, not a licence to leave the annotation
  `Any`.

constraints:
  - "English only — code, comments, docstrings, commit message, commit body."
  - "Resolve every target BY SYMBOL. Never edit by line number; this block has five files and one of them is 1014 lines."
  - "Production code is king (AGENTS.md rule 2). Never distort production code to make a test pass, and never weaken an annotation to silence mypy."
  - "Small, focused edits: annotations, the imports they require, and one __all__ entry. No refactoring, no reformatting, no import reordering beyond what the new imports need."
  - "Never run `git reset`, `git checkout`, `git restore`, or rewrite history."
  - "At most one test suite at a time; `.\\Makefile.ps1 test-up` once per session first."
  - "No `# type: ignore`, no `@ts-ignore`, no new noqa, no pyproject edit — under any circumstance."
  - "deps.py is phase-04 co-owned: keep the change additive and surgical so it merges cleanly."

divergences_found_by_the_planner:
  - id: DV-1
    severity: high
    about: "The finding's ten provider names are largely fictional."
    detail: >
      Six of the ten names in `QLT-006` do not exist in this tree: `dashboard_access_repository`,
      `dashboard_graph_repository`, `upload_repository`, `audit_log_repository`, `user_session_repository`,
      `filter_value_repository`. The COUNT of ten `-> Any` providers is correct; the labels are stale
      from an older tree. An implementor trusting the names would edit nothing.
  - id: DV-2
    severity: high
    about: "The finding's stated mechanism is incomplete."
    detail: >
      Narrowing the ten provider returns changes ZERO diagnostics and ZERO route behaviour, because all
      twenty-five consumer parameters are `Any` and re-widen the value immediately. QLT-006 is only
      closed if the consumers are narrowed too. The block was widened to 25 consumer sites in 5 files on
      this basis.
  - id: DV-3
    severity: high
    about: "The four route modules cannot use TYPE_CHECKING imports."
    detail: >
      None of `admin.py`, `dashboards_filters.py`, `dashboards_graphs.py`, `data.py` has
      `from __future__ import annotations`, so a `TYPE_CHECKING`-only import would be an import-time
      `NameError` — a startup crash that mypy reports nothing about. This is the one genuinely new risk
      the block creates, and it is why exactly one runtime test is warranted.
  - id: DV-4
    severity: medium
    about: "TestRepositoryFactories has three tests, not twelve, and covers 3 of the 10 providers."
    detail: >
      The brief's "twelve isinstance assertions" does not match HEAD: the class holds three tests with
      three assertions (user, dashboard, access). Eight providers have no construction test at all. Not
      required to extend — mypy proves annotation/body agreement — but recorded so the next owner is not
      surprised.
  - id: DV-5
    severity: medium
    about: "The phase-0 audit contradicted itself on D-08-2 and both positions were unevidenced."
    detail: >
      The auditor asserted the concrete option is also suppressed; the Planner refuted it. Measurement
      settles it in the Planner's favour: `follow_imports = "skip"` does not apply to modules inside the
      `mypy src/` build, and `ignore_errors` suppresses in-module diagnostics without degrading exported
      types (`Dashboard` reveals concretely). The original clause demanding "substitute evidence" for a
      lost checker is therefore void and has been re-specified against the gap that actually survives.
  - id: DV-6
    severity: low
    about: "get_dashboard_service() -> Any is an eleventh route-visible `-> Any` the finding does not name."
    detail: >
      Ten route sites already annotate `dashboard_service: DashboardService`, so the `Any` return actively
      discards an annotation the routes already write. Included in the block; the one remaining `Any`
      consumer, `get_accessible_dashboard_ids::dashboard_service`, is annotation-only and its body is
      CQLT-3's.
  - id: DV-7
    severity: low
    about: "deps.__all__ has more omissions than the one the brief names, plus a duplicate."
    detail: >
      `get_graph_service`, `require_role_dependency`, `require_dashboard_read_access`,
      `require_dashboard_write_access` and `require_dashboard_admin_access` are also absent, and
      `get_dashboard_service` is listed TWICE. Only the brief's named gap is fixed; the rest are recorded
      for a future owner rather than swept into a typing block.
  - id: DV-8
    severity: low
    about: "No documentation change, confirmed by search rather than assumed."
    detail: >
      No `docs/**/*.md` file mentions the ten providers, the interfaces module, or `deps.py`'s typing.
      The rule requires naming a file if one exists; none does, so the no-change default stands.

