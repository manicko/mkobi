status_note: >
  **One commit, no repair work, measured green.** `D-08-2` was ruled by probe, not by argument, and the
  probes REFUTED the Phase-0 auditor's position. The Planner measured the full narrowing with
  `mypy --shadow-file` across all five affected files: **0 new diagnostics** over the 119-file build,
  with a negative control proving the shadows bound. The block is typing-only; no behaviour changes and
  no existing test needs editing. Priority is `medium` rather than `high` precisely because the risk is
  measured at zero — the value is that the hole is finally closed.
  **Single-tenant test DB:** run ONE suite, `.\\Makefile.ps1 test-up` first (`Invoke-TestSelect` does not
  start the services). A failure that MOVES between runs is contamination, not a regression.

description: >
  `api/deps.py` exposes ten repository factory providers annotated `-> Any`. Each provider therefore
  hands the route layer an untyped object, and every repository call made through it is unchecked.
  `get_user_repository()` is already `-> UserRepository` and `get_dashboard_filter_values_repository()`
  is already `-> IDashboardFilterValuesRepository`; this block brings the other ten to the same
  standard, annotating each with its **concrete** `mkobi.db.repositories.*` class per the `D-08-2`
  ruling below. Narrowing a provider is not sufficient on its own: all twenty-five `Depends()` consumer
  parameters are *themselves* annotated `Any`, so the block also narrows those, plus
  `get_dashboard_service() -> DashboardService`. Finally it adds `get_registration_request_repository`
  to `deps.__all__`, which is currently absent from the export surface.

goals:
  - Close QLT-006: no `-> Any` repository factory provider remains in api/deps.py
  - Narrow the consumer parameters too, or the route layer still gets zero member checking (measured)
  - Settle `D-08-2` on recorded probe evidence, not on the disputed Phase-0 audit assertion
  - Re-specify the plan's substitute-evidence clause against what the probe actually found
  - Repair the `deps.__all__` export surface gap for get_registration_request_repository
  - Leave production behaviour, every wire response, and every existing assertion byte-identical

# ── Rulings. Settled by measurement at HEAD ef7650d. Do not re-derive, do not re-open. ──
extra_context:
  decision_D_08_2:
    id: "D-08-2 (settled by probe, Planner, 2026-10-04, HEAD ef7650d)"
    ruled: >
      **OPTION (b) — annotate each provider with its CONCRETE `mkobi.db.repositories.*` class.** The
      Phase-0 auditor's position ("concrete classes are suppressed too") is **REFUTED by measurement**;
      the Planner's refutation of it is **confirmed by measurement**. `follow_imports = "skip"` does not
      degrade `src/` modules, because `mypy src/` places every file under `src/` in the build, so
      `skip` never applies to them. And `ignore_errors = true` on `mkobi.db.models.*` suppresses only
      diagnostics REPORTED INSIDE that module — it does not degrade the types it exports.
    why_not_a:
      - "Probe 2 shows (a) and (b) are EQUAL on argument checking, so (a)'s usual advantage does not exist here."
      - "Probe 1 shows (b) is STRICTLY BETTER on return precision: element type `Dashboard` under (b), `Any` under (a)."
      - >
        **`DashboardFilterRepository` has NO interface at all** (`class DashboardFilterRepository:` — a
        plain class, no base). Option (a) cannot type `get_dashboard_filter_repository` without authoring
        a brand-new `abc.ABC`. Option (b) covers all ten providers with no new abstraction anywhere.
      - >
        The ABCs sit under `ignore_errors = true`, and `repository_interfaces.py::IAccessRepository.grant_access`
        already self-documents that "the type checker does not verify this declaration". Under (a) an
        ABC/implementation drift is unverifiable BY CONSTRUCTION; under (b) the concrete declaration is
        exactly what gets checked.
    soundness_at_the_service_boundary:
      - >
        Every concrete repository subclasses its ABC (`DashboardRepository(IDashboardRepository)`,
        `AccessRepository(IAccessRepository)`, and so on for all nine), and every service `__init__`
        declares the ABC (`DashboardService(dashboard_repo: IDashboardRepository, ...)`). Passing the
        concrete class where the interface is declared is therefore assignment-compatible. Measured: 0 errors.
    in_repo_precedent:
      - >
        Ten route sites ALREADY do exactly what (b) prescribes for repositories:
        `dashboard_service: DashboardService = Depends(get_dashboard_service)` with a real runtime import
        at `dashboards_crud.py` and `dashboards_access.py`. Option (b) is the file's existing convention,
        not a new one.

  probe_evidence:
    method: >
      Probes were run under the project's own configuration (`uv run mypy src/`) with the probe file
      placed TEMPORARILY inside `src/mkobi/` and deleted afterwards, because a probe file outside the
      tree would not join the build and would measure a different configuration. Baseline at `ef7650d`:
      `Success: no issues found in 119 source files`, and `uv run ruff check src/ tests/` `All checks passed!`.
    probe_1_non_existent_member:
      - 'concrete: reveal_type -> "mkobi.db.repositories.dashboard_repo.DashboardRepository"; `.no_such_member_zzz` -> error [attr-defined]'
      - 'interface: reveal_type -> "mkobi.interfaces.repository_interfaces.IDashboardRepository"; `.no_such_member_zzz` -> error [attr-defined]'
      - 'model: reveal_type(dashboard_model.Dashboard) -> "mkobi.db.models.dashboard.Dashboard"  (NOT Any, despite ignore_errors = true)'
      - 'no-interface class: reveal_type(DashboardFilterRepository) -> "mkobi.db.repositories.dashboard_filter_repo.DashboardFilterRepository"'
      - 'return precision, `await repo.get_by_user(...)`: concrete -> "list[tuple[mkobi.db.models.dashboard.Dashboard, str | None]]", element "Dashboard"; interface -> "list[tuple[Any, str | None]]", element "Any"'
      - '**`rows[0][0].no_such_column_zzz` produced NO error on EITHER path** — see `gap_model_attributes` below.'
    probe_2_mistyped_argument:
      - 'concrete, misspelled kwarg `get_by_name(nmae="x", db=db)` -> error [call-arg]'
      - 'concrete, wrong arg type `get_by_name(name=123, db=db)` -> error [arg-type] "int"; expected "str"'
      - 'interface, misspelled kwarg -> error [call-arg]'
      - 'interface, wrong arg type -> error [arg-type] "int"; expected "str"'
      - "=> TIE. Both options catch both defects. (a) buys nothing here that (b) does not."
    blast_radius_measurement:
      method: >
        `uv run mypy src/ --shadow-file <real> <shadow>` for all five affected files — the exact
        narrowing, applied without editing a single repository file.
      result_1_deps_only: >
        Ten providers + nine in-file consumer parameters + `get_dashboard_service() -> DashboardService`:
        `Success: no issues found in 119 source files`. **Zero new diagnostics.**
      result_2_full: >
        The above PLUS all ten route-module consumer parameters: `Success: no issues found in 119 source files`.
        **Zero new diagnostics.**
      negative_control: >
        A deliberately bogus member on the narrowed annotations fires
        `error: "DashboardRepository" has no attribute "no_such_member_control" [attr-defined]` and
        `error: "RegistrationRequestRepository" has no attribute ...` — one per shadowed file. The
        greens above are therefore real, not a silently-unbound shadow.

  clause_respecification_substitute_evidence:
    original_wording_problem: >
      The plan's clause assumed the member checker would be **lost under one option**, so it asked for a
      substitute in that case. Measurement says the premise is void: under (b) the checker is retained
      AND strengthened. **No substitute evidence is owed for the provider annotations.**
    what_the_probe_actually_found_instead: >
      The gap that survives this block is different and narrower: **attribute access on SQLAlchemy model
      instances is unchecked**. The probe's `rows[0][0].no_such_column_zzz` produced no diagnostic even
      though `rows[0][0]` reveals as the concrete `Dashboard`, because no
      `sqlalchemy.ext.mypy.plugin` is registered under `[tool.mypy] plugins`. Under option (a) the same
      expression is unchecked for a second, independent reason (the element is `Any`).
    re_specified_clause: >
      `tests/test_repositories.py` (36 passing) REMAINS the evidence for ORM column and attribute
      correctness. Enabling `sqlalchemy.ext.mypy.plugin` is a **configuration finding for phase 09** —
      `pyproject.toml` is FORBIDDEN to this block, and adding an override or a plugin to make a defect
      invisible is expressly prohibited. Record it; do not action it.
  open_finding_config_owner_not_actioned:
    - >
      `pyproject.toml` sets `ignore_errors = true` for `mkobi.db.models.*` and `mkobi.interfaces.*`.
      Measured: this does NOT degrade the types those modules export (both still reveal concretely), so
      it does not defeat this block. But it DOES mean no diagnostic is ever reported inside either
      module, which is why `IAccessRepository.grant_access` carries a hand-written note saying the
      checker does not verify it. Flag for a phase-09 config owner; out of scope here.

  divergence_the_finding_gets_wrong:
    finding_provider_names: >
      The finding names ten providers as `user_repository, dashboard_repository,
      dashboard_access_repository, dashboard_graph_repository, layout_repository,
      processing_config_repository, upload_repository, audit_log_repository, user_session_repository,
      filter_value_repository`. **Six of those ten names do not exist in this tree.** Resolved by symbol,
      the ten `-> Any` providers are: `get_dashboard_repository`, `get_access_repository`,
      `get_aggregated_data_repository`, `get_layout_repository`, `get_filter_repository`,
      `get_dashboard_filter_repository`, `get_processing_config_repository`, `get_processing_log_repository`,
      `get_registration_request_repository`, `get_graph_repository`. There is no `upload_repository`,
      no `audit_log_repository`, no `user_session_repository`, and no `dashboard_access_repository`.
      The count of ten is correct; only the labels are stale.
  divergence_the_finding_premise_is_incomplete:
    premise: >
      The finding says "Ten `Any` returns mean the route layer gets no member checking on every
      repository call." The route layer's missing checking is real, but the **fix is not only the
      provider return type**.
    measured: >
      All **twenty-five** `Depends()` consumer parameters are annotated `Any` — thirteen inside
      `deps.py`'s own service providers and ten across four route modules. Narrowing the ten providers
      alone changes **zero** diagnostics and **zero** route behaviour (measured green either way),
      because the value is immediately re-widened to `Any` at the consumer. QLT-006 is only closed when
      the consumers are narrowed too. `get_dashboard_service() -> Any` is the same defect one layer up:
      ten route sites already annotate the parameter `DashboardService`, so the `Any` return actively
      *discards* an annotation the routes already write.

  call_site_census_measured:
    note: "Every figure below is a `Depends(<provider>` census over `src/mkobi` (recursive). Total = 25."
    get_dashboard_repository: "2 in deps.py (get_dashboard_service, get_data_service)"
    get_access_repository: "2 in deps.py (get_dashboard_service, get_dashboard_permissions) + 0 routes"
    get_aggregated_data_repository: "1 in deps.py (get_data_service) + 0 routes"
    get_layout_repository: "1 in deps.py (get_layout_service) + 0 routes"
    get_filter_repository: "1 in deps.py (get_filter_service) + 1 in dashboards_filters.py"
    get_dashboard_filter_repository: "0 in deps.py + 3 in dashboards_filters.py"
    get_processing_config_repository: "1 in deps.py (get_processing_config_service) + 0 routes"
    get_processing_log_repository: "2 in deps.py (get_processing_log_service, get_data_service) + 0 routes"
    get_registration_request_repository: "1 in deps.py (get_auth_service) + 3 in admin.py"
    get_graph_repository: "2 in deps.py (get_graph_service, get_data_service) + 3 routes (dashboards_graphs.py x2, data.py x1)"

  circular_import_verified_not_assumed:
    finding: >
      **No cycle exists.** `src/mkobi/db/repositories/**` and `src/mkobi/services/**` contain ZERO
      references to `mkobi.api` (measured). No module outside `api/routes/` imports `mkobi.api.deps`
      at all. `DashboardService`, `LayoutService` and every other service named here are therefore
      reachable from `deps.py` without a cycle.
    consequence_for_deps_py: >
      `deps.py` has `from __future__ import annotations`, so its annotations are lazy strings. Import the
      concrete classes and `DashboardService` under the EXISTING `if TYPE_CHECKING:` block. This adds
      **zero** runtime imports and **zero** import-time cost.
    consequence_for_route_modules_CRITICAL: >
      **`admin.py`, `dashboards_filters.py`, `dashboards_graphs.py` and `data.py` do NOT have
      `from __future__ import annotations`** (measured: zero occurrences in all four). FastAPI resolves
      `Depends` parameter annotations at runtime, and without the future import the annotation expression
      is evaluated at `def` time. A `TYPE_CHECKING`-only import in these four modules is therefore a
      **hard `NameError` at import time — the app fails to start.** These four modules need a REAL
      runtime import. The precedent already exists in the tree: `dashboards_crud.py` and
      `dashboards_access.py` both import their concrete service class at module level.

  concrete_classes_all_typed:
    finding: >
      **No concrete repository class is itself untyped or `Any`-returning.** A scan of
      `src/mkobi/db/repositories/**` for `-> Any` returns **zero hits**, and Probe 1 revealed all probed
      classes as concrete types. Annotating with them is therefore NOT cosmetic — each annotation buys
      real `return-value` checking under `warn_return_any = true`.

