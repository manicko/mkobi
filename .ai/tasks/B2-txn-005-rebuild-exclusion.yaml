constraints:
  architecture:
    - >-
      One new module, one responsibility. `src/mkobi/db/advisory_lock.py` holds exactly the
      namespace constant, the SQLSTATE constant, the derivation, the acquisition and the
      failure predicate. It does not also grow transaction policy, status transitions or
      worker orchestration.
    - >-
      Layering: `workers` may depend on `db`; `db` must not depend on `workers`. The helper
      never imports from `mkobi.workers`, and reads its bound from `mkobi.config` only.
    - >-
      The worker call site stays two statements wide. No lock policy, no timeout arithmetic
      and no error-shape knowledge leaks into `data_worker.py`.
  correctness:
    - >-
      The acquisition helper must be called from inside an already-open transaction. Do not
      open, commit or roll back a transaction inside it, and do not move the call above
      `session.begin()`.
    - >-
      `set_config(..., true)` is mandatory; a bare `SET lock_timeout` is forbidden, and so
      is `SET LOCAL` (it cannot take a bind parameter).
    - >-
      The derived key must be a signed int64-range value and identical in every process. No
      `hash()`, no `uuid` truncation, no SQL-side `hashtextextended`, no little-endian
      reading.
    - >-
      Classification keys on `sqlstate`. Never on exception type — the asyncpg dialect's
      mapping makes `isinstance(exc, OperationalError)` `False` for this error.
    - >-
      Do not consume the return value of either `execute`; `TestProcessingFailureReportedOnOwnSession`
      substitutes an `AsyncMock` session on the production branch.
    - >-
      Both statements are parameterised. No f-string, no `%`, no concatenation into SQL text.
  process:
    - "English only — docstrings, comments and log messages."
    - "No `print()`; use `logger = logging.getLogger(__name__)`."
    - "No pandas. Polars only, and this block touches no data processing."
    - >-
      Type hints on every public function, including the keyword-only parameters
      (`task_id: str | None`, `timeout_ms: int | None`) and the `-> None` return of the
      acquisition helper.
    - >-
      Comments only where non-obvious: why `set_config` instead of `SET LOCAL`, why
      `signed=True`, why the lock is second, why the classification is sqlstate-keyed, why
      the bound sits below the stale backstop. No narration of what the next line does.
    - >-
      Single-line commits where the split is meaningful; run `.\Makefile.ps1 format` before
      committing (it runs `ruff check --fix`, which is what sorts imports).

verification_steps:
  - command: "git status --porcelain; git log --oneline -3"
    expect: >-
      HEAD at or after `cea2d06`; if `tests/test_data_worker.py` or
      `src/mkobi/workers/data_worker.py` shows uncommitted changes, they are another agent's
      — read and preserve them.
  - command: ".\\Makefile.ps1 test-select -k test_advisory_lock -v"
    expect: "All new tests pass: the derivation class, the four exclusion tests and the non-leak class."
  - command: ".\\Makefile.ps1 test-select -k test_data_worker -v"
    expect: "The new classification class passes and every pre-existing test in the module still passes, `TestDataWorker` included."
  - command: ".\\Makefile.ps1 test-select -k test_file_cleanup -v"
    expect: "Both `TestProcessingFailureReportedOnOwnSession` tests pass unchanged — the AsyncMock production-branch session absorbs the added statements."
  - command: ".\\Makefile.ps1 test-select -k test_config -v"
    expect: "No config test regressed by the new `DatabaseSettings` field."
  - command: ".\\Makefile.ps1 test-select -k test_enum_db_consistency -v"
    expect: "Unchanged — no enum was added and no migration was created."
  - command: "uv run ruff check src/mkobi/db/advisory_lock.py src/mkobi/config.py src/mkobi/workers/data_worker.py tests/test_advisory_lock.py tests/test_data_worker.py"
    expect: "Clean, including import ordering (I001) on the two edited modules."
  - command: "uv run mypy src/mkobi/db/advisory_lock.py src/mkobi/config.py src/mkobi/workers/data_worker.py"
    expect: "No errors."
  - command: ".\\Makefile.ps1 test"
    expect: "Full suite green. This is the block's release gate: the lock runs in the production branch, which several integration suites reach."

