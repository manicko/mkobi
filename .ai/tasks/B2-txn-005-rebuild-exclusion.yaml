out_of_scope: |
  Everything below is another block's or another phase's work. Do not touch it, and do not
  "improve" it while passing through.

  - **B3 (TXN-002 / TXN-004)** owns the transaction restructure and the processing-status
    transitions — in particular moving the `PROCESSING` write out of the blocked transaction
    and shortening the span of the worker's transaction. B2 does not shorten the transaction,
    and must not move the lock in anticipation of B3's boundary. B3 will insert its own first
    statement; B2's lock stays first until then.
  - **DP-015** owns the one-minute orphan literal (`mark_orphaned_uploaded_logs_failed`) and
    the reconciliation `stale_processing_log` row. Not this block.
  - **B7 (TXN-010)** owns `get_async_engine`'s pool parameters, including the absent
    `pool_recycle`. B2 changes nothing in `db/session.py`.
  - **`pool_pre_ping` / `idle_in_transaction_session_timeout`**: the first is already safe and
    needs no change; the second will not rescue a lock waiter (a blocked session reports
    `state='active'`, `wait_event='Lock'`) and adding it is B7's call, not B2's.
  - **Not a 409**: `ErrorCode.PROCESSING_IN_PROGRESS`'s existing HTTP mapping stays exactly as
    it is. This path stores the code on the processing-log row; it never raises it.
  - **No new exclusion mechanism anywhere else**: not in the API upload route, not in
    `StorageManager`, not in `rq_worker_wrapper`. One exclusion, one place.
  - **No lock in the caller's-session (test) branch** of `_process_csv_file_async`: it has no
    `session.begin()` of its own and `tests/conftest.py::async_db_session` is SAVEPOINT-based.
  - **Docs**: `docs/06-backend/architecture.md` is B10's (TXN-012); `docs/SPEC.md` version
    history gets one row for the whole phase at the close, not one per block. The
    pre-existing absence of `STALE_PROCESSING_TIMEOUT_MINUTES` and
    `STALE_PROCESSING_CLEANUP_INTERVAL_SECONDS` from the configuration table is a drift
    recorded for the phase close, not something to fix here.
  - **No server-side or compose-level GUC change**: no `command:`/`postgresql.conf` edit, no
    `PGOPTIONS`, no compose environment variable. The bound is set per transaction from
    application configuration.
  - **Alembic and `alembic/env.py`'s existing `pg_advisory_lock`** stay untouched — the
    namespace prefix is precisely what keeps the two key spaces apart.

