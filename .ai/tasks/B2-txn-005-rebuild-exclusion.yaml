      that nothing else was rerouted. Leave `TestDataWorker` untouched — including its three
      `commit.assert_not_called()` assertions, which cannot be affected by this block.
      Read the file before editing: it was modified in the working tree by concurrent
      phase-01 work and that work is now committed (`cea2d06`), but the file is still
      shared ground.

