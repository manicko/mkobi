          merely "has a row → admit". Assert 403 and absence via a second session.
      TestGrantAccessAudience::test_user_with_no_grant_is_refused_and_writes_no_row:
        why: >
          The acceptance criterion. A non-admin with no grant gets **403** and `dashboard_access` gains
          **no** row, asserted through a **second** session.
      TestListAccessAudience::test_administrator_who_is_neither_owner_nor_grantee_may_list:
        why: "The gate is on the read surface too (ruling 6). 200, with the records returned."
      TestListAccessAudience::test_user_with_no_grant_is_refused:
