    file: tests/test_dashboards_access_api.py
    description: >
      **Fixtures and mechanics, identical across all eight:**
      - Use plain **`async_client`**, never `authenticated_client`'s inherited header. Impersonate with
        `create_access_token({"user_id": str(u.id), "email": u.email})` and
