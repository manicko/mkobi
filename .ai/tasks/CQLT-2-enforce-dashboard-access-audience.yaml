# ── Commit ────────────────────────────────────────────────────────────────────
commit:
  message: "fix(api): enforce the declared dashboard access audience"
  format: >
    `{type}({scope}): {description}` — lowercase imperative, no trailing period, matching this repo's
    history (`fix(routing): disable slash redirects so the served shape is the declared shape`,
    `fix(redis): declare the transport bound and pin the retry policy`,
    `fix(health): report a degraded redis dependency on the detailed probe`).
  stage_only:
    - src/mkobi/api/routes/dashboards_access.py
    - tests/test_dashboards_access_api.py
    - docs/02-dashboards/dashboards-api.md
    - docs/08-security/access-control.md
  never:
    - "`git reset`, `git checkout`, `git restore` — never rewrite history."
    - "`git add -A` / `git commit -a` — stage only the four files above."
  body_must_state:
    - >
      **The ruling.** `D-08-4` (Product Owner, 2026-10-03, register cluster 1) — the audience is owner
      **or** administrator, with an explicit rule that an administrator who is neither owner nor grantee
      may still manage access. The **enforcement point** is the shared dependency
      `api/deps.py::require_dashboard_admin_access`, and it is the only enforcement point.
    - >
      **Install ownership.** **Plan 12 installs `AZ-3`; this block co-signs and installs no second copy**
      (`C08-2`). The two-owner collision resolves in favour of plan 12.
    - >
      **The wire change, in one sentence:** `200` becomes `403` on three documented endpoints
      (`POST`, `GET` and `DELETE /api/v1/dashboards/{id}/access`) — **for callers who are neither the
      owner nor an administrator only**; owner and administrator callers see no change. State the three
      concrete deltas: grant on an absent dashboard `422 → 403`; list on an absent dashboard
      `200 [] → 403`; the path/body mismatch `422` becomes role-dependent (admin `422`, non-admin `403`).
    - >
      **The operator consequence, stated plainly:** **wrongly-created `dashboard_access` rows and filter
      bindings persist and require operator reconciliation, because this fix rewrites no stored row.**
      Any working client flow that relied on the unenforced rule is a defect to fix, not a client to
      accommodate.
    - >
      **The AZ-3 clause is satisfied vacuously.** Its premise — an asymmetry between
      `require_dashboard_admin_access` and `check_dashboard_access` — does not exist:
      `_check_access_with_session` carries the admin bypass *before* the grant read, so an administrator
      who is neither owner nor grantee is already granted (`DR-08-02`). No code change depends on it.
    - >
      **The 403-on-absent divergence is a live item owned by `AZ-5`** and is stated, not fixed here. The
      gate **closes** two live existence oracles (list no longer distinguishes an absent dashboard from
      a present one; revoke no longer distinguishes a present grant from an absent one). **No 404 branch
      was added** — doing so would pre-empt `AZ-5` and break
      `test_unknown_dashboard_still_returns_422`.
    - >
      **Open notice to `DP-12-B` / `AZ-5`, unresolved here by design:** `DP-12-A` counts four *write*
      surfaces, and `GET …/access` is a read. It is gated as admin per `D-08-4`, but the read/write
      tension is real and is not resolved by this block. `require_dashboard_read_access` was rejected as
      the gate because it admits any `view` grantee and the ACL list is the membership map.
    - >
      **The create path is covered by the same rule, not exempted.** `DashboardService.create_dashboard`
      already writes an `ADMIN`-level grant to `owner_id`, which is always an `AdminUser`, so the ruled
      rule holds over it **by construction**. **Zero code and no test were added there** — a second check
      would be a second enforcement point (`VAL-08-005`, `C08-11`).
    - >
      **`api/deps.py` was not edited.** The helper was already a correct pure passthrough; the block
      changed only its call sites. `core/permissions.py`, the service layer, `docs/SPEC.md`,
      `pyproject.toml` and `Makefile.ps1` are untouched.
    - >
      **The measured delta:** the suite was red at `9 failed / 1401 passed` on `b95ba52` (5 ×
      `test_auth.py::TestRateLimiting`, 3 × `test_layouts.py::TestLayoutsAPI` create-layout, 1 ×
      `test_pydantic_models.py::TestUserModels::test_user_db_valid` — all pre-existing and unrelated).
      After this block: **`9 failed / 1409 passed`**, i.e. **+8 new passing, 0 new failing, 0 fixed**.
    - >
      **Why the new tests were mandatory:** `tests/` had **zero** references to
      `require_dashboard_admin_access`, and `conftest.py::test_user` is `role="admin"`, so every
      pre-existing access test short-circuits on the bypass and stays green under **any** audience
      including a wrong one. `test_administrator_who_is_neither_owner_nor_grantee_is_admitted` was
      observed failing (403) with the admin bypass temporarily removed, then the file was restored
      byte-for-byte.
    - >
      **The `docs/SPEC.md` version row is not in this commit** — `CQLT-0` owns the phase-08 row.
    - >
      **`docs/02-dashboards/dashboards-api.md` is 1014 lines**, already over the 1000-line hard split
      threshold in `doc-maintenance-rules.md` before this block; a split is out of this block's writable
      set and is recorded for the documentation owner.

failure_action: >
  Do not work around a red pin. Report the exact failure, the failing test id, and the full
  `failed / passed` counts against the `9 failed / 1401 passed` baseline. If the count reads 10 failed,
  the block has broken something — most likely an audience assertion that a non-admin caller now
  receives 403 where a shipped test expected 200. If it reads 8 failed, something this block claims to
  fix was already fixed and must be declared rather than absorbed.

