description: >
  Wire the shared dependency `api/deps.py::require_dashboard_admin_access` into the three handlers of
  `api/routes/dashboards_access.py` — grant, list, revoke dashboard access — by replacing each
  `current_user: CurrentUser` parameter with `current_user: UserRead = Depends(require_dashboard_admin_access)`,
  leaving all three handler bodies untouched, and reconcile every prose declaration of the audience in
  the same commit (module docstring, the three OpenAPI `description` strings, the grant handler
  docstring, `docs/02-dashboards/dashboards-api.md` §24–26, and the Access Management Endpoints table in
  `docs/08-security/access-control.md`). Add the route-level tests that prove the gate is live
  end-to-end, in the already-existing `tests/test_dashboards_access_api.py`.

goals:
  - Make the ruled audience executable at the one ruled enforcement point, with zero new enforcement sites
  - Land the gate BEFORE `CQLT-1` makes the grant write path a real setter (closes the escalation window)
  - Prove the gate is live with a test that fails if the admin bypass is removed — the suite is structurally blind to it today
  - Reconcile every audience declaration in code and both `docs/` files inside the same commit
  - Record the AZ-3 clause as satisfied vacuously, the 403-on-absent divergence as AZ-5's, and the list read/write tension as an open notice to DP-12-B/AZ-5
  - Leave the create path at zero code, recorded as covered by the same rule rather than exempted

# ── Rulings already decided. Implement exactly these. Do not re-derive, do not re-open. ──
extra_context:
  ruling_1_audience:
    id: D-08-4 (Product Owner, 2026-10-03, register cluster 1 via DP-12-A)
    ruled: >
      Owner **or** administrator on all four write surfaces, **plus an explicit rule that an
      administrator who is neither owner nor grantee may still manage access**. The fourth write
      surface is dashboard creation (`POST /dashboards/`), already admin-only and out of this block's
      code scope. **Never re-open the audience.**
    what_the_code_actually_enforces: >
      The gate admits a caller who holds an `admin`-level `dashboard_access` row on the target dashboard,
      **or** who holds the `admin` **role** (the bypass in `core/permissions.py::_check_access_with_session`).
      "Owner" enters only because `DashboardService.create_dashboard` writes an `ADMIN` grant to
      `owner_id`; the gate never reads `dashboards.created_by`. `DashboardRepository.create` (used by
      every existing test in this module) writes **no** grant, so a test that wants an owner admitted
      must write the grant explicitly. An implementor who assumes the gate reads `created_by` will
      write a wrong test.

  ruling_2_enforcement_point:
    id: C08-2 / D-08-4 collision resolution
    ruled: >
      The single enforcement point is the **shared dependency `api/deps.py::require_dashboard_admin_access`** —
      chosen because it names one point, settles the two-owner collision, and is the only option a new
      call site cannot bypass. **Plan 12 installs `AZ-3`; phase 08 co-signs and installs no second copy.**

  ruling_3_shape:
    id: "Block rulings from the Researcher evidence — CQLT-2 enforcement shape"
    ruled: >
      **RULED option A.** In each of the three handlers, **replace** `current_user: CurrentUser` with
      `current_user: UserRead = Depends(require_dashboard_admin_access)`. **Handler bodies unchanged.**
      Live in-repo precedent: `dashboards_filters.py::get_dashboard_filters_endpoint`, which *replaces*
      rather than combines. **Do NOT combine `Depends` with a separate `current_user` parameter** — the
      gate makes the whole owner-or-administrator decision, and a second identity parameter is a second
      thing to get wrong. The precedent the plan cited (`graphs.py`) does not exist: `graphs.py` has
      zero `require_dashboard_*` references.
    no_deps_py_edit: >
      **No edit to `api/deps.py`** (`C08-1` — the file is phase-04 co-owned). No new symbol, no new
      read-shaped dependency, no per-route or per-service check. The helper is a pure passthrough to
      `check_dashboard_access(..., required_permission="admin")` and needs nothing.

  ruling_4_no_404_branch:
    id: "Block rulings — CQLT-2 the 404 branch"
    ruled: >
      **No 404 branch in the dependency.** Adding one would be wrong. The 403/404 dual-signal does not
      exist on these three routes to be preserved: grant's `DASHBOARD_NOT_FOUND` branch is **unreachable**
      (`DashboardService.grant_access` raises `ValueError` for an absent dashboard, never returns
      `False`, so an absent dashboard renders **422**); list returns `200 []`; revoke's only 404 is a
      missing *access record*. The dual-signal is implemented on `GET /dashboards/{id}` alone. A probe
      would break `tests/test_dashboards_access_api.py::TestGrantDashboardAccessEndpoint::test_unknown_dashboard_still_returns_422`
      and pre-empt `AZ-5`.

  ruling_5_create_path:
    id: "Block rulings — CQLT-2 create path / VAL-08-005"
    ruled: >
      **Zero code.** `DashboardService.create_dashboard` already writes a `DashboardPermission.ADMIN`
      grant to `owner_id`, which is always an `AdminUser`, so the ruled rule holds over it **by
      construction**. Record it in the commit body as **covered by the same rule, not exempted**. Add
      no check and no test there — a check would be a second enforcement point, forbidden by `C08-2`.

  ruling_6_list_audience:
    id: "Block rulings — CQLT-2 list audience"
    ruled: >
      **Admin gate** on `GET …/access`, per the audience ruling, **with the read/write tension recorded
      as an open notice to `DP-12-B`/`AZ-5` and not resolved here**: `DP-12-A` counts four *write*
      surfaces and `GET …/access` is a read. `require_dashboard_read_access` is **not** an improvement —
      it admits any `view` grantee, and the ACL list *is* the membership map. Two of the three code
      declarations said admin and none said viewer. **Do not open a new read-shaped dependency.**

  ruling_7_ownership:
    id: C08-2 / DR-08-02
    ruled: >
      Plan 12 installs `AZ-3`; phase 08 **co-signs** and installs no second copy.

  dr_08_02_vacuous:
    id: DR-08-02 (Phase-0 ruling, option (a))
    ruled: >
      The `AZ-3` clause requiring the `require_dashboard_admin_access` / `check_dashboard_access`
      asymmetry to be "corrected or explicitly accounted for" **rests on an asymmetry that does not
      exist** — `_check_access_with_session` carries the admin bypass *before* the grant read, so an
      administrator who is neither owner nor grantee **is** granted. The clause is **satisfied
      vacuously**. No code change depends on it. The real divergence is the **absence of an existence
      probe** against `docs/SPEC.md`'s 403/404 dual-signal, and that is a live item owned by `AZ-5` —
      state it, do not invent a clause for it.

  verified_state_at_head:
    head: b95ba52
    worktree: "`git status --porcelain -- src tests docs` → empty. Re-verify before editing."
    route_module: >
      `src/mkobi/api/routes/dashboards_access.py`, 227 lines. `router = APIRouter(tags=["dashboards"])`.
      Imports today: `from mkobi.api.deps import (CurrentUser, get_db_dependency, get_dashboard_service)`.
      `CurrentUser` is referenced on exactly three lines — the three signatures — so replacing all
      three leaves the import unused and **ruff `F401` will fire**; the import must be edited.
      There is **no** `from mkobi.models.user import UserRead` in the module today.
    helper: >
      `src/mkobi/api/deps.py::require_dashboard_admin_access(dashboard_id, user=Depends(get_current_user_dependency), db=Depends(get_db_dependency)) -> UserRead`
      — a pure passthrough to `check_dashboard_access(..., required_permission="admin")` raising
      `AppException(code=ErrorCode.PERMISSION_DENIED, detail="You do not have admin access to this dashboard")`.
      `ErrorCode.PERMISSION_DENIED` maps to `HTTP_403_FORBIDDEN` in `src/mkobi/utils/exceptions.py`.
      **Zero production references** until this block lands.
    bypass: >
      `src/mkobi/core/permissions.py::_check_access_with_session` returns `True` for `UserRole.ADMIN`
      before reading any `dashboard_access` row. **Read-only for this block — no edit.**
    test_module: >
      `tests/test_dashboards_access_api.py` **already exists** (208 lines, 4 tests, class
      `TestGrantDashboardAccessEndpoint`). Both plans claimed no test module exists; that claim is
      refuted. It pins idempotent-200-on-duplicate (×2), path/body mismatch → 422, and
      **unknown dashboard → 422**. **Add the new tests here, not in a new module.**
    suite_blind_spot: >
      **`tests/` contains ZERO references to `require_dashboard_admin_access`** — nothing in the suite
      exercises the helper end-to-end today. Worse, the suite is **structurally blind to an audience
      mistake**: `tests/conftest.py::test_user` creates `role="admin"`, so every existing access test
      calls as an administrator whose bypass short-circuits before any grant is read. **All four
      existing tests stay green under any audience, including a wrong one.** Any new test that also
      calls through `authenticated_client` inherits the same blindness.
    dependency_override_reaches_the_gate: >
      `tests/conftest.py::async_client` replaces `get_db_dependency` in `app.dependency_overrides`,
      and FastAPI resolves overrides at **every** dependency level — so the gate's own `db` parameter
      receives the test session and reads **real rows**. A route-level test through `async_client`
      genuinely exercises the gate. Use plain `async_client` (or `authenticated_client` with the
      header overwritten) — **never** override or monkeypatch the dependency itself.
    second_session_is_mandatory: >
      `conftest.py` sets `expire_on_commit=False`, so a read-back on the test's own session is cached
      and **cannot** distinguish "the handler never wrote" from "it wrote and the session already
      knows". Every "row exists" / "no row was created" assertion **must** open a second session from
      `async_session_maker()`. That pattern already exists at
      `tests/test_dashboards_access_api.py:82-94`. Copy that shape; do not reason about why it works.
    impersonation_pattern: >
      `tests/test_resource_access_control.py` is the in-repo precedent: `UserRepository().create(...)`
      for the caller, `create_access_token({"user_id": str(u.id), "email": u.email})`, then
      `async_client.headers.update({"Authorization": f"Bearer {token}"})`. It uses
      `await async_db_session.flush()` (not `commit()`) after setup, because the same session is what
      the app sees through the override.
    wire_deltas_non_admin_callers_only:
      - "grant on an **absent** dashboard: `422` → `403` (the gate runs before the handler body)"
      - "list on an **absent** dashboard: `200 []` → `403`"
      - "path/body `dashboard_id` mismatch: `422` becomes **role-dependent** — admin still `422`, non-admin now `403`"
      - "revoke: `403` for a caller who is neither owner nor administrator; an admitted caller is unchanged (`200`, or `404` for an absent access record)"
      - "**Admin and owner callers see no change at all.**"
    oracles_closed: >
      The gate **closes** two live existence oracles rather than opening one: list used to
      distinguish an absent dashboard (`200 []`) from a present one (`200 [rows]`), and revoke used to
      distinguish a present grant (`200`) from an absent one (`404`). Say so in the commit body.

