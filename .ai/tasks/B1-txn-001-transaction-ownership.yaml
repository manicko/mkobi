acceptance_criteria:
  - UserService.create_user commits exactly once on success and the row is durable
  - UserService.update_user_role and update_user_active_status commit exactly once on success and
    not at all on the user-not-found path
  - UserService.delete_user still commits exactly once and did not gain a second commit
  - a unique-index IntegrityError on users.email returns 422 with code VALIDATION_ERROR, and a
    non-duplicate IntegrityError still returns 500
  - the create endpoint's declared status codes are unchanged and EMAIL_ALREADY_EXISTS is still unused
  - no 409 was added to admin_responses
  - all four endpoints have an independent-session re-read proving committed-not-flushed, with the
    original response-body assertions retained
  - a Redis fault during deactivation reports 500 whose detail and log name the committed
    deactivation and the failed revocation, and the rollback comment states what it cannot undo
  - AuthService is untouched and its four shipped tests are green
  - tests that commit rows clean them up; running the suite twice in one session raises no
    unique-index collision
  - .\Makefile.ps1 lint and .\Makefile.ps1 typecheck pass

# ── Out of scope ──────────────────────────────────────────────────────────────────────────────────

out_of_scope:
  - >
    api/routes/users.py::create_user_endpoint — no change at all. Its `except ValueError` mapping
    already produces the 422 D-1 requires, and its docstring's `AppException 409` line is a
    documentation defect D-1 explicitly defers to the documentation phase. Do not "fix" it here.
  - >
    api/routes/admin.py::update_user_role_admin_endpoint and api/routes/users.py::update_user_endpoint
    — no change. Neither pairs its write with a Redis effect, so RISK-1 does not reach them.
  - >
    ErrorCode.EMAIL_ALREADY_EXISTS and utils/exceptions.py::ConflictException — must stay unused.
    Introducing 409 is the outcome D-1 rejected.
  - >
    api/schemas/responses.py::admin_responses — unchanged. It declares 401/403/404/422/429/500 and
    no 409; adding one is out of proportion to a defect whose fix changes no status code.
  - >
    api/deps.py::get_current_user_dependency — unchanged. Its `is_active` check is read as the
    reason the preferred RISK-1 failure direction is acceptable; do not modify or refactor it.
  - >
    api/routes/auth.py::refresh and the two login routes — unchanged. Their not consulting
    `is_active` is coordination item C-7, phase 04's AUTH-004 zone, not B1's.
  - >
    services/auth_service.py — untouched in every respect, including AuthService.create_user, which
    is a same-named, disjoint method. The registration/approval flow and its four shipped tests
    depend on it.
  - >
    db/repositories/user_repo.py — unchanged. UserRepository.create and update keep
    `await db.flush()` + `await db.refresh()` and no commit. Replacing flush with commit would move
    the IntegrityError site past the service's classifier and reopen D-1's second bullet.
  - >
    db/session.py::get_db (AD-1) — unchanged. No production caller; noted, not removed.
  - >
    Completing the deprecation of PUT /users/{user_id}, and every other deprecation — out of scope.
    B1 only makes the surface verifiable.
  - >
    Any file under docs/. Per docs/00-overview/doc-maintenance-rules.md, and per the plan,
    docs/04-admin/admin-api.md, docs/08-security/error-format.md,
    docs/99-reference/error-handling-guide.md and docs/06-backend/architecture.md are the
    documentation phase's, and architecture.md's transaction-ownership statement is B10's by rule.
  - >
    The audit corpus — .ai/audit/** is not an implementation target.
  - >
    The last-admin guard (_check_admin_deletion_allowed) — no change. It counts committed admin rows
    and has been over-eager because promotions never persisted; after this task it becomes correctly
    permissive. That direction is expected, not a bug to fix here.
  - >
    tests/test_upload_api.py, tests/test_storage_manager.py, tests/test_data_worker.py —
    do not touch. Order-sensitive to DP-001 / DP-004 / B3, and B3's three
    `commit.assert_not_called()` assertions are a contract this task must not disturb.
  - >
    Retrying the Redis revocation, or adding any retry/backoff policy — speculative. No precedent in
    src/, and not supported by the specification.

# ── Implementation sequence ───────────────────────────────────────────────────────────────────────

sequence:
  - step: 1
    action: >
      Re-read git status. Confirm src/ and tests/ are clean and HEAD is b646ef1. All fourteen TXN-001
      anchors resolve; if any named symbol is missing, stop and report rather than substituting the
      nearest match.
  - step: 2
    action: >
      Write the ownership contract into IUserService first, before any behaviour changes. The contract
      is the deliverable that stops the next service repeating the ambiguity, and it makes each
      subsequent edit checkable against a stated rule.
  - step: 3
    action: >
      Add the IntegrityError classifier and the commit to UserService.create_user. Classifier first:
      it is the only edit that must be right about an aborted transaction, and it is easier to
      verify in isolation.
  - step: 4
    action: >
      Add the success-path commits to UserService.update_user_role and
      UserService.update_user_active_status. Leave UserService.delete_user's body untouched.
  - step: 5
    action: >
      Apply the RISK-1 changes to api/routes/admin.py::update_user_active_admin_endpoint: the
      separately-guarded revocation, the truthful detail and log, the rollback comment, the docstring.
  - step: 6
    action: >
      Update the docstrings of api/deps.py::get_db_dependency and db/session.py::get_session. No
      behaviour change in either file.
  - step: 7
    action: >
      Write tests/test_user_service.py — the mock-based commit-count contract tests. These are the
      cheapest signal in the task and they pin "exactly one" before anything touches a database.
  - step: 8
    action: >
      Strengthen tests/test_admin_user_management.py and tests/test_token_revocation.py with
      independent-session re-reads, and add the duplicate-email first-create assertion. Add the
      cleanup every one of those tests now needs.
  - step: 9
    action: >
      Add the race test (422, not 500) and its non-duplicate 500 counterpart.
  - step: 10
    action: >
      Add the AD-2 test for the deprecated PUT /users/{user_id} surface in tests/test_users_api.py.
  - step: 11
    action: >
      Run the targeted suites, then the full suite, then lint and typecheck. The full suite is not
      optional: because the production commit is durable in this harness, a row leaked by any B1
      test can break a file this task never touched.

# ── Architectural constraints ─────────────────────────────────────────────────────────────────────

constraints:
  - >
    Layering is API → Service → Repository. The commit belongs in the service (ruled). The
    IntegrityError classifier belongs in the service (ruled). No repository method may gain a commit,
    and no driver exception type may appear in an HTTP handler.
  - >
    Errors are raised only through AppException with an ErrorCode from models/enums.py. No
    HTTPException anywhere. No hardcoded error-code strings. VALIDATION_ERROR → 422 and
    INTERNAL_ERROR → 500 come from utils/exceptions.py's mapping table; do not bypass it.
  - >
    All fixed values and statuses use Enum or StrEnum from src/mkobi/models/enums.py, kept separately
    in the models. Do not introduce a bare literal set, a dict of codes, or a new enum for this task.
  - >
    No raw SQL via f-strings. No new SQL is written by this task at all.
  - >
    English only — comments, docstrings, log messages, error details and the new test names. No
    Russian anywhere.
  - >
    No print(). Use `logger = logging.getLogger(__name__)`; the module already has one. Pass format
    arguments to the logger rather than building the string with an f-string.
  - >
    No pandas. The data-processing constraint is unchanged by this task and is restated only so it is
    not violated by an import.
  - >
    Type hints on every public function and method touched, including the new test doubles.
  - >
    Keep `await db.flush()` + `await db.refresh()` in UserRepository.create and update. The repository
    must remain non-committing.
  - >
    Do not touch AuthService — not create_user, not approve_registration_request, not register_user.
  - >
    Small, focused changes. No refactoring of neighbouring code, no signature changes, no new
    abstractions, no extraction of helpers that are used once. Resist tidying the files you touch.
  - >
    Every comment and docstring must explain a non-obvious decision — why the classifier re-reads,
    why the rollback stays, why the ordering is deliberate — and must not restate the code.

# ── Verification ──────────────────────────────────────────────────────────────────────────────────

verification_steps:
  - test: .\\Makefile.ps1 test-select -k test_user_service -v
    why: the new commit-count contract tests
  - test: .\\Makefile.ps1 test-select -k test_admin_user_management -v
    why: independent-session re-reads, duplicate-email first-create assertion, the 422 race path
  - test: .\\Makefile.ps1 test-select -k test_token_revocation -v
    why: the new database-side assertion on deactivation
  - test: .\\Makefile.ps1 test-select -k test_users_api -v
    why: the AD-2 PUT surface, and the last-admin guard that must stay green
  - test: .\\Makefile.ps1 test-select -k test_auth_service -v
    why: >
      RISK-2 regression guard. AuthService is untouched; this proves the registration and approval
      flow and its shipped tests are unaffected.
  - test: .\\Makefile.ps1 test-select -k test_deps -v
    why: get_db_dependency's contract, unchanged
  - test: .\\Makefile.ps1 test-select -k test_permissions -v
    why: db/session.py::get_db's generator shape (AD-1), unchanged
  - test: .\\Makefile.ps1 test-select -k test_services_integration -v
    why: the registration flow end to end
  - test: .\\Makefile.ps1 test
    why: >
      Required, not optional. A production commit is durable in this harness, so a row leaked by any
      B1 test can break a file this task never touched. Only the full suite can show that.
  - smoke_check: .\\Makefile.ps1 lint
  - smoke_check: .\\Makefile.ps1 typecheck

notes:
  - >
    Tests run in Docker only — there is no test database on localhost. `uv run pytest` fails by
    design. If the test stack is not running, start it once with `.\Makefile.ps1 test-up`.
  - >
    `.\Makefile.ps1 test-select` forwards every argument after the target name to pytest verbatim.
    `ruff check --fix` handles import sorting (I001); `ruff format` does not, and the project's
    `format` target runs `ruff check --fix`, not `ruff format`.
  - >
    Rollout is one-way in one respect: rows that begin persisting do not un-persist. Reverting the
    code is a single commit, but interim user rows and role changes are the operator's to clean up
    by hand. Any account an operator believes is a viewer may become editor or admin.

