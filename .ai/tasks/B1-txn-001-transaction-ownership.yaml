  - path: src/mkobi/services/user_service.py

    targets:
      - type: class
        name: UserService
      - type: method
        name: create_user
      - type: method
        name: update_user_role
      - type: method
        name: update_user_active_status

    semantic_anchors:

      insert_after:
        type: await_expression
        value: self.user_repo.create

      insert_before:
        type: return_statement

    changes:
      - action: add_code
        description: >
          `UserService.create_user`: add the D-1 `IntegrityError` classifier around the
          `user_repo.create` call — `except IntegrityError`, `await db.rollback()`, re-read through
          `user_repo.get_by_email`, raise the existing duplicate-email `ValueError` when the row is
          present, `raise` unchanged when it is absent.
        code_hint: |
          try:
              user_obj = await self.user_repo.create(
                  db=db,
                  email=email,
                  password_hash=password_hash,
                  role=role,
              )
          except IntegrityError:
              # A unique-index conflict on users.email is only raised once the
              # competing transaction has committed, so the winner is visible here.
              await db.rollback()
              winner = await self.user_repo.get_by_email(email, db)
              if winner is not None:
                  raise ValueError(f"User with email '{email}' already exists") from None
              raise
      - action: add_code
        description: >
          `UserService.create_user`: `await db.commit()` on the success path, after the
          `user_obj is None` guard and before the success log, so the returned `UserRead` is
          constructed from a durable row.
      - action: add_code
        description: >
          `UserService.update_user_role` and `UserService.update_user_active_status`:
          `await db.commit()` inside the truthy `updated_user` branch only, immediately before the
          success log — the same shape as `UserService.delete_user`'s `if result:` guard. The
          `None` (user not found) path must not commit.
      - action: add_import
        description: >
          `from sqlalchemy.exc import IntegrityError`. `ruff check --fix` sorts it (I001).
      - action: update_docstring
        description: >
          State the durability on the three methods' `Returns:`/`Raises:` sections and point at
          `IUserService` for the ownership rule rather than restating it (single source of truth).

  - path: src/mkobi/interfaces/service_interfaces.py

    targets:
      - type: class
        name: IUserService
      - type: method
        name: create_user
      - type: method
        name: update_user_role
      - type: method
        name: update_user_active_status
      - type: method
        name: delete_user

    changes:
      - action: update_docstring
        description: >
          `IUserService` class docstring gains the transaction-ownership contract: **write methods own
          their unit of work.** On success a write method commits, so the write is durable when the
          method returns; on failure nothing is committed and the session is left usable. A method
          returning `None` because the entity does not exist commits nothing. Read methods never
          commit. Callers must not add a commit of their own and must not assume the session's
          teardown is a boundary.
      - action: update_docstring
        description: >
          Give `create_user`, `update_user_role`, `update_user_active_status` and `delete_user`
          individual docstrings naming their own durability, mirroring the phrasing already
          established by `IAuthService.approve_registration_request` ("...commits, and only then..."),
          which is this repository's own precedent for stating commit ownership in an interface.
          `create_user`'s docstring must also record that a duplicate email — whether caught by the
          pre-check or by the unique index — raises `ValueError` and therefore maps to 422.
      - action: no_change
        description: >
          No signature change. No new abstract method. `IAuthService` is untouched.

  - path: src/mkobi/api/routes/admin.py

    targets:
      - type: function
        name: update_user_active_admin_endpoint

    changes:
      - action: add_code
        description: >
          Guard the `revoke_all_user_tokens` call on its own `try` / `except Exception`, mapping a
          Redis fault to `AppException(code=ErrorCode.INTERNAL_ERROR)` whose `detail` and error log
          state that **the deactivation is committed and the token revocation failed**. Keep the
