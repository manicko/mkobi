id: task_b1_txn_001_transaction_ownership

title: >
  B1 / TXN-001 — Declare who ends a unit of work for the user write path, and make the
  four endpoints' writes durable

status: pending

priority: high

depends_on: []

source_reference: C:\py_dev\mkobi\.ai\plans\03-db-concurrency-remediation.md
source_section: B1 — Declare who ends a unit of work, then fix the four endpoints (TXN-001)
source_blocks:
  - "B1 — Declare who ends a unit of work, then fix the four endpoints (TXN-001)"
  - "B1 design ruling (Planner) — settled 2026-10-01"
  - "Tech Lead rulings — D-1"

description: >
  Four endpoints return HTTP success for a write that is never committed. `get_db_dependency` and
  `db/session.py::get_session` yield a session and close it; no middleware, no lifespan hook and no
  event handler ends the request's unit of work. `UserService.create_user`,
  `UserService.update_user_role` and `UserService.update_user_active_status` contain no `commit()`,
  and neither do their four call sites in `api/routes/users.py` and `api/routes/admin.py`. The fourth
  write method, `UserService.delete_user`, does commit — so the omission is three of four rather
  than a service-wide convention. The security-relevant half is
  `api/routes/admin.py::update_user_active_admin_endpoint`: it writes `is_active` through the service
  and then revokes the user's tokens in Redis, so the non-transactional effect persists while the
  transactional one is discarded.

  This task makes the seam explicit (commit inside the service, matching the `delete_user` and
  `AuthService.approve_registration_request` precedent), writes the ownership contract into
  `IUserService`, makes the residual unique-index race surface as 422 rather than 500, decides and
  documents the Redis-pairing failure direction, and strengthens the four endpoints' tests so they
  can tell a committed write from a flushed one.

goals:
  - make the three non-committing write methods durable on return
  - declare the unit-of-work ownership rule in IUserService so the next service is not ambiguous
  - map the residual users.email unique-index IntegrityError to the existing 422 path, not 500
  - decide and document which partial state the deactivation / Redis pairing accepts
  - prove durability with independent-session re-reads, not response-body assertions
  - leave EMAIL_ALREADY_EXISTS unused and every declared status code unchanged

extra_context: |
  ## The seam (settled — do not re-litigate)

  The Tech Lead ruled **Alternative A**: commit inside `UserService.create_user`,
  `UserService.update_user_role` and `UserService.update_user_active_status`. Alternative B (commit
  in the dependency) and Alternative C (commit at the routes) are rejected: B double-commits the
  transport-layer commits and changes what `tests/conftest.py` overrides wholesale; C repeats the
  transport-layer pattern the project is moving away from and leaves the services looking
  non-committing, which is what misled the audit.

  **Commit only on the success path**, exactly as `UserService.delete_user` does with its
  `if result:` guard. `update_user_role` and `update_user_active_status` return `None` when the user
  does not exist; that path must not commit. `UserService.delete_user` already commits and must
  **not** gain a second one.

  ## RISK-1 ruling — where the deactivation commit lands

  **The commit lands inside `UserService.update_user_active_status`, before the Redis revocation.**
  No commit placement makes a Redis round trip transactional; the question is only which partial
  state B1 accepts when the two halves disagree.

  **B1 prefers the "durable deactivation, failed revocation" failure.** Three reasons, in order of
  weight:

  1. **It is fail-closed on the axis that matters.**
     `api/deps.py::get_current_user_dependency` re-reads the user row from the database on *every*
     authenticated request and rejects `is_active is False`. A committed deactivation therefore stops
     the user at every protected endpoint independently of Redis. The reverse placement fails open:
     an account believed deactivated stays fully usable and merely has its current tokens revoked.
  2. **The reverse failure is silent; this one is reported.** With the commit after the revocation, a
     database fault leaves `is_active` unchanged, the user logs in again, and nothing in the response
     says the deactivation did not happen. With the commit first, a Redis fault is a 500 an operator
     sees and can retry, and the endpoint is idempotent — the retry re-commits the same `is_active`
     and re-issues the marker.
  3. **The residual exposure is bounded and enumerated.** The only paths that do not re-read
     `is_active` are `POST /auth/refresh` and the two login routes: `is_active` has **no comparison
     anywhere in `src/` outside `api/deps.py::get_current_user_dependency`** (zero occurrences in
     `services/auth_service.py`). A failed revocation therefore leaves the deactivated user able to
     obtain fresh *signed* tokens, each of which is then rejected at the gate.

  **Consequences that are in this task's scope.**

  - `api/routes/admin.py::update_user_active_admin_endpoint`'s `except Exception` handler calls
    `await db.rollback()`. After this task that rollback **can no longer undo the write**. Keep it —
    it is still correct for the pre-commit window, where a failure inside
    `update_user_active_status` before its commit leaves the session needing one — and add a comment
    stating exactly what it can and cannot undo. Do not leave it silently implying more than it does.
  - Guard the `revoke_all_user_tokens` call separately so a Redis fault is reported as what it is:
    the deactivation is committed, the revocation is not. Keep the status at **500** on the existing
    `ErrorCode.INTERNAL_ERROR` and make the `detail` and the error log say which half failed. Do not
    introduce a new `ErrorCode`, and do not add 409 to `admin_responses`.
  - The docstring of `update_user_active_admin_endpoint` must state the pairing: `is_active` is the
    authority for protected access; the Redis user-level marker is the authority for
    `POST /auth/refresh` and login. B1 makes that split load-bearing for the first time — before it,
    the database half never persisted, so the marker was the only thing holding. The
    `is_active`-authoritative check in `get_current_user_dependency` is the mitigation that makes the
    preferred failure direction acceptable; say so, so the ordering reads as deliberate.

  **Out of this task:** `POST /auth/refresh` never testing `is_active` is a new finding in phase 04's
  AUTH-004 zone, raised as coordination item **C-7**. It is unchanged by B1 and B1 does not fix it.

  ## D-1's second bullet is real work — the IntegrityError classifier

  Duplicate detection happens in exactly one place: the application-level `get_by_email` pre-check in
  `UserService.create_user`, which raises `ValueError`; `api/routes/users.py::create_user_endpoint`
  maps `ValueError` to `AppException(code=ErrorCode.VALIDATION_ERROR)`; `utils/exceptions.py` maps
  `VALIDATION_ERROR` to 422. There is **no** unique-index detection on that path, and **no
  `IntegrityError` handler and no `SQLAlchemyError` handler anywhere in `src/`**.

  The race's `IntegrityError` is raised by `await db.flush()` inside `UserRepository.create`, re-raised
  unchanged by that method's `except SQLAlchemyError`, passes through `UserService.create_user` (no
  try/except), misses the route's `except ValueError`, and lands in `except Exception` →
  `INTERNAL_ERROR` → **500**. Commit placement does not move the error site — `flush` fires before
  any commit — so the classifier must sit where the flush is visible.

  **Ruling: the service-level conversion, in `UserService.create_user`, around the `user_repo.create`
  call.** It converts the driver's error into the same `ValueError` the pre-check already raises, so
  the route's existing mapping yields 422 with **zero route change** and the create endpoint's error
  contract is provably identical. A route-level `except IntegrityError` is the larger diff, puts a
  driver exception type into the HTTP layer against the API → Service → Repository rule, and
  duplicates a message the service already owns.

  **Verify before classifying; do not guess.** On `IntegrityError`: roll back, then re-read through
  `user_repo.get_by_email`. A row with that email present *is* the duplicate-email race → raise the
  existing `ValueError` (422). Absent → `raise` unchanged (500). This is sound because a PostgreSQL
  unique-index conflict is only raised once the conflicting transaction has **committed** — otherwise
  the inserter blocks — so the winner's row is visible to the re-read. It is driver-agnostic,
  duplicates no constraint-name string, and needs no new enum.

  **The rollback is mandatory.** After a flush-time `IntegrityError` the transaction is aborted, so
  without a rollback the next statement on that session raises `PendingRollbackError`. In production
  the dependency's session teardown would absorb it; **in tests the session is the shared
  long-lived test session**, so the poisoning leaks into every later test in the session.

  ## Harness facts that change the test design (both verified, neither assumed)

  1. `tests/conftest.py::async_client` replaces `get_db_dependency` wholesale, so the request's
     session **is** the test's session. A re-read through it sees uncommitted data exactly as well
     as committed data and **proves nothing**. Every independent re-read must open a **second**
     session from the `async_session_maker` fixture the conftest already exposes.
  2. Verified against the installed SQLAlchemy 2.0.50: `Session.commit()` calls
     `trans.commit(_to_root=True)` and its own docstring states the outermost transaction "is
     committed unconditionally, automatically releasing any SAVEPOINTs in effect". The
     `async_db_session` fixture's SAVEPOINT therefore does **not** isolate a production commit — the
     fixture's teardown rollback cannot undo a row this task makes durable. **Every test that
     exercises the four endpoints must delete the rows it commits.** Existing hard-coded emails in
     `tests/test_admin_user_management.py` are mutually distinct, so no unique-index collision arises
     within one run, but do not add new hard-coded emails without a unique suffix or an explicit
     cleanup.

  ## Call-site census (exact — there is no fifth caller)

  | Method | Production callers |
  | ------ | ------------------ |
  | `UserService.create_user` | `api/routes/users.py::create_user_endpoint` |
  | `UserService.update_user_role` | `api/routes/users.py::update_user_endpoint` · `api/routes/admin.py::update_user_role_admin_endpoint` |
  | `UserService.update_user_active_status` | `api/routes/admin.py::update_user_active_admin_endpoint` |
  | `UserService.delete_user` | `api/routes/users.py::delete_me_endpoint` · `api/routes/users.py::delete_user_endpoint` · `api/routes/admin.py::delete_user_admin_endpoint` |

  `tests/` contains **no** `UserService` unit test, so no existing mock-based commit assertion on
  these three methods can break. `api/routes/admin.py::update_user_role_admin_endpoint` and
  `api/routes/users.py::update_user_endpoint` need **no** change: neither has a Redis pairing.

