      - action: update_comment
        description: >
          The existing `except Exception` handler's `await db.rollback()` stays — it is still correct
          for the pre-commit window — and gains a comment stating that it cannot undo a committed
          deactivation.
      - action: update_docstring
        description: >
          State the Redis pairing and which half is load-bearing: `is_active` is the authority for
          protected access via `api/deps.py::get_current_user_dependency`; the Redis user-level
          marker is the authority for `POST /auth/refresh` and login. Note that the ordering is
          deliberate and that the endpoint is idempotent, so retrying after a revocation failure
          completes the revocation.
      - action: no_change
        description: >
          `update_user_role_admin_endpoint`, `delete_user_admin_endpoint`,
          `reject_registration_request_admin_endpoint` and every other handler in this module are
          untouched. `reject_registration_request_admin_endpoint`'s own transport-layer commit is
          pre-existing and out of scope.

  - path: src/mkobi/api/deps.py

    targets:
      - type: function
        name: get_db_dependency

    changes:
      - action: update_docstring
        description: >
          Docstring only — no behaviour change. State that the dependency yields a session and closes
          it and **does not commit and does not roll back**; that the request's unit of work belongs
