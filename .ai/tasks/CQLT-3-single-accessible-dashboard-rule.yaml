# ── Tests: a new module, eight tests, three classes ──
tests:
  file: tests/test_accessible_dashboard_filter.py
  why_a_new_module: |
    `tests/test_layouts.py` is a named pin's file that currently carries the
    known-red assertion, and other phases are appending to `tests/` right now; a
    new module is isolated, reviewable, and mirrors `CQLT-2`'s precedent of one
    module per access surface. Do not add tests to `tests/test_layouts.py` or
    `tests/test_graphs.py`.
  isolation_contract: |
    Use `flush()`, never `commit()`. `tests/conftest.py::async_db_session` rolls
    back its SAVEPOINT, so a flush-only test leaves nothing behind; a `commit()`
    leaks rows into every later test. `tests/conftest.py::async_client` overrides
    `get_db_dependency` with that same session, so rows a test flushes are visible
    to the request it then issues. Authenticate the way
    `tests/test_resource_access_control.py` does — `create_access_token({"user_id":
    str(user.id), "email": user.email})` into
    `async_client.headers["Authorization"]` — never by logging in.

    Because the admin branch calls `get_all` / `get_all_layouts`, which return
    every row in the table including rows committed by other tests, the
    **admin tests assert superset** (`>=`), never equality. The non-admin tests
    may assert **exact equality**, because the caller's grant set is exactly the
    one dashboard the test granted and no leftover row can be on it.
  tests_to_write:
    - "TestAccessibleDashboardIdsDependency::test_admin_role_caller_yields_no_dashboard_filter"
    - "TestAccessibleDashboardIdsDependency::test_non_admin_caller_yields_the_dashboards_the_service_reports"
    - "TestGraphsListAccessScope::test_admin_role_caller_sees_every_graph"
    - "TestGraphsListAccessScope::test_non_admin_sees_only_graphs_on_granted_dashboards"
    - "TestGraphsListAccessScope::test_non_admin_without_grants_sees_empty_collection"
    - "TestLayoutsListAccessScope::test_admin_role_caller_sees_every_layout_including_unbound"
    - "TestLayoutsListAccessScope::test_non_admin_sees_only_layouts_bound_to_granted_dashboards"
    - "TestLayoutsListAccessScope::test_non_admin_without_grants_sees_empty_collection"
  per_test_contract:
    - name: TestAccessibleDashboardIdsDependency::test_admin_role_caller_yields_no_dashboard_filter
      setup: >
        Build a `UserRead` with `role=UserRole.ADMIN` and a dashboard service that
        would raise if called; call `get_accessible_dashboard_ids` directly.
      assert: "The result is `None` — the admin role short-circuits before any query."
      fails_if: "the bypass is removed (returns `[]` instead of `None`)"
    - name: TestAccessibleDashboardIdsDependency::test_non_admin_caller_yields_the_dashboards_the_service_reports
      setup: >
        A `UserRead` with `role=UserRole.EDITOR` and a stub dashboard service whose
        `get_user_dashboards` returns two `DashboardSummary`-shaped objects.
      assert: "The result is exactly those two ids, in order, and the service was called once with `user_role`."
    - name: TestGraphsListAccessScope::test_admin_role_caller_sees_every_graph
      setup: >
        An `admin` user with **no `dashboard_access` row at all**; two dashboards
        owned by another user, each with one graph created via
        `GraphRepository().create(db=..., name=..., type=GraphType.BAR, dashboard_id=...)`.
      assert: "`200`, and the returned ids are a superset of both created graph ids."
      why: >
        The bypass discriminator is the **absence of any grant row**. With the
        bypass removed, the resolved set is empty, `get_by_dashboard_ids([])`
        returns `[]` (it short-circuits on an empty list), and the assertion fails.
    - name: TestGraphsListAccessScope::test_non_admin_sees_only_graphs_on_granted_dashboards
      setup: >
        An `editor` user granted `DashboardPermission.VIEW` on dashboard A only;
        dashboard A and dashboard B each carry one graph.
      assert: >
        `200`, and the returned ids are **exactly** the graph on dashboard A —
        the graph on dashboard B is absent. This is the half that distinguishes
        "the bypass was dropped" from "the filter is too narrow".
    - name: TestGraphsListAccessScope::test_non_admin_without_grants_sees_empty_collection
      setup: "An `editor` user with no grants; two dashboards each carrying one graph."
      assert: "`200` with an empty JSON list — not 403, not 500."
    - name: TestLayoutsListAccessScope::test_admin_role_caller_sees_every_layout_including_unbound
      setup: >
        An `admin` user with **no grant row**; layout L1 created via
        `LayoutRepository().create(db=..., name=..., definition={"grid": []})` and
        **left unbound**, layout L2 bound to dashboard A by creating
        `DashboardRepository().create(db=..., name=..., created_by=..., layout_id=L2.id)`.
      assert: "`200`, and the returned ids are a superset of `{L1, L2}`."
      why: >
        L1 is the discriminating row. `get_layouts_by_dashboard_ids` joins
        `Dashboard`, so L1 is reachable **only** through `get_all_layouts`. If the
        admin branch is ever routed through the filtered call, this test fails
        even though the admin still sees L2.
    - name: TestLayoutsListAccessScope::test_non_admin_sees_only_layouts_bound_to_granted_dashboards
      setup: >
        An `editor` user granted `VIEW` on dashboard A only; dashboard A bound to
        layout L1, dashboard B bound to layout L2.
      assert: "`200`, and the returned ids are exactly `[L1]`."
    - name: TestLayoutsListAccessScope::test_non_admin_without_grants_sees_empty_collection
      setup: >
        An `editor` user with no grants; two dashboards, each bound to its own layout.
      assert: "`200` with an empty JSON list — not 403, not 500."
  assertion_discipline: >
    Assert the returned set and the status code. Assert the set by `id`, not by
    list index or ordering — neither call site promises an order. Do not assert
    on SQL, on which repository method ran, on log lines, or on the dependency's
    internals; the component interaction under test is "caller's role and grants
    in, correct collection out".
  pin_assertions_untouched: |
    `tests/test_layouts.py::TestLayoutsAPI::test_get_layouts_list` and every other
    named pin keep their assertions byte-for-byte.

# ── The mutation proof. Required; not optional; not prose. ──
mutation_proof:
  target: "src/mkobi/api/deps.py::get_accessible_dashboard_ids — the `UserRole.ADMIN` short-circuit"
  why_not_permissions_py: >
    `core/permissions.py::_check_access_with_session` is **not** the mutation
    target for this block, and the reason is the block's own design: a collection
    route never reaches that function, because the set-shaped filter does not call
    `check_dashboard_access`. Mutating it would leave both endpoints behaving
    identically — which is the evidence that the rule is no longer per-dashboard,
    but it produces **no test failure** and therefore no proof. Mutate the
    bypass that these two endpoints actually use.
  procedure:
    - "`uv run ruff check src/mkobi/api/deps.py` green, then `Get-FileHash src/mkobi/api/deps.py -Algorithm SHA256` and record the digest."
    - >
      Delete the `if user.role == UserRole.ADMIN:` short-circuit (its `logger.info`
      and `return None` go with it) from `get_accessible_dashboard_ids`. Change
      nothing else in the file.
    - >
      Run the three admin-visibility tests and **observe each one fail**:
      `TestGraphsListAccessScope::test_admin_role_caller_sees_every_graph`,
      `TestLayoutsListAccessScope::test_admin_role_caller_sees_every_layout_including_unbound`,
      `TestAccessibleDashboardIdsDependency::test_admin_role_caller_yields_no_dashboard_filter`.
      Expected shape: `200` with an empty list where rows were expected, and `[]`
      where `None` was expected. **Record the actual assertion text of each
      failure** — the commit body quotes it.
    - >
      Restore the deleted lines **byte-for-byte with the editor**. Do **not** use
      `git checkout`, `git restore`, `git reset` or `git stash` — all forbidden.
    - >
      Re-run `Get-FileHash src/mkobi/api/deps.py -Algorithm SHA256` and confirm the
      digest is **identical** to the one recorded before the mutation.
    - "`uv run ruff check src/mkobi/api/deps.py` green again, and the three tests pass again."
  forbidden_file_standing_proof: |
    `src/mkobi/core/permissions.py` is **not edited at all** by this block,
    including for the mutation. Prove it: `git diff --stat src/mkobi/core/permissions.py`
    returns **empty** at the end. Record that in the commit body.
  structural_proof_replaces_a_second_db_run: |
    `DR-08-14` rule 3 prefers structural evidence and the suite is single-tenant.
    Instead of a second mutation run against `_check_access_with_session`, record
    these free greps as the "exactly one implementation remains" evidence:
      - `Select-String -Path src/mkobi/api/routes/graphs.py,src/mkobi/api/routes/layouts.py -Pattern "UserRole"` returns **only** `layouts.py`'s five pre-existing role tests on the create / get-by-id / update / delete endpoints — **zero** in `get_graphs_endpoint` and **zero** in `get_layouts_endpoint`.
      - `Select-String -Path src/mkobi/api/routes/*.py -Pattern "AccessRepository"` returns **no hits**.
      - `Select-String -Path src/mkobi/api/routes/*.py -Pattern "get_user_dashboards"` returns **no hits**.
      - `Select-String -Path src/mkobi/api/routes/graphs.py,src/mkobi/api/routes/layouts.py -Pattern "get_accessible_dashboard_ids"` returns exactly two hits, one per file.

