# ── Risk ──
# R5 is the phase's sharpest silent-regression risk: the obvious change drops the
# admin bypass on two list endpoints with a green suite. status stays `pending`
# (not `blocked`): the shape decision below removes the need for research, and the
# mutation proof is this task's own obligation, not a prerequisite.
risk: MEDIUM — a security regression that is invisible to CI unless a test is added

description: >
  Delete the two inline copies of the accessible-dashboard rule in
  `api/routes/graphs.py::get_graphs_endpoint` and
  `api/routes/layouts.py::get_layouts_endpoint`, and route both through one
  shared, set-shaped filter that carries the admin bypass in the same commit.
  This discharges `QLT-008` in full, including the misleading comment in
  `graphs.py`. No wire change: response shapes, status codes and the two
  endpoints' differing admin code paths are preserved exactly.

goals:
  - >
    Exactly one implementation of the "which dashboards may this caller see"
    rule remains for these two endpoints, named in the commit body, with the
    admin bypass present in the same commit that deletes the inline code.
  - >
    Prove the admin bypass survives by mutation, not by prose: delete it once,
    observe the admin-visibility tests fail, restore the file byte-for-byte.
  - >
    Replace the rule rather than merely deleting it: a non-admin caller still
    sees only what it is granted, and a caller with no grant sees an empty
    collection rather than an error.
  - >
    Change no published contract. The OpenAPI document for both endpoints must
    be byte-identical before and after.

# ── Decisions resolved here. The Implementor makes none of these. ──
decisions_resolved_by_planner:
  - id: "1 — how a collection route consumes a path-parameter-shaped dependency"
    ruling: >
      Neither option (a) nor option (c); a **new set-shaped dependency in
      `api/deps.py`** that delegates to an already-existing service call.
      Concretely: `api/deps.py::get_accessible_dashboard_ids`, which resolves the
      filter and **returns `None` to mean "no filter applies"** (the admin
      bypass), or a `list[UUID]` of the dashboards the caller may see.
    why_this_shape: >
      `check_dashboard_access` and `require_dashboard_read_access` both answer a
      **per-dashboard** question — `require_dashboard_read_access` declares
      `dashboard_id: UUID` as a bare parameter, which FastAPI binds from the
      path, so on `GET /graphs/` or `GET /layouts` there is nothing to bind and
      the request would fail with **422**. That is the whole reason the two
      routes inlined the rule, and it is why the plan calls this block "not a
      straight substitution".

      The set-shaped home **already exists and already has a production caller**:
      `services/dashboard_service.py::DashboardService.get_user_dashboards(user_id,
      db, user_role)` is called by
      `api/routes/dashboards_crud.py::get_my_dashboards_endpoint` for
      `GET /dashboards/my`, and it delegates to
      `db/repositories/dashboard_repo.py::DashboardRepository.get_by_user(user_id,
      db, is_admin)`. Its non-admin branch is the **same query** as
      `AccessRepository.get_user_dashboards` — `Dashboard JOIN DashboardAccess
      WHERE DashboardAccess.user_id = :user_id` — verified by reading both, so
      the resolved set is identical for a non-admin and the rule is not being
      widened.

      Option (b) in its raw form — "resolve the accessible set once through a
      named service call and pass it in" — was rejected because the service
      returns a **flat list**, which does not distinguish "all dashboards" from
      "the ones I was granted". A route that called it directly would still have
      to test `current_user.role == UserRole.ADMIN` itself, so **the duplication
      would survive** and `QLT-008` would not be discharged. The dependency
      wraps the service call and turns the role test into a `None` sentinel, so
      the route contains **no role test at all** and only chooses a query
      strategy.

      No new *module*, no new *layer*, and **no new rule**: the sentinel is a
      one-line adapter over a call that already ships. This is why option (a)
      ("extend the dependency to accept a collection's resolved ids") is
      rejected — `require_dashboard_read_access`'s contract, docstring and three
      production callers (`dashboards_filters.py`, `dashboards_graphs.py`,
      `filter_values.py`) are all per-dashboard, and stretching it would fork
      the family rather than extend it.

      **Naming:** `get_` not `require_`, matching `get_dashboard_permissions`
      immediately below it. This dependency **filters**, it never refuses — no
      `AppException`, no 403 — so a `require_` prefix would misdescribe it.
  - id: "2 — how the admin bypass survives, per endpoint"
    ruling: >
      **It does not survive for free, and this is the block's central fact.**
      `core/permissions.py::_check_access_with_session` short-circuits for
      `UserRole.ADMIN` before reading any grant — but a collection route
      **never reaches that function**, because the set-shaped filter never calls
      `check_dashboard_access`. So the bypass must be **added deliberately**, and
      it lives in exactly one place: the `UserRole.ADMIN` short-circuit inside
      `deps.py::get_accessible_dashboard_ids`.

      Per endpoint:
      - `GET /graphs/` — `accessible_dashboards is None` ⇒ `graph_repo.get_all(db=db)`.
      - `GET /layouts` — `accessible_dashboards is None` ⇒ `layout_service.get_all_layouts(db=db)`.

      Neither route body contains a role comparison afterwards. That is what
      makes the bypass a property of the shared path rather than of each route,
      and it is why the mutation proof targets `deps.py` and **not**
      `core/permissions.py::_check_access_with_session` (see
      `mutation_proof`).
  - id: "3 — the two endpoints are not symmetric"
    ruling: >
      Preserve both behaviours exactly, including the admin path's different code
      route, because the difference is load-bearing and not cosmetic.
      `graph_repo.get_all(db=db)` (all graphs) on the admin branch;
      `layout_service.get_all_layouts(db=db)` on the admin branch; and
      `layout_service.get_layouts_by_dashboard_ids(dashboard_ids=..., db=db)` on
      the non-admin branch, **not** `get_all_layouts`.

      Proof that the layouts admin branch must stay `get_all_layouts`:
      `db/repositories/layout_repo.py::get_layouts_by_dashboard_ids` selects
      `Layout JOIN Dashboard ON Dashboard.layout_id == Layout.id`, so it returns
      **only layouts bound to a dashboard**, while `get_all` returns every
      layout. `db/models/dashboard.py::Dashboard.layout_id` is a **nullable**
      foreign key (`ondelete="SET NULL"`), so unbound layouts exist and are
      visible to an admin and to nobody else. `tests/test_layouts.py::TestLayoutsAPI::test_get_layouts_list`
      creates an **unbound** layout and asserts `len(data) >= 1` — that named pin
      fails if the admin branch is routed through `get_layouts_by_dashboard_ids`.

      By contrast `db/models/graphs.py::Graph.dashboard_id` is `NOT NULL` with
      `ondelete="CASCADE"`, so `get_all` and `get_by_dashboard_ids(all ids)` are
      equivalent for graphs. That equivalence is **not** relied upon: the admin
      branch calls `get_all` on both endpoints, unchanged.
  - id: "4 — the fate of the `graphs.py` comment"
    ruling: >
      **DELETE** `# Admin bypass is handled inside check_dashboard_access`,
      together with the block it misnames, in the same commit.

      It does **not** stay. The comment would only become true if the route
      called `check_dashboard_access`, and `get_graphs_endpoint` does not call it
      and will not: the comment names a call that does not exist in that
      function's body, which is exactly the defect `QLT-008` was filed for ("a
      reader who trusts it concludes the admin bypass is centralised"). Leaving
      it, or "fixing" it into a reference to `get_accessible_dashboard_ids`,
      would leave a comment in a route body pointing at a dependency the route
      body no longer reasons about. The new fact is documented once, in the
      dependency's docstring, where the rule now lives.
  - id: "5 — the unused imports"
    ruling: >
      Two removals, and the brief names only one of them:
      - `layouts.py`: delete the **module-level**
        `from mkobi.db.repositories.access_repo import AccessRepository`
        (line 28). `UserRole` **stays** in `layouts.py` — it is still used at the
        create, get-by-id, update and delete endpoints.
      - `graphs.py`: delete the **in-body**
        `from mkobi.db.repositories.access_repo import AccessRepository` with the
        block, **and** remove `UserRole` from
        `from mkobi.models.enums import DashboardPermission, ErrorCode, UserRole`.
        `UserRole` has exactly two occurrences in `graphs.py` — the import and the
        role test being deleted — so `ruff` `F401` fires if it is left. This is
        an addition to the brief, found by re-reading the file.
      - `graphs.py` keeps `check_dashboard_access` (four other call sites) and
        `check_dashboard_access` stays in `deps.py::__all__`.
      - `deps.py`: add `"get_accessible_dashboard_ids"` to `__all__`, next to
        `"get_dashboard_permissions"`. Do **not** add the three
        `require_dashboard_*` names that are missing from `__all__` today —
        out of scope, recorded below for `CQLT-4`.
  - id: "6 — `O-14` confirmed"
    ruling: >
      `Select-String src/mkobi/api/routes/*.py -Pattern "AccessRepository\(\)"`
      returns exactly two hits — `graphs.py:192` and `layouts.py:158` — both this
      block's anchors. There is no third in-body `AccessRepository()`
      construction in the route layer. Nothing else to do for `O-14`.

