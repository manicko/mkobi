  conventions: '`{type}({scope}): {description}`, lowercase imperative, no trailing period. One commit.'
  body_must_state:
    - >
      **The ordering obligation:** the inline duplicate is deleted in the same
      commit that adds the shared call, and the admin bypass is present in that
      commit — named as `api/deps.py::get_accessible_dashboard_ids`.
    - >
