      bypass was removed, quoting the actual assertion text of each, and that
      `src/mkobi/api/deps.py` was restored byte-for-byte (SHA-256 before and after
      identical). Also that `src/mkobi/core/permissions.py` was not edited at all
      and `git diff --stat` on it is empty, and why
      `_check_access_with_session` was not the mutation target.
    - >
      **How the bypass survives, per endpoint:** `accessible_dashboards is None`
      ⇒ `graph_repo.get_all(db=db)` on `GET /graphs/`, and
      ⇒ `layout_service.get_all_layouts(db=db)` on `GET /layouts`; that the
      `UserRole.ADMIN` test lives only in the dependency, so neither route body
      contains one.
