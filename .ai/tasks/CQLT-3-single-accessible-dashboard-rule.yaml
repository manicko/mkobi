      dashboard, which `tests/test_layouts.py::TestLayoutsAPI::test_get_layouts_list`
      depends on).
    - >
      **The fate of the `graphs.py` comment** — deleted, not rewritten, because
      `get_graphs_endpoint` does not call `check_dashboard_access` and the comment
      named a call that was never there — **and of `layouts.py`'s module-level
