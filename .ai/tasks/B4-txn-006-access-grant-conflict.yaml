constraints:
  architecture:
    - >-
      API → Service → Repository holds absolutely. This block edits the repository only; the
      service and the route are unchanged. **A driver exception type must never appear in an
      HTTP handler** — and under B4-IDEM none is needed, so none is added.
    - >-
      The persistence layer never raises `AppException`: no module under
      `src/mkobi/db/repositories/` imports it, and this block does not start one.
      `AppException` + `ErrorCode` remain the only error-raising mechanism, and this block
      adds no `ErrorCode` and no raised error.
    - >-
      The repository's role is to make the write conflict-tolerant. It does not classify
      HTTP outcomes, does not know about status codes, and does not decide what a duplicate
      means to a client. That decision was made once, in the contract, and it lives in the
      documentation.
    - >-
      `grant_access` keeps exactly one responsibility and one return type. Do not add a
      helper that decides policy, and do not widen the method to update `permission`.
  correctness:
    - >-
      `index_elements=["user_id", "dashboard_id"]` is **required**. A bare
      `on_conflict_do_nothing()` would absorb a foreign-key violation or an enum rejection
      and report it as a successful no-op.
    - >-
      No f-string, no `%`, no concatenation into SQL text anywhere in the block's diff.
    - >-
      The leading SELECT is an optimisation, never the correctness mechanism. If you find
      yourself relying on it, the fix is in the wrong place.
    - >-
      A re-grant must return the **existing** row and must write **nothing**. Do not
      introduce `on_conflict_do_update` — that is phase 08's `QLT-001` remedy and it would
      silently begin applying downgrades.
    - >-
      Two sessions, one coroutine, deterministic ordering. Never
      `asyncio.create_task` / `asyncio.gather` against the engine.
    - >-
      Any `lock_timeout` used in a test is applied with
      `set_config('lock_timeout', :value, true)` — never a bare `SET`, which survives
      `COMMIT` on the pooled connection (B2's verified finding) — and the assertion runs on
      the session that could have leaked, because `NullPool` makes a fresh-session check
      vacuous.
    - >-
      Every new test that creates rows cleans them up. On this harness a production
      `commit()` is durable and the fixture's SAVEPOINT rollback cannot undo it.
  process:
    - "English only — docstrings, comments and log messages."
    - "No `print()`; use `logger = logging.getLogger(__name__)`."
    - "No pandas. Polars only, and this block touches no data processing."
    - "Type hints on the new helper and on every new test signature, including the `-> None` returns."
    - >-
      Comments only where non-obvious: why the fast path is not the correctness mechanism,
      why the re-read is guaranteed to find the row, why `index_elements` names the two
      columns. No narration of what the next line does.
    - "Run `.\\Makefile.ps1 format` before committing — it runs `ruff check --fix`, which is what sorts imports."
    - >-
      Keep the two new test modules separate: repository/race behaviour in
      `test_access_grant_conflict.py`, HTTP contract in `test_dashboards_access_api.py`.
      Do not merge them, and do not add grant cases to `tests/test_dashboard_access.py`
      (it pins the cascade and must stay unmodified).

