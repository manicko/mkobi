id: task_b4_txn_006_access_grant_conflict

title: >
  B4 / TXN-006 — Make a duplicate access grant the repository's own no-op (idempotent 200)

status: pending
priority: medium
depends_on: []

source_reference: C:\py_dev\mkobi\.ai\plans\03-db-concurrency-remediation.md
source_section: B4 — Make a duplicate access grant the repository's own no-op (TXN-006)
source_blocks:
  - "B4 — Make a duplicate access grant the repository's own no-op (TXN-006)"

description: >
  `dashboard_access` carries a composite primary key on `(user_id, dashboard_id)`.
  `AccessRepository.grant_access` reaches it by read-then-insert and defines a no-op
  branch ("Access already exists") for the case it can *see*. Two simultaneous grants
  both observe nothing, both insert, and the loser receives the driver's unique-violation
  error — which the repository's `except SQLAlchemyError` re-raises and the route's
  terminal handler maps to **500**, for an intent the repository itself treats as a
  no-op, with the data correct afterwards.


  This block makes the **write** the conflict-tolerant thing — `pg_insert(...).
  on_conflict_do_nothing(index_elements=["user_id", "dashboard_id"])`, the form
  `docs/SPEC.md` already names as the project's own answer to this class — and it fixes
  the contract the endpoint promises for a duplicate: **200 with the same body as the
  first grant**, not 409.


  Scope is one repository method, one interface docstring, one documentation row, and two
  new test modules. The route's handler chain is **not edited** — see
  `extra_context` → "B4-IDEM".

goals:
  - >-
    Close the TOCTOU window in `AccessRepository.grant_access`: correctness must no longer
    depend on the leading SELECT seeing the other writer's row. The insert absorbs the
    primary-key conflict itself.
  - >-
    Deliver **one** reportable outcome for a duplicate grant — 200 with the success body —
    and make the racing duplicate and the sequential duplicate the *same code path*, not
    two statuses for one conceptual condition.
  - >-
    Preserve the repository's defined no-op branch verbatim: a re-grant still returns the
    **existing** row unchanged, and still writes nothing. (Making a re-grant write is phase
    08's `QLT-001`, and this block must not pre-empt it.)
  - >-
    Prove the race deterministically through the repository with **two sessions from the
    session-maker fixture**, never over HTTP and never by racing two coroutines.
  - >-
    Introduce **no** new error taxonomy: no new `ErrorCode`, no status-mapping change, no
    `IntegrityError` clause in any HTTP handler, no change to the published OpenAPI
    operation.

extra_context: |
  ## B4-IDEM — the idempotency contract, RULED (Planner, 2026-10-01)

  **Ruling: a duplicate grant is answered with `200` and the same body as the first
  grant. Not 409.** `ErrorCode.DUPLICATE_RESOURCE` is *not* used on this path, the
  route's handler chain is *not* changed, and `DashboardService.grant_access`'s `-> bool`
  is *not* changed.

  ### Reason, in order of weight

  1. **It preserves the sequential outcome and changes only the racing one.** Today the
     *non-racing* duplicate already answers 200 with the success body: the repository's
     no-op branch returns the existing row, the service returns `True`, the route returns
     `{"message": "Access granted", …}`. If 409 were chosen, the **same** logical outcome
     would be 200 when the first grant committed before the second request arrived and 409
     when the two overlapped — **one conceptual condition, two statuses, decided by
     whether you won a race.** The Tech Lead's ruling **D-1** (B1) rejected exactly that
     shape as the worst of its three options ("Most backward-compatible, most complex, and
     two different statuses for one conceptual condition"). Applying a different rule to
     the sibling finding in the same phase would be incoherent.

  2. **`on_conflict_do_nothing` makes the distinction nonexistent in code.** After the
     change the racing duplicate and the sequential duplicate traverse the *same statement*
     and converge on the *same* return. A 409 could only be produced by re-introducing a
     read that asks "did I lose?" — which is the TOCTOU read this block removes. **Choosing
     409 therefore requires adding back the very mechanism the finding is about.** That is
     decisive on its own.

  3. **The desired end state is "a grant exists for this pair"; absorbing the duplicate
     loses nothing.** The report's own consequence is that "a client that retries on 5xx
     will hammer a request whose precondition is already satisfied." 409 replaces the 500
     with a better-labelled error and keeps both the retry amplification and the
     success-reported-as-failure.

  4. **The repository has already ruled.** `grant_access`'s no-op branch logs "Access
     already exists" and returns the row — the code treats this condition as a no-op, not
     as a conflict. `docs/SPEC.md`'s "atomic UPSERT … eliminating the TOCTOU race
     condition" is the project's own statement of the same idea.

  ### Compatibility consequence

  - **Wire.** A duplicate grant moves from **500** (undocumented — absent from the endpoint's
    error table) to **200** (documented). No published status code is removed.
    `responses=admin_responses` gains nothing, so the published OpenAPI operation is
    byte-identical and `tests/test_openapi.py::TestOpenAPIErrorSchemas` is untouched.
  - **Documentation.** `docs/02-dashboards/dashboards-api.md` §"24. Grant Dashboard Access"
    gains **one row** stating the duplicate outcome. Its table currently lists only 403,
    404 and 422 — that absence is the gap the plan named. No row is removed or rewritten.
  - **Clients.** The only frontend reference to this endpoint is
    `frontend/src/features/admin/api/adminApi.ts::grantDashboardAccess` — an exported but
    **uncalled** function typed `Promise<void>` with no conflict handling. There is no
    shipped client to break. Under 409, whoever wires it up would turn a harmless
    double-click into an error; under 200 it cannot. **No frontend change in either case.**
  - **Interface.** `IAccessRepository.grant_access` still declares what the implementation
    returns, so **no signature change** — only a docstring contract is added. This honours
    phase-08's `C08-11` constraint ("Do **not** change `IAccessRepository`'s contract so
    that it stops describing what the implementation returns").
  - **Service.** `DashboardService.grant_access` keeps `-> bool` and its unconditional
    `True`. It keeps discarding the repository's return value, because under this contract
    nothing at the HTTP boundary needs the difference. The report's observation — "the
    service discards the returned object and cannot report the difference" — **stops being
    a defect**, not because the service learned to report it but because the contract no
    longer asks it to. Say this in the commit body.

  ## Does `grant_access` need B1's service-layer classifier? — No, and that is the ruling

  B1's shape was verify-then-classify in `UserService.create_user`: the conflict target
  there was a unique index on a column the caller supplies, and telling "duplicate email"
  apart from every other `IntegrityError` needed a `get_by_email` re-read. **Here the
  conflict target *is* the primary key that defines the row**, so
  `on_conflict_do_nothing(index_elements=["user_id", "dashboard_id"])` absorbs it with no
  residue and there is nothing to verify. A classifier would be dead code.

  **No `IntegrityError` clause is added anywhere — including the route.** Adding one would:

  - be dead for this race (the database absorbs it);
  - put a **driver exception type in an HTTP handler**, which B1's ruling forbids;
  - silently reclassify two defects that are **not** this block's: the `permission`
    column's native-enum rejection (phase 08's `VAL-08-008`, a 500 today) and the
    `user_id`/`dashboard_id` foreign-key violation (today a 500). Both keep their current
    behaviour and stay theirs.

  The repository's existing `except SQLAlchemyError: … raise` stays exactly as it is.

  ## Corrections to the plan's B4 section (recorded so they are not repeated)

  - **The plan says `data/storage/manager.py` "already uses `on_conflict_do_nothing`".
    It does not.** `StorageManager.upsert_aggregate` and `StorageManager._bulk_upsert` use
    `on_conflict_do_update`. The **only** `on_conflict_do_nothing` in `src/` is
    `db/seeders/test_media_dash.py::ensure_test_media_dash` (two `Graph` inserts and the
    filter-binding insert). So the in-repo idiom to match for this block is
    **the seeder's**, plus `manager.py`'s `on_conflict_do_update` for statement shape.
    Do not copy the seeder's **bare** `on_conflict_do_nothing()` (used for the filter
    bindings) — see the `index_elements` constraint below.
  - **`docs/SPEC.md` gets no version row.** B2's and B3's rulings both declined one and the
    phase close records a single row for the whole phase. This overrides the block
    section's mention of one.

  ## Anchor census (read before editing; resolve by symbol, never by a number)

  - `AccessRepository.grant_access` — a leading `select(DashboardAccess).where(user_id ==
    …, dashboard_id == …)`, `scalar_one_or_none()`, a `if existing:` branch that logs
    `logger.warning("Access already exists: user_id=%s, dashboard_id=%s")` and returns
    `cast(DashboardAccess | None, existing)`, then `DashboardAccess(user_id=…,
    dashboard_id=…, permission=permission)` + `db.add` + `flush` + `refresh` +
    `logger.info("Access granted: …")`, all wrapped in `try/except SQLAlchemyError` that
    logs and re-raises.
  - `IAccessRepository.grant_access` — declared `(db, user_id, dashboard_id, permission:
    str = "view") -> Any | None` with the one-line docstring "Grant user access to
    dashboard." Signature order differs from the implementation's; that asymmetry is
    pre-existing and **not** this block's to change.
  - `DashboardService.grant_access` — returns `bool`, calls `self.access_repo.grant_access`
    **discarding the result**, then `await db.commit()`, then returns `True`.
    `DashboardService._create_dashboard_with_session`'s owner-grant is the **second**
    production caller and also discards the result (phase 08's `VAL-08-005` correction —
    do not assume one caller).
  - `grant_dashboard_access_endpoint`'s chain is `except ValueError` → `VALIDATION_ERROR`
    (422), `except AppException: raise`, `except Exception` → `INTERNAL_ERROR` (500), plus
    an `if result:` / `else: raise AppException(DASHBOARD_NOT_FOUND)` where `result` is the
    **service's** bool and the `else` is unreachable. **Read-only for this block.**
  - `DashboardAccess.__table_args__` declares
    `PrimaryKeyConstraint("user_id", "dashboard_id", name="dashboard_access_pkey")`. That is
    the anchor, not the target — **do not edit `db/models/access.py`.**
  - The harness, from `tests/conftest.py`: `async_test_engine` is built on **`NullPool`**;
    `async_session_maker` is **session-scoped** and `expire_on_commit=False`;
    `async_db_session` is SAVEPOINT-based (`begin_nested`); `async_client` overrides
    `get_db_dependency` wholesale, so **the request's session *is* the test's session**;
    `authenticated_client` = `async_client` + `auth_headers` from `test_user`, which is an
    **admin** whose row is already committed.
  - **No route-level test exists for `POST /dashboards/{dashboard_id}/access`** — confirmed
    by search across `tests/`. The Implementor writes the first one. The only test callers
    of the repository method are `tests/test_repositories.py::TestAccessRepository` and
    `tests/test_dashboard_access.py::TestDashboardAccessCascadeDelete`, both on **fresh**
    rows, so neither touches the branch being changed — both must stay green **unmodified**.
  - **Durability trap (from B1's ruling, restated because these tests hit it).**
    `DashboardService.grant_access` calls `await db.commit()`. On this harness
    `Session.commit()` commits to the root and releases the SAVEPOINT, so
    `async_db_session`'s teardown rollback **cannot** undo a row the route persisted.
    **Every new HTTP-level test must delete what it created** — the grant row, the second
    user and the dashboard — in a `finally`. Do not add a hard-coded email; use a
    `uuid4()`-derived one, following `tests/test_dashboard_access.py`.

files:
  - path: src/mkobi/db/repositories/access_repo.py
    change: modify
    targets:
      - type: class
        name: AccessRepository
      - type: method
        name: grant_access
    semantic_anchors:
      - "module imports — add `insert as pg_insert` from `sqlalchemy.dialects.postgresql`"
      - "module-private helper `_conflict_tolerant_access_insert(user_id, dashboard_id, permission)` — new"
      - "AccessRepository.grant_access — the leading select, the `if existing:` no-op branch, the insert, the convergence re-read, the `except SQLAlchemyError` re-raise"
    instructions: |
      **Only production file this block changes.**

      Add a module-private statement builder, so the test drives the *production* SQL
      rather than a copy of it:

          def _conflict_tolerant_access_insert(
              user_id: UUID, dashboard_id: UUID, permission: str
          ) -> Insert:
              """Build the conflict-tolerant INSERT for one dashboard_access row.

              The composite primary key on (user_id, dashboard_id) is what enforces
              "one grant per pair"; naming those two columns in index_elements means the
              conflict action applies to *that* constraint only, so any other integrity
              violation still raises instead of being silently absorbed.
              """
              return (
                  pg_insert(access_model.DashboardAccess)
                  .values(
                      user_id=user_id,
                      dashboard_id=dashboard_id,
                      permission=permission,
                  )
                  .on_conflict_do_nothing(index_elements=["user_id", "dashboard_id"])
                  .returning(
                      access_model.DashboardAccess.user_id,
                      access_model.DashboardAccess.dashboard_id,
                      access_model.DashboardAccess.permission,
                  )
              )

      Constraints on this helper:
      - **`index_elements` is required.** Do not call the bare `on_conflict_do_nothing()`
        the seeder uses for its filter bindings — that swallows *every* conflict, and a
        foreign-key violation would then look like a successful no-op.
      - **No f-string, no `%`, no concatenation into SQL text.** The constraint names and
        the column names are SQLAlchemy constructs or literal identifiers, never
        interpolated values.
      - `permission` is passed through **unchanged**. `DashboardPermission` is a `StrEnum`
        and the column is `Enum(DashboardPermission, …, values_callable=…)`, so the `str`
        the service supplies and an enum member are interchangeable at this boundary. Do
        not add a conversion or a validation step here — that is phase 08's.
      - Return type annotated; the statement builder is a pure function with no I/O.

      Then rewrite `grant_access`'s body to this three-step shape:

      1. **Keep the leading SELECT fast path verbatim.** The `select(…)` /
         `scalar_one_or_none()` / `if existing:` / `logger.warning("Access already exists:
         user_id=%s, dashboard_id=%s", …)` / `return cast(…, existing)` sequence stays
         exactly as it is. It is the repository's defined no-op, phase 08's `QLT-001`
         depends on it returning the existing row **unchanged**, and the plan requires
         confirming the branch still exists. It is now a *fast path only* — correctness no
         longer depends on it, which is the whole point.
      2. **Execute the conflict-tolerant insert.** `result = await db.execute(
         _conflict_tolerant_access_insert(user_id, dashboard_id, permission))`. Then
         `inserted = result.first()`.
      3. **Converge on one return.** If `inserted` is not `None`, this call created the row
         and keeps today's `logger.info("Access granted: user_id=%s, dashboard_id=%s,
         permission=%s", …)`. If `inserted` is `None`, the conflict was absorbed and the
         call is a no-op: log the **same** `logger.warning("Access already exists: …")` the
         fast path uses — same message, same severity, so one log line identifies the
         condition wherever it is reached from. Then, **on both branches**, re-read the row
         by the `(user_id, dashboard_id)` pair with the existing select pattern and return
         that `DashboardAccess`.

      Comments that must be present (each is non-obvious and a reader will otherwise
      "simplify" the code back to the defect):
      - On the fast path: it is an optimisation, not the correctness mechanism — a
        concurrent winner's uncommitted row is invisible to this SELECT, which is exactly
        the window that produced the 500.
      - On the no-row branch: **why the re-read is guaranteed to find the row.** PostgreSQL
        runs the conflict action only once the conflicting transaction has ended. Had the
        winner rolled back, our INSERT proceeds and `RETURNING` yields a row — so reaching
        the no-row branch means the winner **committed**, and under READ COMMITTED the next
        statement takes a fresh snapshot and sees it. (This is the same soundness argument
        B1's classifier rests on, and it is why no rollback/re-read dance is needed here.)
      - On the re-read: it is what makes both branches return the **same type** — a
        `DashboardAccess` — so the method's contract is one return, not two.

      `db.add` / `db.flush` / `db.refresh` are **removed** from this method: the row is
      created by the Core insert, so there is nothing in the identity map to refresh. Keep
      the `try/except SQLAlchemyError: logger.error(…); raise` wrapper exactly as it is —
      it is the repository's error discipline and B4 changes nothing about it. No
      `AppException` import: **no repository in `src/mkobi/db/repositories/` raises
      `AppException`**, and this block must not start one.

      The re-read cannot find nothing: in the inserted case it is our own row, in the
      absorbed case the winner's committed row. If it ever did, `logger.error` with both
      ids and return `None` — the value `IAccessRepository` already declares and the value
      no caller reads (`DashboardService.grant_access` and
      `DashboardService._create_dashboard_with_session` both discard it). **Do not invent a
      new exception type or an error path for this branch.**

      `grant_access`'s docstring `Returns:` section is updated to state the contract: a
      `DashboardAccess` representing the desired state, whether or not this call inserted
      it; a re-grant writes nothing and returns the existing row unchanged. English only.

