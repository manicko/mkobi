  - path: tests/test_access_grant_conflict.py
    change: new
    targets:
      - type: class
        name: TestGrantTwiceIsANoOp
      - type: class
        name: TestGrantAcrossTwoSessions
      - type: class
        name: TestNoOpBranchContract
    instructions: |
      New module for the repository-level contract and the race. Follow the naming
      precedent of `tests/test_advisory_lock.py` and `tests/test_db_pool.py`.

      **Harness rules, non-negotiable:**
      - Two sessions come from the session-scoped `async_session_maker` fixture, opened
        directly. `async_db_session` is SAVEPOINT-based and is **not** suitable for a
        two-session test.
      - **Never race two coroutines through SQLAlchemy's greenlet bridge.** `asyncio.
        create_task` plus a concurrent `execute` hangs; B2's research had to kill the probe
        at 180 s. The holder/second-session pattern is the only permitted shape.
      - `async_test_engine` is `NullPool`, so a second session is a genuinely separate
        connection — which is exactly what these tests need.

      `TestGrantTwiceIsANoOp` — single session, no concurrency:
      - grant a pair with `DashboardPermission.VIEW`, commit, grant the same pair again with
        `DashboardPermission.ADMIN`;
      - assert no exception, the returned object is a `DashboardAccess`, `user_id` and
        `dashboard_id` match, and **`permission == DashboardPermission.VIEW`** — *not*
        `ADMIN`. This assertion is the no-op contract and the guard against anyone quietly
        turning this into `on_conflict_do_update`;
      - re-read from an **independent session** (`async_session_maker`) and assert exactly
        **one** row for the pair with the stored permission still `VIEW`.

      `TestGrantAcrossTwoSessions` — the race, forced deterministically, three tests:
      - **`test_winning_insert_is_absorbed_by_the_loser`.** Session A opens a transaction
        and executes the production statement from
        `access_repo._conflict_tolerant_access_insert` **without committing**. Session B
        executes the **same production statement** with a bounded `lock_timeout`
        (`select_config('lock_timeout', …, true)` in the transaction — the B2 precedent:
        a bare `SET` leaks onto the pooled connection and must not be used, and the
        assertion must run on the session that could have leaked). Assert B raises
        `DBAPIError` with `.orig.sqlstate == "55P03"` and, explicitly, that it is **not** an
        `IntegrityError` and **not** `"23505"`. Then A commits and B (after its rollback)
        re-reads and sees the row. The bound is what keeps the test sub-second and makes
        the loser *wait* rather than error. Comment must record that against the pre-fix
        `db.add` + ORM insert this statement raises `IntegrityError`/`23505` after the
        same wait, which is the defect.
      - **`test_loser_returns_the_winners_row_through_the_production_method`** — the
        sequenced, fully deterministic race, and the closest thing to the finding's own
        two-session transcript:
        1. session A executes the production insert and leaves it uncommitted;
        2. session B asserts its own `SELECT` returns **nothing** — this is the TOCTOU
           window, *forced*, and it is the assertion that proves the leading read cannot
           see the winner and therefore that correctness cannot depend on it;
        3. session A **commits**;
        4. session B calls the **production `AccessRepository.grant_access`** and must
           return the winner's row with no exception and with `permission` equal to **A's**
           value, not B's.
        No concurrency: the ordering is fixed by the test, not by the scheduler.
      - **`test_committed_conflict_is_absorbed_without_an_exception`** — the sharpest
        discriminator in the block and it needs no concurrency at all. Session A commits
        the row; session B executes the **production** `pg_insert` statement directly and
        asserts it raises **nothing** and returns **no row**. Pre-fix the same statement is
        `IntegrityError`/`23505`.
      - Every test that creates rows cleans them up (`dashboard_access` cascades from both
        `users` and `dashboards`, but be explicit).

      `TestNoOpBranchContract` — the two assertions the plan explicitly asks for:
      - **`test_existing_row_branch_returns_a_dashboard_access`**: pre-create the pair,
        call `grant_access`, assert `isinstance(result, DashboardAccess)`, and assert the
        unchanged `AccessRepository.check_access` agrees with `result.permission`. This is
        the defined no-op branch, proven to exist and to return what `IAccessRepository`
        declares.
      - **`test_declared_contract_matches_the_implementation`**: assert
        `AccessRepository.grant_access` is still a concrete override of
        `IAccessRepository.grant_access` and that the declared return annotation still
        admits what the implementation returns. Keep it light — a signature/annotation
        comparison via `inspect`, not a type-checker substitute (the interface module is
        under `ignore_errors = true`). Comment states that the gate does not check this.

  - path: tests/test_dashboards_access_api.py
    change: new
    targets:
      - type: class
        name: TestGrantDashboardAccessEndpoint
    instructions: |
      New module: the endpoint has **zero** route-level tests today. This module is the
      first, and its job is to pin the chosen contract.

      Use `authenticated_client` (its token is an **admin** — this endpoint's service
      performs no role check of its own, phase 12's `AUTZ-001`/`AUTZ-002`), `async_db_session`
      for setup, and `async_session_maker` for every independent re-read.

      Setup for the contract tests: create a second `User` with a `uuid4()`-derived email
      and a `Dashboard` via `UserRepository.create` / `DashboardRepository.create` +
