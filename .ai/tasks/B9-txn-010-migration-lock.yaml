acceptance_criteria:
  - >-
    `alembic/env.py` contains **no** `text(f"` and no f-string, `%`-format or concatenation in either lock
    statement. Both use `text("…:lock_key")` with `{"lock_key": MIGRATION_ADVISORY_LOCK_KEY}`.
  - >-
    `MIGRATION_ADVISORY_LOCK_KEY = 42` is defined **exactly once** in the Python sources, in
    `src/mkobi/db/migration_lock.py`, and is imported by `alembic/env.py` under the same name.
  - >-
    Acquisition uses `pg_try_advisory_lock` behind `retry_migration_lock_acquisition`, with
    `MIGRATION_LOCK_MAX_ATTEMPTS = 30`, `MIGRATION_LOCK_RETRY_INTERVAL_SECONDS = 10.0` and **no backoff** — one
    fixed `asyncio.sleep(interval_seconds)` per retry, no multiplier, no cap constant.
  - >-
    A permanently refused lock makes `run_async_migrations` **raise `RuntimeError`** and the migration **not run**.
    No warning-and-continue path exists anywhere in the file.
  - >-
    There is **exactly one** unlock statement. It lives in a `finally` wrapping only
    `connection.run_sync(do_run_migrations)`, and the refusal `RuntimeError` is raised **before** that
    `try`/`finally` is entered — so a refusal issues no unlock, and both the success path and every migration
    failure do.
  - >-
    The unlock's own failure is caught, **logged at `warning` with the exception interpolated** (not silently
    swallowed, not `exc_info=True`), and does not replace the migration's exception.
  - >-
    The helper emits **only `warning` lines** (per retry + one final), and the final one carries the lock key, the
    attempt count, the total seconds waited and **the operator's next action**. No `info`, `debug` or `error` call
    exists in `mkobi.db.migration_lock`.
  - >-
    `env.py` emits exactly **one** lock log line, at `info` on `alembic.env`, on successful acquisition.
  - >-
    No `sleep` occurs after the final attempt and none after a success; the final warning is emitted exactly once
    and never on success.
  - >-
    `run_async_migrations`'s docstring names, as **not** covered by the lock, everything
    `DatabaseStarter.startup` does after `alembic upgrade head` returns: the admin user, the development seeders,
    orphan temp-file cleanup, old-log cleanup and test-database recreation. It also states that the lock is
    session-scoped and guards the migration run only.
  - >-
    `tests/test_migration_lock.py` exists with **seven** cases in two classes: five retry-logic cases (first-attempt
    success with no sleep and no warning; success after N refusals with exact call/sleep/warning counts; permanent
    refusal returning `False` with the next action in the last warning; `max_attempts=1` producing one call, zero
    sleeps and one final warning; the interval passed to `sleep` on every retry) and two source-contract cases (no
    `text(f"` and no interpolated lock statement in `alembic/env.py`, with both bind-parameter statements present;
    and `42` defined once, in the new module).
  - >-
    **Discrimination demonstrated, not asserted.** With `retry_migration_lock_acquisition` reduced to a single
    `try_acquire()` call and `return`, `test_lock_is_acquired_after_several_refusals` **fails** (it returns `False`
    after one call). With the loop's off-by-one inverted, `test_no_sleep_and_no_retry_warning_after_the_final_attempt`
    **fails**. With the retry helper deleted and the old blocking acquire restored,
    `test_env_py_binds_the_lock_key_rather_than_interpolating_it` **fails**. Restore and re-run to green; record the
    observed pre-fix outcomes in the commit body.
  - >-
    The whole suite runs in **well under a second** for `tests/test_migration_lock.py` — no real sleeps, no
    database, no Alembic.
  - >-
    `run_migrations_offline`, `do_run_migrations`, `run_migrations_online`, the `context.is_offline_mode()`
    dispatch, the `fileConfig` call, the model imports, the `db_url` resolution, the
    `create_async_engine(..., poolclass=pool.NullPool)` call and the trailing `await connectable.dispose()` are
    byte-identical to HEAD in `alembic/env.py`.
  - >-
    `src/mkobi/db/advisory_lock.py`, `src/mkobi/db/starter.py`, `Makefile.ps1`, `alembic.ini`, `pyproject.toml`,
    `src/mkobi/models/enums.py` and `src/mkobi/utils/exceptions.py` are byte-identical to HEAD.
  - >-
    No `ErrorCode` member, no new exception class, no `AppException`, no `StrEnum` member, no `config.py` setting,
    no Alembic revision, no schema change, no API/OpenAPI change, no frontend change.
  - >-
    `docs/06-backend/architecture.md` gained content **only** in §"Step 3: Alembic Migrations";
    `docs/10-deployment/deployment.md` changed by **exactly one** bullet; `docs/SPEC.md` gained **exactly one** row
    (`3.16`) and rows `3.14`/`3.15` are byte-identical.
  - >-
    Both quality gates still name `alembic/env.py` individually and pass: `.\Makefile.ps1 lint` and
    `.\Makefile.ps1 typecheck` are green, with `Makefile.ps1` and the `exclude` lists in `pyproject.toml`
    unmodified.
  - >-
    English only in docstrings, comments and log messages; no `print()`; type hints on the new coroutine and on
    every new test; no audit or plan identifiers in committed code, tests, comments, docstrings, log messages or
    the version row.


out_of_scope: |
  Everything below is another phase's, another block's, or a pre-existing defect this finding does not name. Do
  not touch it, and do not "improve" it while passing through. Widening the block to fix any of these is a scope
  failure, not diligence.

  - **TXN-011's election half — already shipped in `4a5db54`.** `core/reconciler_lease.py` and the lease-guarded
    loop in `start_stale_processing_cleanup_task` are not to be rebuilt, re-tuned or re-documented. **No** second
    advisory key for the sweep, and no relocation of the sweep into `rq-worker` — TXN-011's recommendation listed
    that as an option and the plan routed it to phase 01 (`TOPO-001`, the inert `rq-worker`).
  - **`src/mkobi/db/starter.py`** — B8's file. `DatabaseStarter.startup`, `_apply_migrations`,
    `recreate_test_database` and the transactional grants are not this block's. Read `startup` for the
    "what it does not cover" list; **do not edit it**.
  - **`src/mkobi/app.py`, `app.py::lifespan`, the lease, the sweep interval, `cleanup_stale_processing_logs`.** Not
    this block's.
  - **`src/mkobi/db/advisory_lock.py`** — the B2 rebuild exclusion, shipped and validated. Not edited, not
    re-derived, not re-namespaced. Do not "share" the two modules' constants.
  - **`Makefile.ps1` and the `exclude` lists in `pyproject.toml`.** The gates naming `alembic/env.py` individually
    stay exactly as they are. Do not remove `alembic/` from `[tool.mypy] exclude` to "fix" the coverage — that
    widens the gate and is forbidden by the plan.
  - **`alembic.ini`.** In particular **do not** add a logger section for `mkobi` to make an `info` visible. The
    design accepts that the helper emits only warnings precisely so no logging configuration has to change.
  - **The blocking `lock_timeout` alternative.** B2's whole ruling was that PostgreSQL has no per-lock timeout;
    do **not** add `set_config('lock_timeout', …)` to the migration path. The bounded retry replaces it, and
    reusing `DATABASE__LOCK_TIMEOUT_MS` here would give one number two meanings.
  - **`await connectable.dispose()` on the failure path.** Recorded above as skipped-on-failure at HEAD. Do not
    restructure it into a `try`/`finally`; note it in the commit body.
  - **A `StrEnum` for the retry policy, or a `StrEnum` member for the lock key.** The key is an `int` for
    `pg_try_advisory_lock`; an enum would be an `int`-valued `StrEnum` used once. Plain module constants are the
    house style here (cf. `STARTER_POOL_SIZE`, `REBUILD_LOCK_NAMESPACE`, `LOCK_TIMEOUT_SQLSTATE`).
  - **Configurable attempts / interval via `src/mkobi/config.py` or `settings/`.** Rejected in the ruling: this is
    a one-shot migration path with no operator-tunable need, and adding a setting makes it a value nobody can reach
    in the shipped compose files — the same defect B7 recorded for `pool_pre_ping`.
  - **`docs/06-backend/architecture.md` §"Step 4: Admin User Creation"** (the false SAVEPOINT sentence), §"Stale
    Processing Log Cleanup" and §"Connection-Pool Budget". **B10 and B7 own those**; B10's whole reason for being
    last is that it writes those sentences against final code.
  - **`docs/06-backend/configuration.md`'s least-privilege paragraph.** B8's file. Not this block's.
  - **`.ai/audit/**` and every other audit artefact** — never edited, per B0's convention.
  - **Any other lock in the system.** B2's per-dashboard rebuild exclusion, `core/reconciler_lease.py`'s Redis
    lease, and any lock `DatabaseStarter` or the seeders use are all out of scope. This block rewrites exactly the
    three statements named by TXN-010 and TXN-011.


