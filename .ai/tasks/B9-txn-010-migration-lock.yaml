id: task_b9_txn_010_migration_lock

title: >
  B9 / TXN-010 lock half + TXN-011 — the Alembic migration lock binds its key as a parameter,
  retries a bounded number of times, and refuses to migrate when the lock is lost

status: pending
priority: medium
depends_on: []

source_reference: C:\py_dev\mkobi\.ai\plans\03-db-concurrency-remediation.md
source_section: B9 — Fix the Alembic advisory lock's shape (TXN-010 lock half + TXN-011)
source_blocks:
  - "B9 — Fix the Alembic advisory lock's shape (TXN-010 lock half + TXN-011)"
  - "B9 design ruling (Planner) — settled 2026-10-02"
  - "Correction 1 — `alembic/env.py` does not manipulate `sys.path`, and it already imports the package"
  - "Ruling R-B9 — FAIL CLOSED on a refused lock"
  - "Ruling R-B9-shape — the retry shape (no further choice)"
  - "Ruling R-B9-helper — extract the retry loop; it is the only way to test any of this"
  - "Ruling R-B9-unlock — one unlock, in one `finally`, entered only after acquisition"


description: >
  One code region, two findings. `alembic/env.py::run_async_migrations` builds its advisory-lock calls as
  `text(f"SELECT pg_advisory_lock({MIGRATION_ADVISORY_LOCK_KEY})")` — a direct violation of the project's
  no-f-string-SQL rule that `ruff` cannot catch, in a file that both quality gates now name individually
  (`8178610`, `7e37aa2`). The same call uses the **blocking** form with no `lock_timeout`, so a blocked process
  waits as long as the holder's migration takes and **nothing logs the wait**. Its docstring claims the lock
  prevents concurrent migrations and never says what it does **not** cover — and it covers nothing
  `DatabaseStarter.startup` mutates *after* `alembic upgrade head` returns: the admin user, the development
  seeders, orphan temp-file cleanup, old-log cleanup, and test-database recreation.

  **TXN-011's election half is already shipped** (`4a5db54`): `core/reconciler_lease.py` and the lease-guarded
  loop in `start_stale_processing_cleanup_task`, documented in `docs/06-backend/architecture.md`. **Do not rebuild
  it, do not re-elect a sweeper, do not add a key for the sweep.** The remaining scope is `alembic/env.py` plus the
  one helper module ruled below.

  **The design decision is the work.** The plan's open point — fail closed, or warn and proceed — is **decided:
  fail closed.** `run_async_migrations` raises `RuntimeError` when every attempt at `pg_try_advisory_lock` is
  refused; the process exits non-zero, and because `app`/`test-app` gate on `service_completed_successfully`, the
  deployment stops and an operator reads the log. Retry shape: **30 attempts, 10.0 s fixed interval, no backoff**
  (~4 m 50 s of waiting). Full rationale and cost table in the plan's `Ruling R-B9`.

  Scope: one new module (`src/mkobi/db/migration_lock.py`), one rewritten function body plus docstring in
  `alembic/env.py`, one new test file, three documentation edits. Nothing else.


goals:
  - >-
    Remove the f-string from every statement in `alembic/env.py` that touches the lock: the key is bound as a
    `:lock_key` parameter on both the acquire and the release, so the project's no-f-string-SQL rule holds in the
    one file `ruff` cannot check.
  - >-
    Replace the unbounded blocking `pg_advisory_lock` with `pg_try_advisory_lock` behind a **bounded, logged** retry:
    30 attempts at 10.0 s, no backoff, one warning per refusal that will be retried and one final warning carrying
    the operator's next action.
  - >-
    **Fail closed.** A permanently refused lock must stop the migration, not warn and continue. The one mechanism
    of mutual exclusion the system has must not be reduced to a log line.
  - >-
    Say what the lock **does not cover** — in the `run_async_migrations` docstring and in
    `docs/06-backend/architecture.md`'s Alembic step — so no reader infers that `DatabaseStarter.startup`'s
    post-migration mutations are protected.
  - >-
    Guarantee the release on **every** path that acquired the lock, with **one** unlock statement, and never issue
    an unlock for a lock this session never took.
  - >-
    Make the refusal path testable without Alembic and without a database, by extracting the retry loop into one
    small importable module that holds **three constants and one coroutine** and nothing else.


extra_context: |
  ## Correction 1 — `env.py` does not manipulate `sys.path`; it already imports the package

  The hand-off premise that `alembic/env.py` "manipulates `sys.path` itself" is **false**. The file contains no
  `sys.path` statement; `alembic.ini`'s `prepend_sys_path = .` is what puts the project on the path.

  This matters for exactly one decision — whether importing a `src/mkobi/**` helper from `env.py` is safe — and the
  answer is unaffected. `env.py` already performs `from mkobi.db.models import …` and `from mkobi.config import
  get_config`, both of which pull in the `mkobi.db` package. A new `from mkobi.db.migration_lock import …` adds no
  import edge that does not already exist and introduces no Alembic-specific import into a module that must stay
  runnable by Alembic alone.

  **The helper lives in the package; `env.py` keeps only SQL and control flow.** Do not add a `sys.path` fixup to
  `env.py`, and do not make the helper import anything from `alembic`.

  ## Ruling R-B9 — fail closed, and why warn-and-proceed loses

  **Decision: refuse to migrate.** `run_async_migrations` raises `RuntimeError`; the process exits non-zero; the
  `service_completed_successfully` gate stops `app` and `test-app`.

  | | Shipped topology | Topology the compose files do not cover |
  | - | - | - |
  | Contenders | **one** `migrate` service per stack; `app`, `rq-worker` and `test-app` gate on `service_completed_successfully` | N replicas (or N host processes) each running `alembic upgrade head` |
  | Fail closed | **unreachable** — nothing else takes the key, so attempt 1 succeeds and the cost is zero | the waiter queues, then fails the deployment instead of corrupting the schema |
  | Warn and proceed | unreachable | two `upgrade head` runs interleave DDL on one schema and race the single-row `alembic_version` upsert |

  Three reasons, in order of weight:

  1. **The lock's practical effect is confined to exactly the case where proceeding is most dangerous.** The shipped
     tiers already serialise migrations through Compose, so the try-lock earns nothing there. Its entire value is in
     the uncovered topology — and warn-and-proceed would leave the system with **zero** exclusion, since TXN-011's
     report established this is the only exclusion primitive in the tree.
  2. **Fail closed is the only option whose failure mode is visible.** Non-zero exit → the deployment stops → an
     operator reads the log. Warn-and-proceed's failure mode is silent schema divergence discovered weeks later.
  3. **The real cost of fail closed — a slow holder — is paid by the retry window, not by weakening the refusal.**
     The common race (holder finishes; schema already at `head`; the second `upgrade head` is then a no-op) resolves
     inside the window and becomes a clean sequential run. The residual case is a holder that outlives the window,
     which is a deployment that genuinely should stop and be looked at.

  **Rejected — warn and proceed.** **Rejected — fail closed with no retry**: one slow migration would then fail every
  replica that started alongside it.

  Note the exception type. `RuntimeError`, **not** `AppException`: `AppException` + `ErrorCode` is the *API* layer's
  RFC 7807 mechanism, and Alembic has no HTTP response — it has a process exit code. Do not add an `ErrorCode`
  member, do not import `utils.exceptions` into `alembic/env.py` or into the helper.

  ## Ruling R-B9-shape — the retry shape (no further choice)

  - **30 attempts**, **10.0 s** fixed interval, **no backoff** — `MIGRATION_LOCK_MAX_ATTEMPTS = 30`,
    `MIGRATION_LOCK_RETRY_INTERVAL_SECONDS = 10.0`. Total window `(30 - 1) × 10 s = 290 s` (~4 m 50 s).
  - **Why 30 × 10 s.** Long enough to queue behind a normal or slow migration that includes a data backfill, short
    enough that a genuinely stuck holder fails the deployment inside the time an operator waits before reading logs.
    `DATABASE__LOCK_TIMEOUT_MS` (default 180 000) is **not** reused: that value bounds one rebuild transaction, and
    borrowing it for a schema migration gives one number two unrelated meanings.
  - **Why no backoff.** One peer holds the lock and releases it when it finishes. There is no thundering herd, and
    the contender count in an uncovered topology is single-digit. Exponential backoff would require a cap constant,
    a second constant and a wider window, to serve a case that does not exist here.
  - **The interval is a `float`** (`10.0`), not an `int`, so a test can pass `0.0` and the suite stays fast.

  ## The log lines — exactly three kinds, and the reason for the split

  **`alembic.ini` sets `[logger_root] level = WARNING`.** The helper's logger is `logging.getLogger(__name__)` →
  `mkobi.db.migration_lock` → effective level `WARNING`. So an `info` emitted from the helper is **silently dropped**
  in a real migration run. (`env.py`'s own `alembic.env` logger *is* configured at `INFO` by `alembic.ini`.)

  **Therefore: no `info` inside the helper.** Every line the helper emits is a `warning` and is always visible.

  1. **Per refusal that will be retried** — one line, immediately on the refusal, naming the key, `attempt N/max`,
     and the interval. This is what closes the finding's "nothing logs the wait": the **first** refusal is logged at
     once, not the last.
  2. **One final refusal**, after the last attempt, naming the key, the attempt count, the total seconds waited, and
     **the operator's next action inside the message** — wait for the other migration to finish and re-run, or stop
     it if it is stuck. This is the "agreed next action" the test asserts.
  3. **One `info` in `env.py`, on `alembic.env`, after a successful acquisition.** Not on refusal — the helper's
     final warning already says it, and repeating it would put two lines in the operator's face.

  There is **no** log line between the refusal and the retry sleep other than #1, and **no** `info` on the
  successful acquisition inside the helper.

  ## Ruling R-B9-helper — extract the retry loop; it is the only way to test any of this

  `tests/` never imports `alembic/env.py` — importing it would execute Alembic's module-level dispatch
  (`if context.is_offline_mode(): … else: run_migrations_online()`) with no Alembic context, which is why nothing in
  the suite touches that file today. And a test that shells out to run a real migration cannot exercise a **refused**
  lock without a second process holding it.

  So the retry loop is extracted into **`src/mkobi/db/migration_lock.py`** and driven with a stub attempt callable —
  no database, no Alembic, milliseconds.

  **Rejected — leave the loop inline in `env.py`.** The block's only testable assertion would then be the absence of
  a string in a file: it proves the f-string is gone and says nothing about the refusal behaviour, the attempt count
  or the operator message.

  **Rejected — a test that shells out and runs a real migration.** It proves the success path (the one that already
  worked), it is slow, and it **cannot produce a refusal at all** — so it could never test the one thing this block
  changes.

  **Rejected — a DB-backed two-session test** (hold the key from one session, retry from another). It needs a real
  second backend, real sleeps, and it tests the loop through the network. The seam is the attempt callable; test the
  loop there.

  **Do not let the extraction grow.** The module is **three constants and one `async def`**. Explicitly rejected:
  a lock class, a strategy/protocol abstraction, a callback *interface*, configurable attempts/interval through
  `config.py`, an `ErrorCode` member, a custom exception type, and any `StrEnum` for the retry policy. The policy
  numbers are plain module constants beside `MIGRATION_ADVISORY_LOCK_KEY` — the same shape as
  `db/starter.py`'s `STARTER_POOL_*` block and `db/advisory_lock.py`'s `REBUILD_LOCK_NAMESPACE`.

  ### The signature (use this shape)

      async def retry_migration_lock_acquisition(
          try_acquire: Callable[[], Awaitable[bool]],
          *,
          max_attempts: int = MIGRATION_LOCK_MAX_ATTEMPTS,
          interval_seconds: float = MIGRATION_LOCK_RETRY_INTERVAL_SECONDS,
      ) -> bool:

  `try_acquire` performs **one** non-blocking attempt and returns whether it got the lock. The coroutine returns
  `True` on success and `False` when every attempt was refused, and **never raises for a refusal** — the caller
  decides what a refusal means. `max_attempts` and `interval_seconds` are keyword-only with the module constants as
  defaults purely so a test can shorten them; production always uses the defaults.

  ### `MIGRATION_ADVISORY_LOCK_KEY` moves here

  It is currently a module constant of `alembic/env.py`. It **moves** to `mkobi.db.migration_lock.py`, next to the
  policy that guards it, so the key and the retry shape live together and `42` is defined **once**. `env.py`
  imports it and keeps using the name. **Do not** leave a second definition behind and **do not** inline the literal
  `42` at either SQL site — that would reintroduce the same "key is a magic number duplicated in the file" defect
  this block removes.

  ## Ruling R-B9-unlock — one unlock, in one `finally`, entered only after acquisition

  **What the current code does, read it before changing it:** `run_async_migrations` unlocks **twice** on the
  failure path. The inner `finally` (around `run_sync(do_run_migrations)`) releases the lock and commits; then the
  outer `except Exception` releases it a **second** time and commits, under a bare `except Exception: pass`. The
  second release is dead in the normal case, because the `finally` always runs first.

  **The new shape has one unlock**, and its placement is the guarantee:

  - the refusal `RuntimeError` is raised **before** the `try`/`finally` is entered, so a refusal never issues an
    unlock for a lock this session never took (which would return `false` and be meaningless);
  - the `finally` wraps **only** `connection.run_sync(do_run_migrations)`, so it runs on success and on every
    migration failure, and those are the only two paths that reach it;
  - the unlock's own handler **logs and swallows** rather than `pass`, because an exception raised inside a `finally`
    **replaces** the migration's own exception — and here the swallow is provably safe:
    `pg_try_advisory_lock` is **session-scoped**, so the lock cannot outlive the `async with connectable.connect()`
    block that closes the connection immediately afterwards. Log it at `warning` with the exception interpolated;
    `exc_info=True` would print a traceback for a non-event.

  **Recorded, not this block's:** `await connectable.dispose()` sits after the `async with`, so any failure skips it.
  That is identical to HEAD's behaviour on every failure today, in a one-shot process that is about to exit. **Do
  not restructure it into a `try`/`finally` here** — it is a separate observation for the commit body.

  ## What the lock does NOT cover — the exact list for the docstring

  From `src/mkobi/db/starter.py::DatabaseStarter.startup`, everything that runs **after** `_apply_migrations`
  returns is outside the lock. Name these in the `run_async_migrations` docstring:

  - `ensure_admin_user()` — the admin user upsert;
  - `run_dev_seeders()` — the development seeders;
  - `cleanup_stale_temp_files()` — orphan temp-file cleanup;
  - `cleanup_old_logs()` — the retention-based `DELETE` on `processing_logs`;
  - `recreate_test_database()` — test-database drop/create and its second `_apply_migrations` call.

  Each of those is idempotent today, which is why no exclusion is needed *yet*; the docstring must say the lock does
  not cover them, not imply they are safe by design. Also state that the lock is **session-scoped** (released when
  the connection closes or the backend exits) and that it guards the **migration run only**.

  ## The quality gates must keep naming this file individually

  `Makefile.ps1`'s `lint` and `format` targets run `ruff check [--fix] src/ tests/ alembic/env.py`, and `typecheck`
  runs `mypy src/ alembic/env.py`. These are load-bearing, because **`pyproject.toml` excludes `alembic/` from both
  tools** (`[tool.mypy] exclude = ["alembic/"]`, and ruff's global `exclude` list); naming the file on the command
  line is what pulls it back in.

  **Do not widen or narrow the gate.** Do not remove `alembic/` from either `exclude`, do not add
  `alembic/env.py` to `src/`-style globs, and do not edit `Makefile.ps1`. The gates stay exactly as they are, which
  is why the file is under gate at all.

  ## Documentation — the shape established by B7 and B8

  - `docs/06-backend/architecture.md` §"Step 3: Alembic Migrations" — add the lock's actual scope: the
    try-lock with a bounded retry, **and what it does not cover**. Do not touch §"Step 4: Admin User Creation",
    §"Stale Processing Log Cleanup" (the shipped lease, TXN-011's other half) or §"Connection-Pool Budget" —
    B7 and B10 own those.
  - `docs/10-deployment/deployment.md` §"Migration advisory lock" — it currently describes the **blocking** form
    (`pg_advisory_lock(42)`) and **misattributes** the lock to `_apply_migrations()`; the lock is taken in
    `alembic/env.py`. Correct both, state the retry shape and the refusal.
  - `docs/SPEC.md` — **one new version row `3.16`**, following the established shape: `| 3.16 | 2026-10-02 |
    Database concurrency remediation, continuation (plan: \`.ai/plans/03-db-concurrency-remediation.md`). … |`, with
    bolded lead-ins per change. Rows `3.14` (B7) and `3.15` (B8) stay byte-identical.


files:
  - path: src/mkobi/db/migration_lock.py
    change: add
    targets:
      - type: module
        name: mkobi.db.migration_lock
    instructions: |
      **New module. Three constants and one coroutine — nothing else.**

      Follow the shipped sibling `src/mkobi/db/advisory_lock.py` exactly in shape, because it is the house style
      for this kind of decision: a module docstring that states what the mechanism is, why, and the **rejected
      alternatives one clause each**; then `logger = logging.getLogger(__name__)`; then module constants; then typed
      public functions with Google-style docstrings (`Args:` / `Returns:` / `Note:`).

      Contents:

      1. **Module docstring.** State: the lock is `pg_try_advisory_lock` (session-scoped) behind a bounded retry;
         the bound is 30 attempts at 10.0 s; **a permanently refused lock refuses to migrate**; and the rejected
         alternatives, one clause each —
         `pg_advisory_lock` (the form this replaces: an unbounded, unlogged wait),
         `lock_timeout` (bounds every lock wait in the session, not only this one, and a migration legitimately
         exceeds a rebuild's bound),
         exponential backoff (one holder, no herd; a wider window and two more constants for a case that does not
         exist),
         warn-and-proceed (leaves the system with no exclusion at all in the only topology that needs one),
         `pg_advisory_xact_lock` (transaction-scoped; Alembic's own per-migration transactions would release it
         between revisions, so it would not exclude the run).
         Note that `db/advisory_lock.py` owns the rebuild exclusion and that the two key spaces are kept apart by
         the derivation namespace there — do not restate the rebuild key derivation here.

      2. **`MIGRATION_ADVISORY_LOCK_KEY = 42`** — moved verbatim from `alembic/env.py`. Add a short comment saying
         it is the shared, deliberately-fixed key for the migration run and that the value is unchanged.

      3. **`MIGRATION_LOCK_MAX_ATTEMPTS = 30`** and **`MIGRATION_LOCK_RETRY_INTERVAL_SECONDS = 10.0`** — with a
         one-line comment giving the resulting window (≈4 m 50 s) and why `DATABASE__LOCK_TIMEOUT_MS` is not reused
         here.

      4. **`async def retry_migration_lock_acquisition(try_acquire, *, max_attempts=…, interval_seconds=…) -> bool`**
         — the signature above. The body is a plain loop; it must be obviously correct at a glance:

             for attempt in range(1, max_attempts + 1):
                 if await try_acquire():
                     return True
                 if attempt < max_attempts:
                     logger.warning(<retry line: key, attempt, max_attempts, interval_seconds>)
                     await asyncio.sleep(interval_seconds)
             logger.warning(<final line: key, max_attempts, total waited, operator next action>)
             return False

         Required properties, each of which the tests pin:
         - **no `sleep` after the last attempt** (so `max_attempts=1` yields exactly one attempt, zero sleeps, and
           exactly one warning — the final one);
         - **no trailing `sleep` after a success**;
         - `try_acquire` is called **at most** `max_attempts` times;
         - the final warning is emitted **once**, after the loop, and never when the lock was acquired;
         - the total-seconds figure in the final warning is `interval_seconds * (max_attempts - 1)`, so it is `0`
           when `max_attempts` is `1`;
         - the coroutine **never raises for a refusal** and returns `bool`.

         **No `info`, `debug` or `error` call in this module** — see the log-level ruling above. Only the two
         `warning` calls exist.

      **Imports allowed:** `asyncio`, `logging`, `typing.Awaitable`, `typing.Callable`. Nothing from
      `sqlalchemy`, `alembic`, `mkobi.config` or `utils.exceptions`. The module must stay importable in the
      Alembic runtime with no other `mkobi` package loaded.

  - path: alembic/env.py
    change: modify
    targets:
      - type: function
        name: run_async_migrations
      - type: constant
        name: MIGRATION_ADVISORY_LOCK_KEY
    semantic_anchors:
      - "module scope — `MIGRATION_ADVISORY_LOCK_KEY = 42` and its two-line leading comment (deleted here; the name is re-imported)"
      - "module imports — the `from sqlalchemy import Connection, pool, text` line and the `from mkobi.db.models import ( … )` block"
      - "run_async_migrations — its docstring"
      - "run_async_migrations — `async with connectable.connect() as connection:` and everything inside it: the blocking acquire, `await connection.commit()`, the inner `try: … finally:` around `run_sync(do_run_migrations)`, and the outer `except Exception:` re-unlock"
      - "run_async_migrations — the trailing `await connectable.dispose()`"
    instructions: |
      **The only file whose behaviour changes.**

      1. **Delete** the local `MIGRATION_ADVISORY_LOCK_KEY = 42` constant and its leading comment, and add
         `from mkobi.db.migration_lock import (MIGRATION_ADVISORY_LOCK_KEY, MIGRATION_LOCK_MAX_ATTEMPTS, MIGRATION_LOCK_RETRY_INTERVAL_SECONDS, retry_migration_lock_acquisition)`.
         Place it with the other `mkobi` imports; run `.\Makefile.ps1 format` afterwards so isort orders it.
         **All four names are used** — an unused import fails `ruff`'s `F401`.

      2. **Rewrite `run_async_migrations`'s docstring.** It must state, in prose:
         - the run is guarded by `pg_try_advisory_lock(MIGRATION_ADVISORY_LOCK_KEY)` — **session-scoped**,
           released when the connection closes or the backend exits, and explicitly released in a `finally`;
         - the wait is **bounded** (30 attempts × 10.0 s ≈ 4 m 50 s) and **every refusal is logged**;
         - a lock that cannot be taken is a **refusal to migrate**, not a warning;
         - **what it does not cover**: the admin user, the development seeders, orphan temp-file cleanup, old-log
           cleanup and test-database recreation all run in `DatabaseStarter.startup` **after** `alembic upgrade head`
           returns and are therefore unprotected by this lock (they are idempotent today; this is not a design
           claim about them).

      3. **Replace the body inside `async with connectable.connect() as connection:`** with this shape, in this
         order — the ordering *is* the correctness argument:

             async def _try_acquire() -> bool:
                 """One non-blocking attempt at the session-scoped migration lock."""
                 result = await connection.execute(
                     text("SELECT pg_try_advisory_lock(:lock_key)"),
                     {"lock_key": MIGRATION_ADVISORY_LOCK_KEY},
                 )
                 return bool(result.scalar())

             acquired = await retry_migration_lock_acquisition(_try_acquire)
             if not acquired:
                 raise RuntimeError(<message naming key, attempts, total waited, and the refusal to migrate>)

             logger.info("Acquired migration advisory lock %s", MIGRATION_ADVISORY_LOCK_KEY)
             try:
                 await connection.run_sync(do_run_migrations)
             finally:
                 try:
                     await connection.execute(
                         text("SELECT pg_advisory_unlock(:lock_key)"),
                         {"lock_key": MIGRATION_ADVISORY_LOCK_KEY},
                     )
                     await connection.commit()
                 except Exception as exc:
                     logger.warning(<message naming key and exc; the session is closing and PostgreSQL releases
                                     session-scoped locks with it>)

         Binding points:
         - **Both SQL statements bind `:lock_key`.** No f-string, no literal `42`, no `%`-formatting. This is the
           part of the block `ruff` cannot check and is the reason the file is under gate — the test in
           `tests/test_migration_lock.py` pins it.
         - **`bool(result.scalar())`** — `pg_try_advisory_lock` returns one boolean; `scalar()` is the accessor.
         - **The refusal `RuntimeError` is raised before the `try`/`finally`.** This is what guarantees no unlock is
           issued for a lock this session never took.
         - **The `finally` wraps only `run_sync(do_run_migrations)`.** The outer `except Exception:` block that
           re-unlocked is **deleted**, and the inner bare `except Exception: pass` becomes a `logger.warning`.
         - `_try_acquire` is **nested inside `run_async_migrations`** and closes over `connection`. Do not promote it
           to module scope, do not add `functools.partial`, do not pass `connection` into the helper.
         - `logger.info` goes on `env.py`'s existing `logging.getLogger("alembic.env")`, which `alembic.ini`
           configures at `INFO`.

      4. **Everything else in the file is byte-identical.** Specifically untouched: `run_migrations_offline`,
         `do_run_migrations`, `run_migrations_online`, the `context.is_offline_mode()` dispatch at the bottom, the
         `fileConfig` call, the model imports, the `db_url` resolution and its `postgresql://` rewrite, the
         `create_async_engine(..., poolclass=pool.NullPool)` call, and the trailing `await connectable.dispose()`.
         **Do not** wrap the dispose in a `try`/`finally` (recorded above as out of scope).

