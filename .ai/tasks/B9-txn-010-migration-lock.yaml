constraints:
  architecture:
    - >-
      **No f-string SQL, anywhere.** Both lock statements bind `:lock_key`. This is the part of the block `ruff`
      cannot catch — the finding exists because `ruff` has no rule for it — and it is the whole reason the file is
      under gate. An f-string inside a **log message** or an **exception message** is fine and matches the house
      style; an f-string that builds a statement is not.
    - >-
      **The helper holds no SQL and imports no database library.** `mkobi.db.migration_lock` imports only
      `asyncio`, `logging` and two names from `typing`. The SQL stays in `alembic/env.py`, in the one function that
      already owned it. This is what keeps the extraction from becoming an abstraction: the testable part is the
      loop, and the loop has no opinions about SQL.
    - >-
      **`env.py` stays runnable by Alembic alone.** No Alembic-specific import may enter the helper, and the helper
      must not import `mkobi.config`, `mkobi.models` or anything else that would change what `env.py` pulls in.
      Its only imports are `asyncio`, `logging` and `typing`.
    - >-
      **`RuntimeError`, not `AppException`.** `AppException` + `ErrorCode` is the API layer's RFC 7807 mechanism;
      Alembic has a process exit code, not an HTTP response. No new `ErrorCode` member, no
      `utils.exceptions` import, no status-mapping change.
    - >-
      **`StrEnum` for constants does not apply here, and adding one would be over-engineering.** The lock key is an
      `int` for `pg_try_advisory_lock`; the retry policy is two numbers. Both are plain module constants beside
      `MIGRATION_ADVISORY_LOCK_KEY`, matching `STARTER_POOL_*` in `db/starter.py` and `REBUILD_LOCK_NAMESPACE` /
      `LOCK_TIMEOUT_SQLSTATE` in `db/advisory_lock.py`.
    - >-
      **The quality gates stay exactly as they are.** `Makefile.ps1`'s `lint`/`format`/`typecheck` targets keep
      naming `alembic/env.py` individually, and `pyproject.toml` keeps excluding `alembic/` from both tools. Do not
      widen, narrow or "tidy" either.
    - >-
      **One function, one concern.** The new module is three constants and one coroutine. No class, no protocol,
      no registry, no factory, no `config.py` plumbing. `env.py` keeps its existing shape: a nested `_try_acquire`
      closure over `connection`, then the helper call, then the refusal, then the guarded `try`/`finally`.
  correctness:
    - >-
      **Fail closed.** A permanently refused lock must raise and must **not** run the migration. There is no
      warn-and-continue branch anywhere in the file, and adding one undoes the ruling.
    - >-
      **The refusal `raise` is above the `try`/`finally`, never inside it.** This is the guarantee that no unlock
      is issued for a lock the session never took.
    - >-
      **Exactly one unlock, in a `finally` wrapping only `run_sync(do_run_migrations)`.** Both the success path and
      every migration failure must release the lock; the refusal path must not attempt to.
    - >-
      **The unlock's own failure is caught and logged, never raised.** An exception raised in a `finally` replaces
      the migration's exception, and the migration's exception is the informative one. The swallow is safe
      *because* the lock is session-scoped and the connection closes immediately after: record that reasoning in
      the comment, or the next reader will "fix" the swallow into a leak.
    - >-
      **No sleep and no "retrying" warning after the final attempt**, and none after a success. The final warning
      is emitted exactly once, only when the lock was never acquired, and it is the only place the operator's next
      action appears.
    - >-
      **`try_acquire` is called at most `max_attempts` times**, and the total-seconds figure in the final warning
      is `interval_seconds * (max_attempts - 1)` so it is `0` when `max_attempts` is `1`.
    - >-
      **The helper never raises for a refusal.** Exceptions from `try_acquire` itself propagate — a broken
      connection is a real failure and must not be retried as if the lock were merely held.
    - >-
      **Only `warning` inside the helper.** `alembic.ini` sets `[logger_root] level = WARNING`, so an `info` from a
      `mkobi.*` logger is silently dropped in a real migration run. Do not "fix" this by editing `alembic.ini` or by
      adding a logger section.
  process:
    - "English only — docstrings, comments and log messages."
    - "No `print()`; the helper uses `logger = logging.getLogger(__name__)`, `env.py` keeps `logging.getLogger(\"alembic.env\")`."
    - "No pandas. This block touches no data processing."
    - "Type hints on the new coroutine (including `-> bool`) and on every new test signature, including `-> None`."
    - >-
      **No audit or plan identifiers in committed code, tests, comments, docstrings, log messages or the version
      row.** No block IDs, no finding IDs, no ruling IDs, no phase references. "a lost migration lock refuses
      rather than proceeding" reads correctly on its own.
    - >-
      Comments only where non-obvious: why the refusal precedes the `try`/`finally`, why the unlock swallows, why
      the helper emits only warnings, and why the retry window is the size it is. No narration of the next line.
    - >-
      Run `.\Makefile.ps1 format` before committing — it runs `ruff check --fix`, which is what sorts imports.
    - >-
      One commit for the whole block (production + tests + the three documentation edits), so the behaviour change
      and its evidence land together. Reference the plan and the findings **by name**, not by ID, in the body.
  testing:
    - >-
      **Verify logic, not implementation detail.** Do not assert that `MIGRATION_LOCK_MAX_ATTEMPTS == 30` or that
      the interval is `10.0` — those are the ruling's numbers, recorded in the docstring, the module docstring and
      the documentation. Assert what the retry logic *does*: how many times it calls the attempt callable, how many
      times it sleeps, with what argument, what it logs, and what it returns.
    - >-
      **Short intervals, real patches.** Every test passes `interval_seconds=0.0` or a small float **and** patches
      `asyncio.sleep`, so no test ever sleeps. The suite must stay fast and must not be a hidden timing dependency.
    - >-
      **Every test must be shown to fail against the defect it covers** (step 7). A test that passes either way is
      worse than no test, because it reads as coverage.
    - >-
      **No database, no Alembic, no network** in `tests/test_migration_lock.py`. The retry logic is testable through
      the attempt callable; there is no reason to reach for a second session.


