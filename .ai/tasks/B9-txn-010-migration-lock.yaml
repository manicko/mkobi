      Use `unittest.mock.AsyncMock` (or a hand-rolled counting async stub) for the attempt callable and
      `monkeypatch`/`unittest.mock.patch` on `mkobi.db.migration_lock.asyncio.sleep` so no test ever sleeps for real.
      A hand-rolled stub is preferred for the attempt callable because it makes the call **count** the assertion:

          attempts = 0
          async def _stub() -> bool:
              nonlocal attempts
              attempts += 1
              return attempts > 2

      Two classes:

      **`TestMigrationLockRetry`** — the logic. `@pytest.mark.asyncio`.

      1. `test_lock_is_acquired_on_the_first_attempt` — the stub succeeds immediately. Assert the result is `True`,
         the attempt callable was called **exactly once**, `asyncio.sleep` was **not** called, and **no** warning was
         logged (success logs nothing from the helper).
      2. `test_lock_is_acquired_after_several_refusals` — the stub refuses twice then succeeds, with
         `max_attempts=5`, `interval_seconds=0.0`. Assert `True`, **exactly three** calls, exactly **two** sleeps,
         and exactly **two** retry warnings (one per refusal that was retried, and **not** one for the successful
         attempt). This is the case that fails against a single-attempt implementation.
      3. `test_permanent_refusal_returns_false_and_states_the_next_action` — the stub always refuses,
         `max_attempts=3`, `interval_seconds=0.0`. Assert the result is `False`, exactly **three** calls, and that
         the **last** warning record names the lock key, the attempt count, the total waited, and the operator's
         next action — match on distinctive substrings of the agreed message, not on the whole string. Assert no
         exception escaped (the helper must not raise for a refusal).
      4. `test_no_sleep_and_no_retry_warning_after_the_final_attempt` — `max_attempts=1`, always refuses. Assert
         exactly **one** call, `asyncio.sleep` **not** called, and **exactly one** warning whose text is the final
         refusal (it must not claim a retry is coming). This pins the off-by-one in both directions.
      5. `test_interval_is_passed_to_sleep_on_every_retry` — three refusals then success,
         `max_attempts=4`, `interval_seconds=0.25`. Assert `asyncio.sleep` was awaited with `0.25` exactly **three**
         times and never with anything else. Pins that the configured interval is the one used.

      **`TestMigrationLockSourceContract`** — the plan's f-string check, as a test. Match the
      `tests/test_config.py` precedent of reading a project file from
      `Path(__file__).resolve().parent.parent`. No database fixture, no network.

      6. `test_env_py_binds_the_lock_key_rather_than_interpolating_it` — read `alembic/env.py` as text and assert
         `text(f"` does not occur, and that the file contains no `text("SELECT pg_advisory_lock(` / no
         `text("SELECT pg_advisory_unlock(` / no `text("SELECT pg_try_advisory_lock(` — i.e. **neither** lock
         statement interpolates. Also assert both statements are present **with** a `:lock_key` bind parameter, so
         the test cannot be passed by deleting the lock entirely.
      7. `test_env_py_defines_no_local_lock_key` — assert `MIGRATION_ADVISORY_LOCK_KEY = 42` appears **once** in
         the repository's Python sources (walk `alembic/` and `src/mkobi/`) and that the single definition is in
         `mkobi.db.migration_lock`, so a reader cannot end up with two keys in two files. Keep the walk to
         `alembic/env.py` plus `src/mkobi/db/` — do not walk the whole repository.

      **No existing test file is modified.** `tests/test_advisory_lock.py` is the sibling precedent and stays
      untouched.

