[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0", "wheel>=0.37.1"]

[project]
name = "mkobi"
version = "1.0.8"
authors = [
    { name = "mko", email = "manicko@yandex.ru" },
]

description = "Own bi"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.4",
    "pydantic-settings[yaml]>=2.2.1",
    "sqlalchemy>=2.0.29",
    "polars>=0.20.16",
    "plotly>=5.20.0",
    "bcrypt>=5.0.0",
    "python-jose>=3.3.0",
    "httpx>=0.28.1",
    "email-validator>=2.3.0",
    "python-multipart>=0.0.26",
    "redis>=7.4.0",
    "requests>=2.33.1",
    "alembic>=1.18.4",
    "asyncpg>=0.30.0",
    "asgiref>=3.11.1",
    "pyjwt>=2.12.1",
    "rq>=2.8.0",
    "tenacity>=9.1.4",
    "aiofiles>=25.1.0",
    "platformdirs>=4.0.0",
    "python-magic>=0.4.27",
]

classifiers = [
    'Programming Language :: Python :: 3.13',
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

# SPDX license expression (replaces deprecated license classifiers)
license = "MIT"

[project.urls]
Homepage = "https://github.com/manicko/mkobi"
Issues = "https://github.com/manicko/mkobi"

[project.scripts]
mko-get-mediascope = "mkobi.app:app"


[tool.setuptools]
# https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html
platforms = ["Linux", "Windows"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["mkobi", "mkobi.*"]
exclude = ["tests/.pytest_cache*"]
namespaces = false

# Black configuration
[tool.black]
line-length = 88
skip-string-normalization = false
include = '\.pyi?$'
exclude = '''
/(
    \.venv
  | build
  | dist
  | migrations
  | __pycache__
)/
'''

# isort configuration (used by isort hook)
[tool.isort]
profile = "black"
known_first_party = ["mkobi", "settings", "core"]
combine_as_imports = true

# Ruff top-level global settings
[tool.ruff]
line-length = 88
fix = false   # IMPORTANT: do NOT auto-fix by default
# global excludes (keeps ruff from checking virtual envs and build artifacts)
exclude = [
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".mypy_cache",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Newer Ruff config: put lint-specific options under [tool.ruff.lint]
[tool.ruff.lint]
select = [
    "E", # PEP8 errors
    "F", # Pyflakes
    "I", # import-sorted checks (ruff checks imports)
    "B", # bugbear (best practices)
    "UP", # pyupgrade rules
]
# We ignore line length because Black enforces it
ignore = [
    "E501",
    "B008",  # FastAPI Depends() in default args is valid pattern
    # optionally ignore import-sort warning which is handled by isort:
    "I001",  # "Import block is unsorted or unformatted" if you prefer isort to run
]
# Specific ruff.isort-related options (only ruff-supported keys)
# Note: do NOT set profile here (ruff doesn't accept "profile" key)
[tool.ruff.lint.isort]
known-first-party = ["mkobi", "settings", "core"]
combine-as-imports = true

# Per-file ignores for false positives
[tool.ruff.lint.per-file-ignores]
"src/mkobi/db/models/*.py" = ["F821", "E402"]  # Forward references in SQLAlchemy models, TYPE_CHECKING imports
"tests/*" = ["E731"]  # Lambda in tests (simplified for testing)
"src/mkobi/core/permissions.py" = ["F821"]  # FastAPI Depends(get_db) pattern
"src/mkobi/interfaces_old/*.py" = ["UP046"]  # Old interfaces, not used

# Ruff formatting section
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
preview = true

# MyPy config (project-level)
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
follow_imports = "skip"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["mkobi.*"]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["mkobi.db.models.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["mkobi.interfaces.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_any_generics = false
warn_return_any = false


[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib -ra -v --strict-markers --cov-fail-under=65"
console_output_style = "classic"
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["src/mkobi"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
fail_under = 65
show_missing = true

[dependency-groups]
dev = [
    "black>=26.1.0",
    "isort>=7.0.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.1",
    "pandas-stubs==3.0.0.260204",
    "mypy>=1.10.0",
    "twine>=5.0.0",
    "flake8>=7.3.0",
    "types-requests>=2.33.0.20260408",
    "testcontainers[postgres,redis]>=4.0.0",
    "types-pyyaml>=6.0.12.20260408",
    "autopep8>=2.3.2",
    "types-aiofiles>=25.1.0.20260508",
    "libcst>=1.8.6",
    "pytest-xdist>=3.0.0",
    "watchfiles>=1.0.0",
]